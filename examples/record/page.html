<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bashy record · {{KIND}}</title>
<style>
:root{--bg:#111110;--panel:#1c1c1a;--fg:#f1f0eb;--muted:#a3a29b;--accent:#e8b04a;--rec:#e5484d;--ok:#46a758}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
header{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header b{font-size:1rem}header span{color:var(--muted);font-size:.85rem}
.prompt{flex:none;color:var(--muted);font-size:.95rem}
.stage{flex:1;min-height:0;position:relative;background:#000;border-radius:12px;overflow:hidden}
video,img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#preview{transform:scaleX(-1)}
.badge{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums;z-index:3}
.badge.rec{background:var(--rec)}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:8rem;font-weight:700;background:rgba(0,0,0,.35);z-index:4}
.prompter{position:absolute;left:0;right:0;top:0;height:40%;overflow:hidden;z-index:2;background:linear-gradient(rgba(0,0,0,.78) 75%,rgba(0,0,0,0))}
.prompter .text{position:absolute;left:0;right:0;padding:0 8%;font-size:clamp(1.3rem,3vw,2.3rem);line-height:1.4;white-space:pre-wrap;text-align:center;text-shadow:0 1px 3px #000}
.prompter::before{content:"";position:absolute;left:6%;right:6%;top:30%;border-top:2px solid var(--accent);opacity:.45;z-index:1}
.controls{flex:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;background:#2b2b28;color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:#1a1a18;font-weight:600}
button.rec{background:var(--rec);color:#fff;font-weight:600}
button.ok{background:var(--ok);color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:default}
label{color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center}
.msg{color:var(--muted)}
.done{font-size:1.2rem;color:var(--ok)}

body.pm .stage{position:absolute;top:10px;right:12px;width:min(26vw,360px);height:auto;aspect-ratio:16/9;flex:none;z-index:5;border:2px solid #2b2b28}
body.pm .count{font-size:4rem}
body.pm header,body.pm .prompt{padding-right:min(28vw,380px)}
body.pm .main{display:block;flex:1;min-height:0;position:relative;background:var(--panel);border-radius:12px;overflow:hidden}
body.pm .prompter{position:absolute;inset:0;height:auto;background:none}
body.pm .prompter .text{font-size:clamp(2rem,4.6vw,4rem);line-height:1.35;text-align:left;padding:0 6%}
body.pm .prompter::before{top:22%}
.main{display:contents}
body.full .prompter{overflow:auto}
body.full .prompter .text{position:static;transform:none!important;padding:24px 6%;font-size:clamp(1.2rem,2.4vw,2rem)}
body.full .prompter::before{display:none}
.ln{min-height:1.4em}
.ln.on{color:var(--accent)}
/* Top/bottom split while prompting: the camera preview is a centred strip
   under the camera, the script fills the space below it; nothing overlaps. */
body.pm .stage{position:relative;top:auto;right:auto;width:auto;height:16vh;aspect-ratio:16/9;margin:0 auto;flex:none;border:2px solid #2b2b28;z-index:auto}
body.pm header,body.pm .prompt{padding-right:0}
body.pm .prompter::before{top:45%}
body.pm .stage{order:2} body.pm .main{order:3} body.pm .controls{order:4}
</style></head><body><div class="wrap">
<header><b>bashy record · {{KIND}}</b><span>requested by {{REQUESTER}} · stays on this computer until you press “Use this”</span></header>
<div class="prompt">{{PROMPT}}</div>
<div class="main" id="main"><div class="prompter" id="prompter" style="display:none"><div class="text" id="ptext"></div></div></div>
<div class="stage">
  <video id="preview" autoplay playsinline muted></video>
  <video id="playback" playsinline controls style="display:none"></video>
  <img id="still" alt="" style="display:none">
  <div class="badge" id="badge">camera</div>
  <div class="count" id="count"></div>
</div>
<div class="controls">
  <button class="primary" id="start">Start</button>
  <button id="full" style="display:none">Full script</button>
  <button id="listen" style="display:none">Listen</button>
  <button class="rec" id="stop" disabled>Stop</button>
  <button id="retake" disabled>Retake</button>
  <button class="ok" id="use" disabled>Use this</button>
  <label id="pbl" style="display:none">replay speed <select id="pbrate"><option value="fit" id="fitopt" hidden>fit</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select> <span id="durinfo"></span></label>
  <label id="speedl" style="display:none">prompter speed <input id="speed" type="range" min="2" max="38" value="20" style="width:220px"> <b id="speedv">20</b> <span>(↑/↓ while reading)</span></label>
  <span id="look" style="display:none">
    <label>size <input id="fsize" type="range" min="1.4" max="4.2" step="0.1" value="2.8" style="width:110px"></label>
    <label>font <select id="ffam"><option value='system-ui,-apple-system,"Segoe UI",sans-serif'>sans</option><option value='Georgia,"Times New Roman",serif'>serif</option><option value='ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif'>rounded</option><option value='ui-monospace,Menlo,Consolas,monospace'>mono</option></select></label>
    <label>voice <select id="voice"></select></label>
    <label>voice speed <select id="vrate"><option>0.65</option><option>0.75</option><option>0.85</option><option selected>0.95</option><option>1.05</option><option>1.15</option><option>1.25</option></select></label>
  </span>
  <span class="msg" id="msg"></span>
</div>
</div>
<script>
const KIND = "{{KIND}}", SCRIPT = {{SCRIPT_JSON}}, MAX = {{MAX}}, FIT = {{FIT}};
const $ = id => document.getElementById(id);
const LINES = SCRIPT ? SCRIPT.split("\n") : [];
function renderLines(){ const t=$("ptext"); t.innerHTML=""; LINES.forEach((l,i)=>{ const d=document.createElement("div"); d.className="ln"; d.dataset.i=i; d.textContent=l||"\u00a0"; t.appendChild(d); }); }

const preview=$("preview"), playback=$("playback"), still=$("still"), badge=$("badge"), count=$("count");
let stream, rec, chunks=[], blob=null, timer=null, scrollY=0, rafId=0, t0=0;
if (KIND==="photo") $("start").textContent="Take photo";
if (SCRIPT) { if ("speechSynthesis" in window) $("listen").style.display="inline-block"; $("full").style.display="inline-block"; document.body.classList.add("pm"); $("prompter").style.display="block"; $("speedl").style.display="flex"; renderLines(); resetPrompter(); }
function resetPrompter(){ scrollY=0; $("ptext").style.top=$("prompter").clientHeight*0.45+"px"; $("ptext").style.transform="translateY(0)"; }
function scrollPrompter(ts){ const dt=(ts-(scrollPrompter.last||ts))/1000; scrollPrompter.last=ts; scrollY+=dt*Number($("speed").value); $("ptext").style.transform=`translateY(${-scrollY}px)`; rafId=requestAnimationFrame(scrollPrompter); }
function msg(t){ $("msg").textContent=t; }
async function camera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video: KIND!=="audio" ? {width:{ideal:1280},height:{ideal:720}} : false, audio: KIND!=="photo"});
    preview.srcObject = stream; badge.textContent = KIND==="audio" ? "microphone ready" : "camera ready";
  }catch(e){ msg("Camera/microphone not available: "+e.message+". Allow access in the browser and reload."); $("start").disabled=true; }
}
function countdown(n){ return new Promise(res=>{ count.style.display="flex"; const tick=()=>{ if(n===0){count.style.display="none"; res(); return;} count.textContent=n--; setTimeout(tick,1000); }; tick(); }); }
function pickType(){ const c=["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm"]; const a=["audio/mp4","audio/webm;codecs=opus","audio/webm"]; for(const t of (KIND==="audio"?a:c)) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)) return t; return ""; }
$("start").onclick = async ()=>{
  $("start").disabled=true; $("retake").disabled=true; $("use").disabled=true; blob=null;
  if (KIND==="photo"){
    await countdown(3);
    const v=preview, c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
    const g=c.getContext("2d"); g.translate(c.width,0); g.scale(-1,1); g.drawImage(v,0,0);
    c.toBlob(b=>{ blob=b; still.src=URL.createObjectURL(b); still.style.display="block"; preview.style.display="none"; $("retake").disabled=false; $("use").disabled=false; msg("Happy with it? Press “Use this”, or retake."); },"image/png");
    return;
  }
  document.body.classList.remove("full"); $("full").textContent="Full script"; $("full").disabled=true;
  stopListen(); $("listen").disabled=true;
  resetPrompter(); await countdown(3);
  chunks=[]; const type=pickType(); rec=new MediaRecorder(stream, type?{mimeType:type}:{});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{ $("pbl").style.display="flex"; $("full").disabled=false; $("listen").disabled=false; if(SCRIPT){document.body.classList.remove("pm"); $("prompter").style.display="none";} blob=new Blob(chunks,{type:rec.mimeType||type||"video/webm"}); playback.src=URL.createObjectURL(blob); playback.style.display="block"; preview.style.display="none"; badge.className="badge"; badge.textContent="review"; cancelAnimationFrame(rafId); scrollPrompter.last=0; $("retake").disabled=false; $("use").disabled=false; msg("Watch it back. “Use this” sends it; “Retake” starts over."); };
  rec.start(1000); t0=Date.now(); badge.className="badge rec"; $("stop").disabled=false;
  if (SCRIPT) rafId=requestAnimationFrame(scrollPrompter);
  timer=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); badge.textContent="● "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); if(MAX>0&&s>=MAX) $("stop").click(); },250);
};
$("stop").onclick=()=>{ clearInterval(timer); $("stop").disabled=true; if(rec&&rec.state!=="inactive") rec.stop(); };
$("retake").onclick=()=>{ $("pbl").style.display="none"; if(SCRIPT){document.body.classList.add("pm"); $("prompter").style.display="block";} blob=null; playback.pause(); playback.style.display="none"; still.style.display="none"; preview.style.display="block"; badge.className="badge"; badge.textContent="camera ready"; resetPrompter(); $("start").disabled=false; $("retake").disabled=true; $("use").disabled=true; msg(""); };
$("use").onclick=async ()=>{
  if(!blob) return; $("use").disabled=true; $("retake").disabled=true; msg("Sending…");
  try{ const r=await fetch("upload",{method:"POST",headers:{"Content-Type":blob.type||"application/octet-stream"},body:blob}); if(!r.ok) throw new Error(await r.text());
    if(stream) stream.getTracks().forEach(t=>t.stop());
    document.querySelector(".controls").innerHTML='<span class="done">Sent. You can close this tab.</span>';
  }catch(e){ msg("Could not send: "+e.message); $("use").disabled=false; $("retake").disabled=false; }
};
$("speed").oninput=()=>{ $("speedv").textContent=$("speed").value; };
document.addEventListener("keydown",e=>{ if(!SCRIPT) return; const r=$("speed"); if(e.key==="ArrowUp"){r.value=Math.min(38,+r.value+2);} else if(e.key==="ArrowDown"){r.value=Math.max(2,+r.value-2);} else return; e.preventDefault(); $("speedv").textContent=r.value; });
$("full").onclick=()=>{ const on=document.body.classList.toggle("full"); $("full").textContent=on?"Prompter":"Full script"; if(!on) resetPrompter(); };
// Listen: read the script aloud in the person's language (browser speech,
// on this computer). Never while recording, so the microphone stays clean.
const LANG = "{{LANG}}";
function voiceFor(lang){ const pick=$("voice")&&$("voice").value; if(pick){ const pv=speechSynthesis.getVoices().find(v=>v.name===pick); if(pv) return pv; } const vs=speechSynthesis.getVoices(); const l=lang.toLowerCase(); return vs.find(v=>v.lang.toLowerCase()===l) || vs.find(v=>v.lang.toLowerCase().startsWith(l.split("-")[0])) || null; }
let listening=false, listenRun=0;
function clearLines(){ document.querySelectorAll(".ln.on").forEach(e=>e.classList.remove("on")); }
function stopListen(){ listenRun++; listening=false; if("speechSynthesis" in window) speechSynthesis.cancel(); $("listen").textContent="Listen"; clearLines(); }
function showLine(i){
  document.querySelectorAll(".ln.on").forEach(e=>e.classList.remove("on"));
  const d=document.querySelector('.ln[data-i="'+i+'"]'); if(!d) return; d.classList.add("on");
  if (document.body.classList.contains("full")) { d.scrollIntoView({block:"center",behavior:"smooth"}); }
  else { scrollY=d.offsetTop; $("ptext").style.transform=`translateY(${-scrollY}px)`; }
}
$("listen").onclick=()=>{
  // The page keeps its own state: Chrome's speaking/pending flags lag around
  // start and cancel, and an empty utterance never fires its end event.
  if (listening) { stopListen(); return; }
  const run=++listenRun; listening=true; $("listen").textContent="Stop listening";
  speechSynthesis.cancel(); speechSynthesis.resume();
  const v=voiceFor(LANG); if(!v) msg("No "+LANG+" voice installed; using the default voice.");
  const todo=LINES.map((l,i)=>[l,i]).filter(([l])=>l.trim());
  const done=()=>{ if(run!==listenRun) return; listening=false; $("listen").textContent="Listen"; clearLines(); };
  if(!todo.length){ done(); return; }
  todo.forEach(([l,i],k)=>{
    const u=new SpeechSynthesisUtterance(l); u.lang=LANG; if(v) u.voice=v; u.rate=+($("vrate").value||0.95);
    u.onstart=()=>{ if(run===listenRun) showLine(i); };
    if(k===todo.length-1){ u.onend=done; u.onerror=done; }
    speechSynthesis.speak(u);
  });
};
// Look and voice: teleprompter size/font and the Listen voice, remembered
// per browser (best effort; the page works without storage).
const store={ get(k){ try{return localStorage.getItem("bashy-record-"+k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem("bashy-record-"+k,v);}catch(e){} } };
function applyLook(){ const t=$("ptext"); t.style.fontSize=$("fsize").value+"rem"; t.style.fontFamily=$("ffam").value; }
function fillVoices(){
  if(!("speechSynthesis" in window)) return;
  const sel=$("voice"), keep=store.get("voice")||sel.value, l=LANG.toLowerCase(), base=l.split("-")[0];
  // On-device voices first (local-first); online voices send the text to a cloud service.
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(base)).sort((a,b)=>(b.localService-a.localService));
  sel.innerHTML=""; vs.forEach(v=>{ const o=document.createElement("option"); o.value=v.name; o.textContent=v.name+" ("+v.lang+(v.localService?"":", online")+")"; sel.appendChild(o); });
  if(keep && vs.some(v=>v.name===keep)) sel.value=keep;
  else { const exact=vs.find(v=>v.localService&&v.lang.toLowerCase()===l)||vs.find(v=>v.localService)||vs.find(v=>v.lang.toLowerCase()===l); if(exact) sel.value=exact.name; }
}
if (SCRIPT) {
  $("look").style.display="inline-flex"; $("look").style.gap="8px";
  if(store.get("fsize")) $("fsize").value=store.get("fsize");
  if(store.get("ffam")) $("ffam").value=store.get("ffam");
  applyLook();
  $("fsize").oninput=()=>{ applyLook(); store.set("fsize",$("fsize").value); };
  $("ffam").onchange=()=>{ applyLook(); store.set("ffam",$("ffam").value); };
  $("voice").onchange=()=>store.set("voice",$("voice").value);
  if("speechSynthesis" in window){ fillVoices(); speechSynthesis.onvoiceschanged=fillVoices; }
}
function fitRate(){ const d=playback.duration; return (FIT>0 && isFinite(d) && d>FIT) ? Math.min(2, d/FIT) : 1; }
function applyRate(){ playback.playbackRate = $("pbrate").value==="fit" ? fitRate() : +$("pbrate").value; }
$("pbrate").onchange=applyRate;
playback.addEventListener("loadedmetadata",()=>{
  const d=playback.duration; if(!isFinite(d)) return;
  let t=Math.round(d)+" s";
  if(FIT>0){ const o=$("fitopt"); o.hidden=false; const r=fitRate(); o.textContent="fit to "+FIT+" s ("+r.toFixed(2)+"×)"; if(d>FIT){ $("pbrate").value="fit"; t+=", over "+FIT+" s by "+Math.round(d-FIT)+" s"+(r>1.35?" (above 1.35× speech may sound rushed)":""); } }
  $("durinfo").textContent=t; applyRate();
});
$("vrate").onchange=()=>store.set("vrate",$("vrate").value);
if(store.get("vrate")) $("vrate").value=store.get("vrate");
camera();
</script></body></html>
