<section class="desk-panel page-block" id="block-{{.ID}}" data-block="{{.ID}}" data-kind="timer" data-timer-name="{{.Name}}" data-remaining="{{.Remaining}}" data-running="{{.Running}}" data-ends-at="{{.EndsAt}}"><h2 class="desk-h2">Timer <code>{{.ID}}</code></h2><p class="page-timer-clock" data-timer-clock>{{.Display}}</p><p class="desk-muted">{{.State}}</p>{{if .Organizer}}<div class="desk-row"><button type="button" class="desk-copy" data-timer-action="start" data-block="{{.ID}}">Start</button><button type="button" class="desk-copy" data-timer-action="stop" data-block="{{.ID}}">Stop</button><button type="button" class="desk-copy" data-timer-action="reset" data-block="{{.ID}}">Reset</button></div>{{end}}</section>
