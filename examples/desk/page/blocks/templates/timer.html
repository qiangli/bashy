<section class="page-timer" data-timer="{{.ID}}" data-running="{{.Running}}" data-ends-at="{{.EndsAt}}"><h2 class="desk-h2">{{.Name}}</h2><p class="page-timer-clock" data-timer-clock role="timer" aria-live="off">{{.Display}}</p>{{if not .Projected}}<p class="desk-muted">{{.State}}</p>{{end}}{{if .Controls}}<div class="desk-row"><button type="button" class="desk-copy" data-timer-action="start">Start</button><button type="button" class="desk-copy" data-timer-action="stop">Stop</button><button type="button" class="desk-copy" data-timer-action="reset">Reset</button></div>{{end}}</section>
