<section class="desk-panel page-block" id="block-{{.ID}}" data-block="{{.ID}}" data-kind="book"><h2 class="desk-h2">Book <code>{{.ID}}</code></h2>{{if .Title}}<h3 class="desk-h3">{{.Title}}</h3>{{end}}{{if .PageTitle}}<p class="desk-muted">{{.PageTitle}}</p>{{end}}{{if .Err}}<p class="desk-muted">{{.Err}}</p>{{else}}<div class="page-block-body">{{.Body}}</div>{{end}}</section>
