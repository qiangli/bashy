<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT - Image Generated</title>
</head>
<body>
  <div class="chat-container">
    <div class="conversation" id="conversation">
      <div class="message assistant">
        <p>Here is your generated image:</p>
        <div class="image-result" id="image-result">
          <img id="generated-image" src="take.png" alt="Generated image of a character">
          <a class="download-link" href="take.png" download>Download</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
