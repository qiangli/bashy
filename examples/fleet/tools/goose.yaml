# Goose — custom tool definition (bashy examples/fleet, Sprint 406)
# source:  https://github.com/aaif-goose/goose  (Apache-2.0)
# install: vendor release asset goose-<arch>-apple-darwin.tar.gz / -linux
#          (https://github.com/aaif-goose/goose/releases)
# add:     bashy tool add --force examples/fleet/tools/goose.yaml
#          (--force while the retired built-in goose entry still exists)
# models:  --model selects; the provider comes from GOOSE_PROVIDER (openai,
#          ollama, anthropic, ...) with OPENAI_HOST + OPENAI_BASE_PATH or
#          OLLAMA_HOST for custom endpoints. Set GOOSE_MODE=auto for unattended runs.
# status:  verified: 2026-10-09 on goose 1.54.0 — bashy delegate e2e on macOS arm64:
#          an OpenAI-compatible cloud endpoint (glm-5.3), local Ollama (qwen3.5:9b)
#          and the bashy model door (qwen3:8b); pong + calc each (pong = endpoint answers, calc = fix a one-line bug, gate = its test passes).
#          Result: all six cells pass except calc via the door's qwen3:8b.
name: goose
kind: cli
display: Goose
cli:
  binary: goose
  launch:
    exec: goose run --no-session -q --model {model} -t {prompt}
    prompt_position: last
    key_env:
      - OPENAI_API_KEY
    env:
      - GOOSE_MODE=auto
      - GOOSE_PROVIDER=openai
      - OPENAI_HOST={base_url_origin}
      - OPENAI_BASE_PATH={base_url_path}/chat/completions
    env_markers:
      - GOOSE_TERMINAL
    watchdog:
      max_runtime: 30m
      mem_limit: 8g
    notes: run -t is one-shot; --no-session keeps no session file; --output-format json for structured output.
quirks: needs GOOSE_PROVIDER and GOOSE_MODE=auto in the environment
