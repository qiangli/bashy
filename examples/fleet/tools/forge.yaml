# ForgeCode — custom tool definition (bashy examples/fleet, Sprint 406)
# source:  https://github.com/tailcallhq/forgecode  (Apache-2.0)
# install: vendor release asset forge-<arch>-apple-darwin / -linux, e.g.
#          https://github.com/tailcallhq/forgecode/releases/download/v2.14.0/forge-aarch64-apple-darwin
# add:     bashy tool add examples/fleet/tools/forge.yaml
# models:  no --model flag; the model and provider come from forge's own config
#          (`forge provider`, `forge config`), so a binding is a label only.
# status:  verified: 2026-10-09 on forge 2.14.0 — bashy delegate e2e on macOS arm64:
#          an OpenAI-compatible cloud endpoint (glm-5.3), local Ollama (qwen3.5:9b)
#          and the bashy model door (qwen3:8b); pong + calc each (pong = endpoint answers, calc = fix a one-line bug, gate = its test passes).
#          Result: all six cells pass except calc via the door's qwen3:8b.
# bench:   Terminal-Bench 2.0 81.8% (GPT-5.4, 2026-04)
name: forge
kind: cli
display: ForgeCode
cli:
  binary: forge
  launch:
    exec: forge -p {prompt}
    prompt_position: last
    key_env:
      - OPENAI_API_KEY
    env:
      - HOME={state_dir}/home
      - OPENAI_URL={base_url}
    setup: |
      # forge migrates OPENAI_URL/OPENAI_API_KEY into ~/.forge at start-up
      # (`forge info` triggers it without prompting); `config set` before that
      # fails with "Parameter input cancelled". Then make the bound model its
      # default (forge has no --model flag).
      mkdir -p {state_dir}/home
      forge info < /dev/null > /dev/null 2>&1 || true
      forge config set model openai_compatible {model} < /dev/null > /dev/null
    watchdog:
      max_runtime: 30m
      mem_limit: 8g
    notes: >-
      -p runs one prompt and exits. -C DIR sets the working directory. Model and
      provider are configured outside the argv (forge provider / forge config).
quirks: no model selection from argv; configure the provider before launch
