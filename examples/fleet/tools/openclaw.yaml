# POLICY: bashy never starts a third-party-built gateway. Do NOT npm install
# openclaw or run the upstream ghcr image; wait for the bashy-signed build.
# OpenClaw — custom tool definition (bashy examples/fleet, Sprint 406)
# source:  https://github.com/openclaw/openclaw  (MIT)
# install: npm install -g openclaw@latest  (requires Node >= 24.16; check `node --version` first)
# setup:   skills/bashy/commands/feed-setup.md (feed channels: Telegram, Discord, Slack, Matrix chat)
# add:     bashy tool add --force examples/fleet/tools/openclaw.yaml
#          (--force while the retired built-in openclaw entry still exists)
# models:  --model provider/model (e.g. ollama/qwen3.5:9b); providers in its config
# status:  verified: 2026-10-09 on openclaw 2026.6.35 — bashy delegate e2e on macOS arm64:
#          an OpenAI-compatible cloud endpoint (glm-5.3), local Ollama (qwen3.5:9b)
#          and the bashy model door (qwen3:8b); pong + calc each (pong = endpoint answers, calc = fix a one-line bug, gate = its test passes).
#          Result: pong everywhere and cloud calc pass; calc on qwen3.5:9b and via the door fail.
# use:     bashy tool cmd run openclaw:send --yes -- --channel discord --target channel:ID --message TEXT
#          bashy tool cmd run openclaw:send --yes -- --dry-run --channel discord --target channel:ID --message TEXT
# inbound: paired-chat messages reach this host through an OpenClaw internal
#          hook on `message:received` (HOOK.md + handler.js in the gateway
#          state dir, NOT here — this file stays send-only): the gateway
#          downloads the photos, then the hook calls
#          `bashy meet dm --channel KIND --sender ID --attach <files>` and
#          relays the printed reply back to the sender's chat. Install fence:
#          skills/bashy/commands/feed-setup.md step 3d (idempotent, no secrets).
#          bashy tool cmd run openclaw:approve --yes -- ID allow-once|allow-always|deny
#          (`openclaw approvals pending [--json]` lists pending approvals; decision
#          words verified against https://docs.openclaw.ai/cli/approvals)
# gateway: the pinned gateway image ghcr.io/openclaw/openclaw:2026.9.8 runs from
#          examples/fleet/services/openclaw-gateway.yaml (loopback 18789); the openclaw
#          CLI must be installed on the host (npm install -g openclaw@2026.9.8) for the
#          commands to list as available.
# mcp:     {"mcpServers":{"openclaw":{"command":"openclaw","args":["mcp","serve","--token-file","~/.openclaw/gateway.token"]}}}
#          (note: `bashy skill export --mcp` direction is the reverse — bashy skills out to MCP clients)
name: openclaw
kind: cli
display: OpenClaw
cli:
  binary: openclaw
  launch:
    exec: openclaw agent --local --agent main --json --model bashy/{model} -m {prompt}
    prompt_position: last
    key_env:
      - OPENAI_API_KEY
    env_markers:
      - OPENCLAW
    env:
      - OPENCLAW_STATE_DIR={state_dir}
      - OPENCLAW_CONFIG_PATH={state_dir}/openclaw.json
    setup: |
      # openclaw registers custom models in openclaw.json and expands ${VARS}.
      base={base_url}; model={model}
      cat > {state_dir}/openclaw.json <<EOF
      {"agents": {"defaults": {"model": {"primary": "bashy/$model"}}},
       "models": {"providers": {"bashy": {"baseUrl": "$base", "apiKey": "\${OPENAI_API_KEY}", "api": "openai-completions",
         "models": [{"id": "$model", "name": "$model"}]}}}}
      EOF
    watchdog:
      max_runtime: 30m
      mem_limit: 8g
    notes: >-
      agent --local runs the embedded agent (provider keys from the environment)
      instead of routing through the OpenClaw gateway; -m is the message.
commands:
  - name: send
    slash: send {args}
    mode: print
    effects: [net, write]
    exec: openclaw message send --json {args}
  - name: approve
    slash: approve {args}
    mode: print
    effects: [net, write]
    exec: openclaw approvals resolve --json {args}
quirks: chat-gateway lineage; security-sensitive
integration:
  detect: ${OPENCLAW_STATE_DIR:-~/.openclaw}
  skills:
    user: [~/.agents/skills]
    project: [.agents/skills]
  mcp: {config: "${OPENCLAW_STATE_DIR:-~/.openclaw}/openclaw.json", format: json5, key: mcp.servers}
  shell_env: SHELL
