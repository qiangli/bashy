# qwen3.5:9b on a local Ollama, through its OpenAI-compatible /v1 API — custom
# model (bashy examples/fleet, Sprint 406). OpenAI clients insist on a key;
# Ollama ignores it, so give the ollama ref any value (OLLAMA_API_KEY=ollama).
# add: bashy model add examples/fleet/models/ollama-qwen3.5-9b.yaml
name: ollama-qwen3.5-9b
kind: local
provider: openai-compat
base_url: http://127.0.0.1:11434/v1
api_key_ref: ollama
model: qwen3.5:9b
ids:
  mini-swe-agent: openai/qwen3.5:9b
  aider: openai/qwen3.5:9b
  openhands: openai/qwen3.5:9b
band: 1
band_source: operator
