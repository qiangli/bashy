<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

        <span class="logo-mark">⚡</span>
        <span class="logo-text">{{ .Site.Title }}</span>
      </a>
      {{ partial "nav.html" . }}
    </div>
  </header>
  <main class="site-main">
