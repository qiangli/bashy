      - name: upload native protocol and network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}-native-evidence
          path: |
            out/*-native.json
            out/*-native.log
            out/*-egress.txt
          if-no-files-found: error
          retention-days: 7
      - name: upload diagnostic compiler input evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}-compiler-evidence
          path: |
            out/*.compiler-inputs/**
            out/*.compiler-inputs.json
            out/*compiler-identity.json
          if-no-files-found: warn
          retention-days: 7
