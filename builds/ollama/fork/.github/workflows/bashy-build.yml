# bashy verified build of ollama (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/ollama/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/ollama from
# bashy's builds/ollama/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v0.40.3-1) at that branch.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/ollama/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/ollama'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $UPSTREAM_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG"; exit 1; }
          [[ $BASHY_TAG =~ ^bashy-(v[0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream GitHub release must exist and be neither draft nor pre-release.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: ollama-linux-amd64.tgz
            runner: ubuntu-24.04
          - asset: ollama-linux-arm64.tgz
            runner: ubuntu-24.04-arm
          - asset: ollama-darwin-arm64.tgz
            runner: macos-26-xlarge
          - asset: ollama-darwin-amd64.tgz
            runner: macos-15-intel
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ollama/ollama
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git curl jq strace util-linux iproute2
      - name: pinned Go toolchain (from the upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: false
          cache: false
      - name: pin the exact toolchain (PIN GO_TOOLCHAIN == upstream go.mod)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declaration must name what the upstream release builds with:
          # go.mod's `toolchain` line when it has one, else its `go` line. A
          # pin bump that forgets GO_TOOLCHAIN fails here instead of silently
          # building on whatever the runner image happens to ship.
          want=$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          if [[ -z $want ]]; then
            want=$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          fi
          [[ -n $want ]] || { echo "src/go.mod declares no go/toolchain version"; exit 1; }
          [[ $want == "$GO_TOOLCHAIN" ]] ||
            { echo "PIN GO_TOOLCHAIN $GO_TOOLCHAIN != upstream go.mod $want"; exit 1; }
          # GOTOOLCHAIN makes every `go` command use exactly that release, no
          # matter what setup-go resolved, so the build is toolchain-exact.
          echo "GOTOOLCHAIN=go$GO_TOOLCHAIN" >>"$GITHUB_ENV"
          GOTOOLCHAIN="go$GO_TOOLCHAIN" go version
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      # Ollama is not a Go binary by itself: `ollama serve` discovers and runs
      # llama.cpp/ggml payloads from lib/ollama. Linux follows the CPU portion
      # of upstream Dockerfile/release.yaml via its `cpu` CMake preset. Darwin
      # uses upstream's release script, which builds the CPU runner and MLX
      # Metal payload for the selected architecture.
      - name: build upstream Ollama runtime archive (Go + cgo + CMake)
        working-directory: src
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          case $ASSET in
            ollama-linux-amd64.tgz) os=linux; arch=amd64 ;;
            ollama-linux-arm64.tgz) os=linux; arch=arm64 ;;
            ollama-darwin-arm64.tgz) os=darwin; arch=arm64 ;;
            ollama-darwin-amd64.tgz) os=darwin; arch=amd64 ;;
            *) echo "unknown matrix asset $ASSET"; exit 1 ;;
          esac
          [[ $(go env GOOS) == "$os" && $(go env GOARCH) == "$arch" ]] ||
            { echo "runner $(go env GOOS)/$(go env GOARCH) != asset $os/$arch"; exit 1; }

          stage=$RUNNER_TEMP/ollama-stage
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/lib/ollama" ../out

          # Upstream release.yaml/Dockerfile generate this notice into every
          # runtime payload. Keep the project MIT license beside it as well.
          cmake -S . -B build/bashy-go-license \
            -DOLLAMA_LLAMA_BACKENDS= -DOLLAMA_MLX_BACKENDS= \
            -DOLLAMA_PAYLOAD_INSTALL_PREFIX="$stage" \
            -DOLLAMA_GO_LICENSE_TARGETS="$os/$arch"
          cmake --build build/bashy-go-license --target ollama-go-license
          cp LICENSE "$stage/lib/ollama/OLLAMA_LICENSE"

          if [[ $os == linux ]]; then
            # Upstream Dockerfile's llama-server-cpu stage: the pinned
            # llama.cpp source, CPU/all-variants preset, then its install
            # component into lib/ollama.
            cmake -S llama/server --preset cpu -DCMAKE_INSTALL_PREFIX="$stage"
            cmake --build --preset cpu --parallel
            cmake --install build/llama-server-cpu \
              --prefix "$stage" --component llama-server --strip

            # Upstream Dockerfile's Go build, with the same cgo/PIE/release
            # settings plus deterministic path/build-id removal.
            CGO_ENABLED=1 CGO_CFLAGS=-O3 CGO_CXXFLAGS=-O3 \
              go build -trimpath -buildmode=pie \
                -ldflags "-s -w -buildid= $GO_LDFLAGS" \
                -o "$stage/bin/ollama" .
          else
            # This is the upstream release entry point. Limiting ARCHS keeps
            # the four bashy assets independent; `build` emits the complete
            # per-arch dist tree without making the universal app/DMG.
            VERSION=${UPSTREAM_TAG#v} ./scripts/build_darwin.sh -a "$arch" build
            cp "dist/darwin-$arch/ollama" "$stage/bin/ollama"
            cp -R "dist/darwin-$arch/lib/ollama/." "$stage/lib/ollama/"
          fi

          test -x "$stage/bin/ollama"
          test -x "$stage/lib/ollama/llama-server"
          test -x "$stage/lib/ollama/llama-quantize"
          test -s "$stage/lib/ollama/GO_LICENSE"
          test -s "$stage/lib/ollama/OLLAMA_LICENSE"
          find "$stage/lib/ollama" -type f -print | sort
          "$stage/bin/ollama" --version
          tar -czf "../out/$ASSET" -C "$stage" bin lib

          # Prove the signed unit, rather than the unarchived staging tree, has
          # the executable and every runtime directory `ollama serve` needs.
          verify=$RUNNER_TEMP/ollama-verify
          rm -rf "$verify" && mkdir -p "$verify"
          tar -xzf "../out/$ASSET" -C "$verify"
          test -x "$verify/bin/ollama"
          test -x "$verify/lib/ollama/llama-server"
          test -s "$verify/lib/ollama/GO_LICENSE"
          "$verify/bin/ollama" --version
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"

      - name: upload unsigned build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ollama/ollama
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: pinned Go toolchain (from the upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: false
          cache: false
      - name: pinned govulncheck + cyclonedx-gomod
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          echo "GOTOOLCHAIN=go$GO_TOOLCHAIN" >>"$GITHUB_ENV"
          export GOTOOLCHAIN=go$GO_TOOLCHAIN
          go version
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$GO_SBOM_VERSION"
      - name: govulncheck (source mode) vs reviewed waivers
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          report=../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          # govulncheck exits 3 when it finds anything, so the status is
          # deferred: the waiver gate below renders the verdict.
          govulncheck -format json ./... >"$report" || true
          [[ -s $report ]] || { echo "govulncheck produced no report"; exit 1; }
          # A finding whose first trace frame names a function is REACHABLE
          # from called code; module-only findings are informational.
          jq -rs '[.[] | select(has("finding")) | .finding
                   | select(.trace[0].function != null) | .osv]
                  | unique | .[]' "$report" | sed '/^$/d' | sort -u >"$RUNNER_TEMP/found"
          # bashy-build/vuln-ignore: one OSV id per line, each with a
          # justification comment; empty means nothing is waived.
          grep -Ev '^[[:space:]]*(#|$)' ../fork/bashy-build/vuln-ignore |
            awk '{print $1}' | sort -u >"$RUNNER_TEMP/waived" || true
          if comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | grep -q .; then
            echo "govulncheck: unwaived vulnerabilities reachable from called code:"
            comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | sed 's/^/  /'
            exit 1
          fi
          echo "govulncheck: no unwaived reachable vulnerability ($(wc -l <"$RUNNER_TEMP/found") reachable, all waived or none)"
      - name: SBOM (CycloneDX, the bashy build configuration)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          sbom=../out/$TOOL-$UPSTREAM_TAG.cdx.json
          cyclonedx-gomod app -json -licenses -main "$GO_PACKAGE" -output "$sbom" .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" >/dev/null
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
