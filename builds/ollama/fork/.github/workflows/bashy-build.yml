# bashy verified build of ollama (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/ollama/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/ollama from
# bashy's builds/ollama/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v0.21.2-1) at that branch.
# Upstream tags this release vX.Y.Z, so the trigger is
# bashy-v* and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/ollama/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"
  # Nonpublishing candidate: pin + build + audit (incl. the CUDA target) on a
  # branch, no tag. The release job below is tag-only, so a dispatch can never
  # sign, attest or create a release.
  workflow_dispatch:

permissions: {}

# Windows' default is PowerShell; the native runner recipe uses Git Bash.
defaults:
  run:
    shell: bash

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/ollama'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
          BASHY_REF_TYPE: ${{ github.ref_type }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not vX.Y.Z)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          # candidate dispatch (branch ref): the pin and upstream-release checks
          # below still run; only the bashy-tag shape is for tag releases.
          if [[ $BASHY_REF_TYPE == tag ]]; then
            [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
              { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          fi
          # The upstream release must exist and be neither draft nor pre-release.
          # UPSTREAM_API_BASE is https://api.github.com for a GitHub upstream and
          # the forge's own REST root otherwise; gitea answers the identical
          # /repos/SLUG/releases/tags/TAG shape, with the same .draft/.prerelease.
          # Unauthenticated calls from a shared runner IP are rate-limited, so
          # a GitHub upstream is queried with the job's own read-only token.
          auth=()
          if [[ "https://api.github.com" == https://api.github.com && -n ${GH_API_TOKEN:-} ]]; then
            auth=(-H "Authorization: Bearer $GH_API_TOKEN")
          fi
          rel=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H 'Accept: application/vnd.github+json' ${auth[@]+"${auth[@]}"} \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: runner-linux-amd64
            runner: ubuntu-24.04
          - asset: runner-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: runner-darwin-amd64
            runner: macos-15-intel
          - asset: runner-darwin-arm64
            runner: macos-15
          - asset: runner-windows-amd64
            runner: windows-2025
          - asset: runner-linux-amd64-cuda
            runner: ubuntu-24.04
    steps:
      # Windows runners check out with core.autocrlf=true by default, which
      # rewrites LF to CRLF in the working tree. The prepare/audit gates hash
      # exact source bytes (e.g. src/LICENSE), so the conversion breaks the
      # pin on Windows while linux/darwin stay green. Disable it globally
      # BEFORE either checkout below, so both the fork scripts and the pinned
      # source land byte-identical on every OS. The hash checks themselves are
      # unchanged. No-op on non-Windows runners.
      - name: disable line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ollama/ollama
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        env:
          BASHY_TAG_ARG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: fork/bashy-build/verify-pin.sh src "$BASHY_TAG_ARG"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential python3 strace iproute2 util-linux lsof
      - name: pinned runner Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: provision pinned MinGW clang toolchain (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          # Explicit package set, no metapackage: every name is pinned here and
          # the resolved versions are recorded per build in
          # out/windows-toolchain.json (see windows-compilers.py, shared with
          # prima.cpp via builds/_shared). The cgo build consumes only the
          # verified CC/CXX pair below; cmake/make/ninja/objdump records keep
          # the toolchain evidence identical across both tools.
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm-openmp
            mingw-w64-clang-x86_64-llvm-tools
          cache: false
      - name: native Windows MinGW + clang compilers
        if: runner.os == 'Windows'
        env:
          # Hand the probe the exact MSYS2 root setup-msys2 installed, so
          # windows-compilers.py searches <msys2-location>/clang64/bin ONLY
          # and can never fall back to C:\Program Files\LLVM (MSVC-target).
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python3 fork/bashy-build/windows-compilers.py
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      - name: build unpatched upstream runner and deterministic gzip
        env:
          RUNNER_ASSET: ${{ matrix.asset }}
        run: bash fork/bashy-build/build-runner.sh src out "$RUNNER_ASSET"
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"
      - name: upload native protocol and network evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}-native-evidence
          path: |
            out/*-native.json
            out/*-native.log
            out/*-egress.txt
          if-no-files-found: error
          retention-days: 7
      - name: upload diagnostic compiler input evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}-compiler-evidence
          path: |
            out/*.compiler-inputs/**
            out/*.compiler-inputs.json
            out/*compiler-identity.json
          if-no-files-found: warn
          retention-days: 7

      - name: upload unsigned build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: [pin, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ollama/ollama
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        env:
          BASHY_TAG_ARG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: fork/bashy-build/verify-pin.sh src "$BASHY_TAG_ARG"
      - name: pinned runner Go toolchain for audit analyzers
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: download all six native build records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: pinned Go analysis tools
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          export GOBIN="$RUNNER_TEMP/bin" PATH="$RUNNER_TEMP/bin:$PATH"
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOTOOLCHAIN=local go install github.com/google/go-licenses@v1.6.0
          GOTOOLCHAIN=local go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          GOTOOLCHAIN=local go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.2
          go version
          govulncheck -version
          osv-scanner --version
      - name: verify downloaded compiler-input closure for every native build
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py merge-inputs --out out
      - name: native linked-library inventory for every shipped executable
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py inventory --out out --report out/runner-linked-libraries.json
      - name: GO_SECURITY_OVERRIDES (reviewed module bumps, gated go.mod diff)
        run: |
          set -euo pipefail
          # Same overridden tree the build job compiles: PIN
          # GO_SECURITY_OVERRIDES applied after the pin gates, before
          # go-licenses/SBOM/govulncheck read the module graph. S436/#2028:
          # nine x/* modules at their MVS-selected versions plus
          # github.com/buger/jsonparser@v1.1.2 (GO-2026-4514). The OSV gate
          # honours the one reviewed waiver in bashy-build/vuln-ignore
          # (GO-2026-5932, unreachable deprecated x/crypto openpgp).
          export GOWORK=off GOENV=off GOTOOLCHAIN=local
          bash fork/bashy-build/go-security-overrides.sh src
      - name: compiled-input permissive license review and notices
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH" GOWORK=off GOENV=off GOTOOLCHAIN=local CGO_ENABLED=1
          # Every shipped target (S436/#2028): the single-GOOS report misses
          # Windows-only compiled modules (e.g. mousetrap), so
          # aggregate-sbom cannot see them. Run check/report per GOOS/GOARCH
          # of the five targets and union the rows; save per target into
          # fresh dirs (go-licenses save creates its dir and fatals with
          # 'already exists' if pre-created, CI run 38537053528) then merge.
          tmpl=$(mktemp)
          printf '%s' '{{range .}}{{.Name}},{{.LicenseName}}{{"\n"}}{{end}}' > "$tmpl"
          : > ../out/runner-licenses.csv
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            goos=${target%-*}; goarch=${target#*-}
            GOOS=$goos GOARCH=$goarch go-licenses check --allowed_licenses=MIT,MIT-0,BSD-2-Clause,BSD-3-Clause,Apache-2.0 ./cmd/runner
            rm -rf "../out/notices-$target"
            GOOS=$goos GOARCH=$goarch go-licenses save --save_path="../out/notices-$target" ./cmd/runner
            GOOS=$goos GOARCH=$goarch go-licenses report --template "$tmpl" ./cmd/runner > "../out/runner-licenses-$target.csv"
            grep -v '^$' "../out/runner-licenses-$target.csv" >> ../out/runner-licenses.csv || true
          done
          rm -f "$tmpl" ../out/runner-licenses-*.csv
          sort -u -o ../out/runner-licenses.csv ../out/runner-licenses.csv
          rm -rf ../out/notices
          mkdir -p ../out/notices
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            (cd "../out/notices-$target" && find . -type f) | while IFS= read -r f; do
              dest="../out/notices/${f#./}"
              mkdir -p "$(dirname "$dest")"
              # Portable first-wins dedupe: cp -n exits 1 on macOS when the
              # destination exists (GNU exits 0), so test first. Same
              # module@version carries identical bytes on every target.
              if [[ ! -e $dest ]]; then cp "../out/notices-$target/$f" "$dest"; fi
            done
            rm -rf "../out/notices-$target"
          done
          python3 ../fork/bashy-build/audit-runner.py licenses --report ../out/runner-licenses.csv --notices ../out/notices --output ../out/runner-licenses.json
      - name: CycloneDX SBOM for the compiled runner package
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH" GOWORK=off GOENV=off GOTOOLCHAIN=local CGO_ENABLED=1
          cyclonedx-gomod app -json -licenses -main ./cmd/runner -output ../out/runner-sbom.cdx.json .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' ../out/runner-sbom.cdx.json >/dev/null
      - name: bind target-specific compiled modules and native libraries into SBOM
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py native-licenses --out out --review fork/bashy-build/license-review.json --output out/runner-native-licenses.json
          python3 fork/bashy-build/audit-runner.py aggregate-sbom --out out
      - name: OSV scan of the five-target compiled-input SBOM
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # osv-scanner exits 1 whenever it finds ANY vulnerability
          # (including the reviewed waiver GO-2026-5932), so the gate below —
          # not the scanner exit code — decides. Accept 0 (clean) and 1
          # (findings written); any other code is a real scanner error.
          rc=0
          osv-scanner scan source -L out/runner-sbom.cdx.json --format json > out/runner-osv.json || rc=$?
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then echo "osv-scanner failed with exit $rc" >&2; exit "$rc"; fi
          python3 fork/bashy-build/audit-runner.py osv --report out/runner-osv.json
      - name: govulncheck binary reachability for all six target builds
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # govulncheck -mode=binary flags every Ollama-module symbol because
          # the Ollama advisories carry no per-symbol detail and no patched
          # version exists for any Ollama release (S436/#2028), so the gate
          # below — not the scanner exit code — decides. Accept 0 (clean) and
          # 3 (findings written); any other code is a real scanner error. The
          # per-target JSON stays in the audit outputs for the gate and the
          # final evidence check.
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 linux-amd64-cuda; do
            binary="out/runner-$target"
            [[ $target != windows-amd64 ]] || binary+='.exe'
            rc=0
            govulncheck -mode=binary -json "$binary" >"out/runner-$target.govulncheck.json" || rc=$?
            if [[ $rc -ne 0 && $rc -ne 3 ]]; then echo "govulncheck failed with exit $rc for $target" >&2; exit "$rc"; fi
          done
          python3 fork/bashy-build/audit-runner.py govulncheck --out out
      - name: Grype complete CycloneDX SBOM (fail on unwaived findings)
        env:
          GRYPE_VERSION: v0.120.1
        run: |
          set -euo pipefail
          # The version pin is the positional TAG. install.sh -v is NOT the
          # version: it requests cosign signature verification, and cosign is
          # not on the runners (verified against the published ubuntu-24.04
          # image software list; the flag fails the install without it).
          # Tarball SHA-256 verification against the release checksums.txt is
          # unconditional in install.sh and stays.
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/v0.120.1/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" "$GRYPE_VERSION"
          # Grype without --fail-on exits 0 with findings written (--fail-on
          # exits 2 when matches exceed the threshold, seen in the run-132
          # replay: scan exit 2 with 32 matches), so the gate below — not
          # the scanner exit code — decides. Any nonzero exit is a real
          # scanner error. The gate honours the reviewed waivers in
          # fork/bashy-build/vuln-ignore by exact id: a match is waived
          # when its vulnerability id or any related id equals a waived id
          # (the aggregated SBOM can list one module twice, so one waived
          # id may match more than once); only unwaived matches fail.
          rc=0
          "$RUNNER_TEMP/bin/grype" "sbom:out/runner-sbom.cdx.json" -o json > out/runner-grype.json || rc=$?
          if [[ $rc -ne 0 ]]; then echo "grype failed with exit $rc" >&2; exit "$rc"; fi
          python3 fork/bashy-build/audit-runner.py grype --report out/runner-grype.json
      - name: verify complete reports and generated Metal inputs
        run: |
          set -euo pipefail
          commit=$(git -C src rev-parse HEAD)
          python3 fork/bashy-build/audit-runner.py final --out out --commit "$commit"
      # Reports must survive a gate failure: the skeleton's trailing
      # "upload audit outputs" step runs with if: always() for ollama, so
      # runner-grype.json and the other reports are uploaded even when a
      # gate above fails (S436/#2028: the grype ids were unknown because
      # the report was never uploaded).
      - name: upload audit outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    if: github.ref_type == 'tag'
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          # Backend artifacts (incl. transitive libraries) come from the signed
          # manifests, not a static list: all must exist, match their digest,
          # and are then published and signed with everything else in dist.
          derived=$(python3 fork/bashy-build/release-assets-check.py dist "$RELEASE_ASSETS")
          for a in $derived; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          # release assets are files; evidence directories are not published.
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
