      - name: pinned runner Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '@@GO_TOOLCHAIN@@'
          check-latest: false
          cache: false
      - name: native Windows MinGW compilers
        if: runner.os == 'Windows'
        run: python3 fork/bashy-build/windows-compilers.py
