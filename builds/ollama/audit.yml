      - name: pinned runner Go toolchain for audit analyzers
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          check-latest: false
          cache: false
      - name: download all five native build records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: pinned Go analysis tools
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          export GOBIN="$RUNNER_TEMP/bin" PATH="$RUNNER_TEMP/bin:$PATH"
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOTOOLCHAIN=local go install github.com/google/go-licenses@v1.6.0
          GOTOOLCHAIN=local go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          GOTOOLCHAIN=local go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.2
          go version
          govulncheck -version
          osv-scanner --version
      - name: verify downloaded compiler-input closure for every native build
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py merge-inputs --out out
      - name: native linked-library inventory for every shipped executable
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py inventory --out out --report out/runner-linked-libraries.json
      - name: GO_SECURITY_OVERRIDES (reviewed module bumps, gated go.mod diff)
        run: |
          set -euo pipefail
          # Same overridden tree the build job compiles: PIN
          # GO_SECURITY_OVERRIDES applied after the pin gates, before
          # go-licenses/SBOM/govulncheck read the module graph. S436/#2028:
          # nine x/* modules at their MVS-selected versions plus
          # github.com/buger/jsonparser@v1.1.2 (GO-2026-4514). The OSV gate
          # honours the one reviewed waiver in bashy-build/vuln-ignore
          # (GO-2026-5932, unreachable deprecated x/crypto openpgp).
          export GOWORK=off GOENV=off GOTOOLCHAIN=local
          bash fork/bashy-build/go-security-overrides.sh src
      - name: compiled-input permissive license review and notices
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH" GOWORK=off GOENV=off GOTOOLCHAIN=local CGO_ENABLED=1
          # Every shipped target (S436/#2028): the single-GOOS report misses
          # Windows-only compiled modules (e.g. mousetrap), so
          # aggregate-sbom cannot see them. Run check/report per GOOS/GOARCH
          # of the five targets and union the rows; save per target into
          # fresh dirs (go-licenses save creates its dir and fatals with
          # 'already exists' if pre-created, CI run 38537053528) then merge.
          tmpl=$(mktemp)
          printf '%s' '{{range .}}{{.Name}},{{.LicenseName}}{{"\n"}}{{end}}' > "$tmpl"
          : > ../out/runner-licenses.csv
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            goos=${target%-*}; goarch=${target#*-}
            GOOS=$goos GOARCH=$goarch go-licenses check --allowed_licenses=MIT,MIT-0,BSD-2-Clause,BSD-3-Clause,Apache-2.0 ./cmd/runner
            rm -rf "../out/notices-$target"
            GOOS=$goos GOARCH=$goarch go-licenses save --save_path="../out/notices-$target" ./cmd/runner
            GOOS=$goos GOARCH=$goarch go-licenses report --template "$tmpl" ./cmd/runner > "../out/runner-licenses-$target.csv"
            grep -v '^$' "../out/runner-licenses-$target.csv" >> ../out/runner-licenses.csv || true
          done
          rm -f "$tmpl" ../out/runner-licenses-*.csv
          sort -u -o ../out/runner-licenses.csv ../out/runner-licenses.csv
          rm -rf ../out/notices
          mkdir -p ../out/notices
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            (cd "../out/notices-$target" && find . -type f) | while IFS= read -r f; do
              dest="../out/notices/${f#./}"
              mkdir -p "$(dirname "$dest")"
              # Portable first-wins dedupe: cp -n exits 1 on macOS when the
              # destination exists (GNU exits 0), so test first. Same
              # module@version carries identical bytes on every target.
              if [[ ! -e $dest ]]; then cp "../out/notices-$target/$f" "$dest"; fi
            done
            rm -rf "../out/notices-$target"
          done
          python3 ../fork/bashy-build/audit-runner.py licenses --report ../out/runner-licenses.csv --notices ../out/notices --output ../out/runner-licenses.json
      - name: CycloneDX SBOM for the compiled runner package
        working-directory: src
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH" GOWORK=off GOENV=off GOTOOLCHAIN=local CGO_ENABLED=1
          cyclonedx-gomod app -json -licenses -main ./cmd/runner -output ../out/runner-sbom.cdx.json .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' ../out/runner-sbom.cdx.json >/dev/null
      - name: bind target-specific compiled modules and native libraries into SBOM
        run: |
          set -euo pipefail
          python3 fork/bashy-build/audit-runner.py native-licenses --out out --review fork/bashy-build/license-review.json --output out/runner-native-licenses.json
          python3 fork/bashy-build/audit-runner.py aggregate-sbom --out out
      - name: OSV scan of the five-target compiled-input SBOM
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # osv-scanner exits 1 whenever it finds ANY vulnerability
          # (including the reviewed waiver GO-2026-5932), so the gate below —
          # not the scanner exit code — decides. Accept 0 (clean) and 1
          # (findings written); any other code is a real scanner error.
          rc=0
          osv-scanner scan source -L out/runner-sbom.cdx.json --format json > out/runner-osv.json || rc=$?
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then echo "osv-scanner failed with exit $rc" >&2; exit "$rc"; fi
          python3 fork/bashy-build/audit-runner.py osv --report out/runner-osv.json
      - name: govulncheck binary reachability for all five target builds
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # govulncheck -mode=binary flags every Ollama-module symbol because
          # the Ollama advisories carry no per-symbol detail and no patched
          # version exists for any Ollama release (S436/#2028), so the gate
          # below — not the scanner exit code — decides. Accept 0 (clean) and
          # 3 (findings written); any other code is a real scanner error. The
          # per-target JSON stays in the audit outputs for the gate and the
          # final evidence check.
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            binary="out/runner-$target"
            [[ $target != windows-amd64 ]] || binary+='.exe'
            rc=0
            govulncheck -mode=binary -json "$binary" >"out/runner-$target.govulncheck.json" || rc=$?
            if [[ $rc -ne 0 && $rc -ne 3 ]]; then echo "govulncheck failed with exit $rc for $target" >&2; exit "$rc"; fi
          done
          python3 fork/bashy-build/audit-runner.py govulncheck --out out
      - name: Grype complete CycloneDX SBOM (fail on any severity)
        env:
          GRYPE_VERSION: v0.120.1
        run: |
          set -euo pipefail
          # The version pin is the positional TAG. install.sh -v is NOT the
          # version: it requests cosign signature verification, and cosign is
          # not on the runners (verified against the published ubuntu-24.04
          # image software list; the flag fails the install without it).
          # Tarball SHA-256 verification against the release checksums.txt is
          # unconditional in install.sh and stays.
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/v0.120.1/install.sh | sh -s -- -b "$RUNNER_TEMP/bin" "$GRYPE_VERSION"
          # Grype without --fail-on exits 0 with findings written (--fail-on
          # exits 2 when matches exceed the threshold, seen in the run-132
          # replay: scan exit 2 with 32 matches), so the gate below — not
          # the scanner exit code — decides. Any nonzero exit is a real
          # scanner error.
          rc=0
          "$RUNNER_TEMP/bin/grype" "sbom:out/runner-sbom.cdx.json" -o json > out/runner-grype.json || rc=$?
          if [[ $rc -ne 0 ]]; then echo "grype failed with exit $rc" >&2; exit "$rc"; fi
          python3 fork/bashy-build/audit-runner.py grype --report out/runner-grype.json
      - name: verify complete reports and generated Metal inputs
        run: |
          set -euo pipefail
          commit=$(git -C src rev-parse HEAD)
          python3 fork/bashy-build/audit-runner.py final --out out --commit "$commit"
