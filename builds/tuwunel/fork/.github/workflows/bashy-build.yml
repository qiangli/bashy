# bashy verified build of tuwunel (official upstream release, pinned).
#
# Installed on the `bashy-build` branch of github.com/qiangli/tuwunel from
# bashy's builds/tuwunel/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v1.9.4-1) at that branch.
#
# Pipeline (fail-closed): pin (provenance) -> build x4 (feature gate, cargo
# build, no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob
# --bundle per asset, self-verify against the exact identity, actions/attest,
# GitHub release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/tuwunel/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/tuwunel'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $UPSTREAM_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG"; exit 1; }
          [[ $BASHY_TAG =~ ^bashy-(v[0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream GitHub release must exist and be neither draft nor pre-release.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: tuwunel-linux-amd64
            runner: ubuntu-24.04
          - asset: tuwunel-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: tuwunel-darwin-arm64
            runner: macos-15
          - asset: tuwunel-darwin-amd64
            runner: macos-15-intel
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matrix-construct/tuwunel
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"

      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config strace util-linux iproute2 curl
      - name: host build dependencies (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >>"$GITHUB_ENV"
      - name: pinned rust toolchain
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >>"$GITHUB_ENV"

      - name: feature gate (no sentry / OpenTelemetry / tokio-console)
        run: fork/bashy-build/check-features.sh src
      - name: cargo build --release (locked)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/features.env
          cargo build --locked --release -p tuwunel --bin tuwunel --no-default-features --features "$FEATURES"
          mkdir -p ../out
          cp target/release/tuwunel "../out/${{ matrix.asset }}"
          "../out/${{ matrix.asset }}" --version

      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"

      - name: upload unsigned binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  audit:
    name: cargo audit + SBOM
    needs: pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: matrix-construct/tuwunel
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: pinned rust toolchain + pinned cargo-audit / cargo-cyclonedx
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >>"$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN
          cargo install --locked "cargo-audit@$CARGO_AUDIT_VERSION"
          cargo install --locked "cargo-cyclonedx@$CARGO_CYCLONEDX_VERSION"
      - name: cargo audit (deny warnings)
        working-directory: src
        run: |
          set -euo pipefail
          ignores=()
          # bashy-build/audit-ignore: one advisory id per line, each with a
          # justification comment; empty means nothing is waived.
          while read -r id _; do
            [[ -z $id || $id == \#* ]] || ignores+=(--ignore "$id")
          done <../fork/bashy-build/audit-ignore
          cargo audit --deny warnings --file Cargo.lock "${ignores[@]}"
      - name: SBOM (CycloneDX, bashy feature set)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          . ../fork/bashy-build/features.env
          cargo cyclonedx --manifest-path src/main/Cargo.toml --format json \
            --no-default-features --features "$FEATURES" --override-filename bashy-sbom
          sbom=$(find src/main -maxdepth 1 -name 'bashy-sbom*.json' | head -n1)
          [[ -n $sbom ]] || { echo "SBOM for src/main not produced"; exit 1; }
          mkdir -p ../out
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" >/dev/null
          cp "$sbom" "../out/tuwunel-$UPSTREAM_TAG.cdx.json"
      - name: upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: out/*.cdx.json
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          cp fork/bashy-build/tuwunel.toml dist/tuwunel-bashy.toml
          chmod +x dist/tuwunel-*-amd64 dist/tuwunel-*-arm64
          for a in tuwunel-linux-amd64 tuwunel-linux-arm64 tuwunel-darwin-arm64 tuwunel-darwin-amd64 \
                   "tuwunel-$UPSTREAM_TAG.cdx.json" tuwunel-bashy.toml; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum tuwunel-* >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in tuwunel-* SHA256SUMS; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official tuwunel $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo '    cosign verify-blob --bundle ASSET.sigstore.json \'
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "No telemetry, crash reporting, update checks or OpenTelemetry export are compiled in."
            echo "Gates passed before signing: pinned commit, feature gate, cargo audit --deny warnings, CycloneDX SBOM, no-egress."
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME (tuwunel $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/tuwunel-* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
