# bashy verified build of klatch (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/klatch/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/klatch from
# bashy's builds/klatch/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v1.2.5-1) at that branch.
# Upstream tags this release vX.Y.Z, so the trigger is
# bashy-v* and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/klatch/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/klatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not vX.Y.Z)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream release must exist and be neither draft nor pre-release.
          # UPSTREAM_API_BASE is https://api.github.com for a GitHub upstream and
          # the forge's own REST root otherwise; gitea answers the identical
          # /repos/SLUG/releases/tags/TAG shape, with the same .draft/.prerelease.
          # Unauthenticated calls from a shared runner IP are rate-limited, so
          # a GitHub upstream is queried with the job's own read-only token.
          auth=()
          if [[ "https://api.github.com" == https://api.github.com && -n ${GH_API_TOKEN:-} ]]; then
            auth=(-H "Authorization: Bearer $GH_API_TOKEN")
          fi
          rel=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H 'Accept: application/vnd.github+json' ${auth[@]+"${auth[@]}"} \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: klatch-v1.2.5-linux-amd64.tar.gz
            runner: ubuntu-24.04
          - asset: klatch-v1.2.5-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - asset: klatch-v1.2.5-darwin-arm64.tar.gz
            runner: macos-15
          - asset: klatch-v1.2.5-darwin-amd64.tar.gz
            runner: macos-15-intel
          - asset: klatch-web-v1.2.5.tar.gz
            runner: ubuntu-24.04
    steps:
      # Windows runners check out with core.autocrlf=true by default, which
      # rewrites LF to CRLF in the working tree. The prepare/audit gates hash
      # exact source bytes (e.g. src/LICENSE), so the conversion breaks the
      # pin on Windows while linux/darwin stay green. Disable it globally
      # BEFORE either checkout below, so both the fork scripts and the pinned
      # source land byte-identical on every OS. The hash checks themselves are
      # unchanged. No-op on non-Windows runners.
      - name: disable line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiangli/klatch
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential strace util-linux iproute2 curl
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      # One MATRIX, two unrelated artifact shapes: the klatch-web-* leg builds
      # the Node/yarn web bundle (architecture-independent, built once on the
      # amd64 runner); every other leg builds the cgo Go server for its own
      # linux arch. Each half is gated by matrix.asset so the other half's
      # toolchain steps are skipped rather than run uselessly.
      - name: set up Node (NODE_VERSION, upstream Dockerfile node:22-alpine)
        if: startsWith(matrix.asset, 'klatch-web-')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: install yarn (YARN_VERSION, classic)
        if: startsWith(matrix.asset, 'klatch-web-')
        run: npm install --global yarn@1.22.22
      - name: sdk dependencies from the frozen lockfile (app/sdk, databag-client-sdk)
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/sdk
        run: yarn install --frozen-lockfile
      - name: assert the sdk lockfile was not rewritten
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/sdk
        run: |
          set -euo pipefail
          # --frozen-lockfile already refuses a stale lockfile; this catches a
          # yarn version that resolved differently and rewrote it anyway.
          [[ -z $(git status --porcelain -- yarn.lock) ]] ||
            { echo "yarn rewrote yarn.lock"; git diff -- yarn.lock; exit 1; }
      - name: sdk build (tsup, upstream `yarn build`)
        # app/client/web's package.json depends on "databag-client-sdk":
        # "file:../../sdk" as of v1.2.3 — the web install below resolves that
        # path dependency from app/sdk/dist, so the sdk must be built first.
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/sdk
        run: yarn build
      - name: web dependencies from the frozen lockfile
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/client/web
        run: yarn install --frozen-lockfile
      - name: assert the web lockfile was not rewritten
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/client/web
        run: |
          set -euo pipefail
          # --frozen-lockfile already refuses a stale lockfile; this catches a
          # yarn version that resolved differently and rewrote it anyway.
          [[ -z $(git status --porcelain -- yarn.lock) ]] ||
            { echo "yarn rewrote yarn.lock"; git diff -- yarn.lock; exit 1; }
      - name: web build (vite, upstream `yarn run build`)
        if: startsWith(matrix.asset, 'klatch-web-')
        working-directory: src/app/client/web
        run: yarn run build
      - name: package the web asset (static files, no executable code)
        if: startsWith(matrix.asset, 'klatch-web-')
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C src/app/client/web/dist -czf "out/$ASSET" .
      - name: pinned Go toolchain (GO_TOOLCHAIN)
        if: ${{ !startsWith(matrix.asset, 'klatch-web-') }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          check-latest: false
          cache: false
      - name: go build (CGO_ENABLED=1, gorm sqlite driver needs cgo)
        if: ${{ !startsWith(matrix.asset, 'klatch-web-') }}
        working-directory: src/net/server
        env:
          # GOTOOLCHAIN pins the exact release regardless of go.mod's own
          # `toolchain go1.24.5` directive (an EOL minor, see tool.env), the
          # same mechanism builds/_shared/kinds/go/setup.yml uses.
          GOTOOLCHAIN: go1.26.9
        run: |
          set -euo pipefail
          . ../../../fork/bashy-build/PIN
          mkdir -p ../../../out
          # Upstream Dockerfile: CGO_ENABLED=1 go build -o databag . (no
          # ldflags, no tags). -trimpath and -buildid= drop the build path
          # and the action id, so the same bashy tag rebuilds the same bytes.
          env CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -buildid=" -o ../../../out/klatch .
      - name: package the server asset (binary + net/transform scripts)
        if: ${{ !startsWith(matrix.asset, 'klatch-web-') }}
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p out/payload/transform
          cp out/klatch out/payload/klatch
          cp src/net/transform/*.sh out/payload/transform/
          chmod +x out/payload/klatch out/payload/transform/*.sh
          tar -C out/payload -czf "out/$ASSET" .
          rm -rf out/payload out/klatch
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"

      - name: upload unsigned build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiangli/klatch
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      # Report-only: govulncheck and yarn audit need a vulnerability database
      # on the network (vuln.go.dev, the npm registry audit endpoint), which
      # is why this runs in the audit job rather than the no-egress-gated
      # build job. Neither tool GATES the release here (tool.env
      # RELEASE_GATES says so): both reports are produced and shipped as
      # release assets, but a reachable or unwaived finding does not fail
      # this job. That is a deliberate, narrower policy than
      # builds/_shared/kinds/go's audit (which fails on an unwaived reachable
      # finding) — see README.md #Audit.
      - name: pinned Go toolchain (for govulncheck; report-only)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          check-latest: false
          cache: false
      - name: govulncheck report (net/server; informational, never fails the job)
        working-directory: src/net/server
        env:
          GOTOOLCHAIN: go1.26.9
        run: |
          set -euo pipefail
          . ../../../fork/bashy-build/PIN
          mkdir -p ../../../out
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          report=../../../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          govulncheck -format json ./... >"$report" || true
          [[ -s $report ]] || { echo "govulncheck produced no report"; exit 1; }
          echo "govulncheck: report-only, not a release gate (tool.env RELEASE_GATES)"
      - name: set up Node (for yarn audit; report-only)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: install yarn (YARN_VERSION, classic)
        run: npm install --global yarn@1.22.22
      - name: yarn audit report (app/sdk, databag-client-sdk; informational, never fails the job)
        working-directory: src/app/sdk
        run: |
          set -euo pipefail
          . ../../../fork/bashy-build/PIN
          mkdir -p ../../../out
          report=../../../out/klatch-sdk-$UPSTREAM_TAG.yarn-audit.json
          yarn install --frozen-lockfile
          yarn audit --json >"$report" || true
          [[ -s $report ]] || { echo "yarn audit produced no report"; exit 1; }
          echo "yarn audit: report-only, not a release gate (tool.env RELEASE_GATES)"
      - name: yarn audit report (app/client/web; informational, never fails the job)
        working-directory: src/app/client/web
        run: |
          set -euo pipefail
          . ../../../../fork/bashy-build/PIN
          mkdir -p ../../../../out
          report=../../../../out/klatch-web-$UPSTREAM_TAG.yarn-audit.json
          yarn install --frozen-lockfile
          yarn audit --json >"$report" || true
          [[ -s $report ]] || { echo "yarn audit produced no report"; exit 1; }
          echo "yarn audit: report-only, not a release gate (tool.env RELEASE_GATES)"
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          # release assets are files; evidence directories are not published.
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
