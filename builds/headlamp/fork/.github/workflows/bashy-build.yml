# bashy verified build of headlamp (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/headlamp/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/headlamp from
# bashy's builds/headlamp/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v0.45.0-1) at that branch.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/headlamp/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/headlamp'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $UPSTREAM_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG"; exit 1; }
          [[ $BASHY_TAG =~ ^bashy-(v[0-9]+\.[0-9]+\.[0-9]+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream GitHub release must exist and be neither draft nor pre-release.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - asset: headlamp-linux-amd64
            runner: ubuntu-24.04
          - asset: headlamp-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: headlamp-darwin-arm64
            runner: macos-15
          - asset: headlamp-darwin-amd64
            runner: macos-15-intel
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubernetes-sigs/headlamp
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends strace util-linux iproute2 curl
      - name: pinned Go toolchain (backend/go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: assert upstream and security toolchains
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $(sed -n 's/^toolchain go\([0-9.]*\)$/\1/p' src/backend/go.mod) == "$GO_TOOLCHAIN" ]]
          [[ $GO_TOOLCHAIN_SECURITY_OVERRIDE == 1.26.9 ]]
          echo "GOTOOLCHAIN=go$GO_TOOLCHAIN_SECURITY_OVERRIDE" >> "$GITHUB_ENV"
      - name: pinned Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: pin npm major
        run: npm install --global 'npm@11'
      - name: apply declared Go security overrides
        working-directory: src/backend
        run: |
          set -euo pipefail
          . ../../fork/bashy-build/PIN
          for module in $GO_SECURITY_OVERRIDES; do go get "$module"; done
          [[ -z $(git status --porcelain -- . ':!go.mod' ':!go.sum') ]]
          for module in $GO_SECURITY_OVERRIDES; do
            path=${module%@*}; version=${module##*@}
            [[ $(go list -m -f '{{.Version}}' "$path") == "$version" ]] || exit 1
          done
      - name: apply pinned frontend security overrides
        run: |
          set -euo pipefail
          node fork/bashy-build/npm-security-overrides.mjs src/frontend
          npm --prefix src/frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
          [[ -z $(git -C src status --porcelain -- frontend ':!frontend/package.json' ':!frontend/package-lock.json') ]]
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      - name: frontend dependencies (upstream frozen lockfile)
        working-directory: src/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: upstream embedded-server build
        working-directory: src
        run: |
          set -euo pipefail
          # Upstream's backend-embed target builds frontend, copies it into the
          # Go embed package, then builds ./backend/cmd with the embed tag.
          REACT_APP_HEADLAMP_SIDEBAR_DEFAULT_OPEN=false CGO_ENABLED=0 make backend-embed
          mkdir -p ../out
          cp backend/headlamp-server "../out/${{ matrix.asset }}"
          "../out/${{ matrix.asset }}" -version
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"

      - name: upload unsigned build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubernetes-sigs/headlamp
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: pinned Go toolchain (backend/go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          check-latest: false
          cache: false
      - name: assert upstream and security toolchains
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $(sed -n 's/^toolchain go\([0-9.]*\)$/\1/p' src/backend/go.mod) == "$GO_TOOLCHAIN" ]]
          [[ $GO_TOOLCHAIN_SECURITY_OVERRIDE == 1.26.9 ]]
          echo "GOTOOLCHAIN=go$GO_TOOLCHAIN_SECURITY_OVERRIDE" >> "$GITHUB_ENV"
      - name: pinned Node and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: pin npm major
        run: npm install --global 'npm@11'
      - name: apply declared Go security overrides
        working-directory: src/backend
        run: |
          set -euo pipefail
          . ../../fork/bashy-build/PIN
          for module in $GO_SECURITY_OVERRIDES; do go get "$module"; done
          [[ -z $(git status --porcelain -- . ':!go.mod' ':!go.sum') ]]
          for module in $GO_SECURITY_OVERRIDES; do
            path=${module%@*}; version=${module##*@}
            [[ $(go list -m -f '{{.Version}}' "$path") == "$version" ]] || exit 1
          done
      - name: apply pinned frontend security overrides
        run: |
          set -euo pipefail
          node fork/bashy-build/npm-security-overrides.mjs src/frontend
          npm --prefix src/frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
          [[ -z $(git -C src status --porcelain -- frontend ':!frontend/package.json' ':!frontend/package-lock.json') ]]
      - name: pinned audit tools
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$GO_SBOM_VERSION"
      - name: govulncheck reachable findings fail
        working-directory: src/backend
        run: |
          set -euo pipefail
          . ../../fork/bashy-build/PIN
          mkdir -p ../../out
          report=../../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          govulncheck -format json ./cmd > "$report" || true
          [[ -s $report ]]
          jq -rs '[.[]|select(has("finding"))|.finding|select(.trace[0].function != null)|.osv]|unique|.[]' "$report" > "$RUNNER_TEMP/reachable"
          if [[ -s $RUNNER_TEMP/reachable ]]; then
            echo 'govulncheck: reachable findings are never waived:' >&2
            cat "$RUNNER_TEMP/reachable" >&2
            exit 1
          fi
      - name: frontend npm audit (runtime reachability gate)
        working-directory: src/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm_report="../../out/headlamp-$UPSTREAM_TAG.npm-audit.json"
          npm audit --omit=dev --json > "$npm_report" || true
          node ../../fork/bashy-build/npm-audit-gate.mjs "$npm_report"
      - name: backend CycloneDX SBOM
        working-directory: src/backend
        run: |
          set -euo pipefail
          . ../../fork/bashy-build/PIN
          cyclonedx-gomod app -json -licenses -main ./cmd -output "../../out/$TOOL-$UPSTREAM_TAG.cdx.json" .
      - name: stage audit outputs for OCI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headlamp-audit-source
          path: out/*
          if-no-files-found: error
          retention-days: 3

  image:
    name: build and sign OCI image
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated binaries and audit reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: build and push the two-platform minimal image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          chmod +x out/headlamp-linux-amd64 out/headlamp-linux-arm64
          cp fork/bashy-build/Containerfile out/Containerfile
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name headlamp-builder
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg "IMAGE_BASE=$IMAGE_BASE" --tag "$OCI_IMAGE:$GITHUB_REF_NAME" \
            --metadata-file out/image-metadata.json --file out/Containerfile out
          digest=$(jq -er '."containerimage.digest"|select(startswith("sha256:"))' out/image-metadata.json)
          printf '%s@%s\n' "$OCI_IMAGE" "$digest" > out/headlamp-image-digest.txt
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: keyless sign and verify image by digest
        run: |
          set -euo pipefail
          ref=$(cat out/headlamp-image-digest.txt)
          cosign sign --yes "$ref"
          cosign verify --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$ref"
          cosign sign-blob --yes --bundle out/headlamp-image-digest.txt.sigstore.json \
            out/headlamp-image-digest.txt
      - name: attach the immutable image digest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              out/headlamp-image-digest.txt out/headlamp-image-digest.txt.sigstore.json; then
              exit 0
            fi
            sleep 10
          done
          echo "binary release did not become available for the image digest" >&2
          exit 1
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
