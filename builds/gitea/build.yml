      # Gitea's release binaries carry the `bindata` tag, which embeds the
      # templates, public assets and the vite-built frontend. So the frontend
      # toolchain has to run before `go generate`. Upstream equivalents at the
      # pinned tag: .github/actions/node-setup, `make deps-frontend`,
      # `make frontend` (= pnpm exec vite build), tools/build-release.sh.
      - name: set up Node (NODE_VERSION, upstream .github/actions/node-setup)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: @@NODE_VERSION@@
      - name: set up pnpm (PNPM_VERSION, upstream packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: @@PNPM_VERSION@@
          run_install: false
      - name: frontend dependencies from the frozen lockfile
        working-directory: src
        run: pnpm install --frozen-lockfile
      - name: assert the lockfile was not rewritten
        working-directory: src
        run: |
          set -euo pipefail
          # --frozen-lockfile already refuses a stale lockfile; this catches a
          # pnpm version that resolved differently and rewrote it anyway.
          [[ -z $(git status --porcelain -- pnpm-lock.yaml) ]] ||
            { echo "pnpm rewrote pnpm-lock.yaml"; git diff -- pnpm-lock.yaml; exit 1; }
      - name: frontend build (vite)
        working-directory: src
        run: pnpm exec vite build
      - name: go generate (embeds the frontend under the bindata tag)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          # env -u: upstream clears CC/GOOS/GOARCH so generate runs for the HOST.
          env -u CC -u GOOS -u GOARCH CGO_ENABLED=0 go generate -tags "$GO_BUILD_TAGS" ./...
      - name: go build (upstream CGO/tags, -trimpath, reproducible ldflags)
        working-directory: src
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          cgo=
          for pair in $GO_CGO; do
            [[ ${pair%%=*} == "$ASSET" ]] || continue
            cgo=${pair#*=}
          done
          case $cgo in
          0 | 1) ;;
          *) echo "PIN GO_CGO has no 0/1 entry for $ASSET"; exit 1 ;;
          esac
          mkdir -p ../out
          # -trimpath and -buildid= drop the build path and the action id, and
          # GO_LDFLAGS stamps only PIN-derived values (upstream's own release
          # stamp is a `git describe`), so the same bashy tag rebuilds the same
          # bytes. The frontend is already embedded by `go generate` above.
          env CGO_ENABLED="$cgo" go build -trimpath -tags "$GO_BUILD_TAGS" \
            -ldflags "-s -w -buildid= $GO_LDFLAGS" \
            -o "../out/$ASSET" "$GO_PACKAGE"
          "../out/$ASSET" "$GO_VERSION_ARG"
