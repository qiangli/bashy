; NO-TRACKING runtime baseline for the bashy gitea verified build.
; Shipped as the release asset gitea-bashy.ini, and the exact configuration
; files/no-egress-test.sh gates this build against.
;
; Placeholders the launcher substitutes (the no-egress gate does the same):
;   {{DATA_DIR}}   GITEA_WORK_DIR: db, repositories, logs
;   {{HTTP_ADDR}}  bind address — loopback; the mesh is the boundary
;   {{HTTP_PORT}}  bind port
;   {{ROOT_URL}}   externally visible base URL
;   {{SECRET_KEY}} per-instance secret; NEVER baked into a release asset
;
; Every key below mirrors what yoke's external/loom renderConfig() seeds, so a
; bashy-signed gitea and a yoke-launched loom agree. Upstream reference:
; go-gitea/gitea custom/conf/app.example.ini at the pinned tag.
APP_NAME = loom
RUN_MODE = prod

[server]
HTTP_ADDR = {{HTTP_ADDR}}
HTTP_PORT = {{HTTP_PORT}}
ROOT_URL = {{ROOT_URL}}
; No SSH listener: git over HTTP on loopback only.
DISABLE_SSH = true

[database]
; modernc sqlite is the DEFAULT driver in this release (models/db/
; driver_sqlite_modernc.go is `//go:build !sqlite_mattn`), so a pure-Go
; CGO_ENABLED=0 build supports sqlite3 with no extra tag.
DB_TYPE = sqlite3
PATH = {{DATA_DIR}}/gitea.db

[repository]
ROOT = {{DATA_DIR}}/repositories

[security]
; Skip the /install screen: the instance comes up ready.
INSTALL_LOCK = true
SECRET_KEY = {{SECRET_KEY}}

[service]
; No self-service accounts on a loopback forge.
DISABLE_REGISTRATION = true
ENABLE_REVERSE_PROXY_AUTHENTICATION = false
ENABLE_REVERSE_PROXY_AUTO_REGISTRATION = false
ENABLE_REVERSE_PROXY_EMAIL = false
ENABLE_REVERSE_PROXY_FULL_NAME = false

[actions]
; Off by default; the launcher turns it on when it also runs act_runner.
ENABLED = false
DEFAULT_ACTIONS_URL = github

[picture]
; Never resolve user avatars against gravatar.com or a libravatar federation
; peer: upstream defaults DISABLE_GRAVATAR = false with GRAVATAR_SOURCE =
; gravatar, which is a per-user third-party request from every page view.
DISABLE_GRAVATAR = true
ENABLE_FEDERATED_AVATAR = false

[proxy]
; Gitea must never route its own outbound HTTP through a proxy.
PROXY_ENABLED = false

[cron.update_checker]
; THE one upstream phone-home: a periodic DNS TXT lookup at release.gitea.io.
ENABLED = false

[log]
MODE = console
LEVEL = info
