# bashy verified build of prima.cpp (first-party MIT source, pinned).
#
# GENERATED by bashy builds/render.sh from builds/prima.cpp/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/prima.cpp from
# bashy's builds/prima.cpp/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-bashy-prima-0.1.2-1) at that branch.
# Upstream tags this release bashy-prima-X.Y.Z, so the trigger is
# bashy-bashy-prima-* and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/prima.cpp/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-bashy-prima-*"

permissions: {}

# Windows' default is PowerShell; the native build and gate scripts need Git Bash.
# (TOOL ollama keeps its own block above; this one serves tools that declare
# WINDOWS_SHELL=bash instead. A tool matching both would render duplicate keys,
# so declare at most one of the two.)
defaults:
  run:
    shell: bash

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/prima.cpp'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='^bashy-prima-[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not bashy-prima-X.Y.Z)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # Operator S436/#2029: first-party MIT source, not an upstream mirror.
          [[ $UPSTREAM_SLUG == qiangli/prima.cpp ]]
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: prima-linux-amd64
            runner: ubuntu-24.04
          - asset: prima-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: prima-darwin-arm64
            runner: macos-15
          - asset: prima-darwin-amd64
            runner: macos-15-intel
          - asset: prima-windows-amd64
            runner: windows-2025
    steps:
      # Windows runners check out with core.autocrlf=true by default, which
      # rewrites LF to CRLF in the working tree. The prepare/audit gates hash
      # exact source bytes (e.g. src/LICENSE), so the conversion breaks the
      # pin on Windows while linux/darwin stay green. Disable it globally
      # BEFORE either checkout below, so both the fork scripts and the pinned
      # source land byte-identical on every OS. The hash checks themselves are
      # unchanged. No-op on non-Windows runners.
      - name: disable line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout reviewed first-party source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiangli/prima.cpp
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends cmake ninja-build strace iproute2 curl python3-venv
      - name: prepare pinned CMake dependencies and reviewed overlay
        run: python3 fork/bashy-build/prepare.py src
      - name: provision pinned MinGW clang toolchain (Windows)
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          # Explicit package set, no metapackage: every name is pinned here and
          # the resolved versions are recorded per build in
          # out/windows-toolchain.json (see windows-compilers.py), which
          # build.sh folds into the compiler-input closure, SBOM and audit.
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-ninja
          cache: false
      - name: native Windows MinGW + clang compilers
        if: runner.os == 'Windows'
        env:
          # Hand the probe the exact MSYS2 root setup-msys2 installed, so
          # windows-compilers.py searches <msys2-location>/clang64/bin ONLY
          # and can never fall back to C:\Program Files\LLVM (MSVC-target).
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python3 fork/bashy-build/windows-compilers.py
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      - name: native CMake build
        env:
          ASSET: ${{ matrix.asset }}
        run: fork/bashy-build/build.sh src "$ASSET"
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"
      - name: upload no-egress gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}-egress
          path: out/*-egress.txt
          if-no-files-found: warn
          retention-days: 3

      - name: upload unsigned build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: [pin, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout reviewed first-party source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiangli/prima.cpp
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: prepare pinned CMake dependencies and reviewed overlay
        run: python3 fork/bashy-build/prepare.py src
      - name: download compiler input evidence from all five native builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prima-*
          path: native-inputs
          merge-multiple: true
      - name: dependency license and vulnerability audit with SBOM
        run: fork/bashy-build/audit.sh src
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of first-party $TOOL $UPSTREAM_TAG"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
