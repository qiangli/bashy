# bashy verified build of openclaw (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/openclaw/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/openclaw from
# bashy's builds/openclaw/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v2026.10.2-1) at that branch.
# Upstream tags this release vX.Y.Z, so the trigger is
# bashy-v* and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/openclaw/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/openclaw'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not vX.Y.Z)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream release must exist and be neither draft nor pre-release.
          # UPSTREAM_API_BASE is https://api.github.com for a GitHub upstream and
          # the forge's own REST root otherwise; gitea answers the identical
          # /repos/SLUG/releases/tags/TAG shape, with the same .draft/.prerelease.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: openclaw-gateway-linux-amd64
            runner: ubuntu-24.04
          - asset: openclaw-gateway-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: openclaw-gateway-darwin-arm64
            runner: macos-15
          - asset: openclaw-gateway-darwin-amd64
            runner: macos-15-intel
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends strace iproute2 curl
      - name: set up Node (NODE_VERSION, matches upstream Dockerfile base)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: set up pnpm (PNPM_VERSION, upstream packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.5.1
          run_install: false
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      - name: install from the verified lockfile (no implicit scripts)
        working-directory: src
        run: |
          # --ignore-scripts: lifecycle scripts are supply-chain surface.
          # Only the documented build entrypoints below run, explicitly.
          # The workspace keeps upstream's own nodeLinker (isolated, per
          # pnpm-workspace.yaml): nothing here needs the hoisted layout now
          # that the npm-pack path is gone — the shipped tree is assembled
          # per the upstream Dockerfile instead (see below).
          pnpm install --frozen-lockfile --ignore-scripts
      - name: audit gate (a) — prod must be clean at high
        working-directory: src
        run: pnpm audit --prod --audit-level high
      - name: audit gate (b,c) — full audit vs reviewed exceptions
        working-directory: src
        run: |
          # `|| true`: pnpm exits nonzero when findings exist; the gate
          # script below renders the verdict (fail-closed on unknown shapes).
          # Per-asset file name: every matrix leg uploads out/* and the
          # release merges them, so a shared audit-full.json would collide.
          mkdir -p ../out
          pnpm audit --json > "../out/${{ matrix.asset }}-audit-full.json" || true
          pnpm audit --prod --json > "${RUNNER_TEMP}/audit-prod.json" || true
          node ../fork/bashy-build/scripts/audit-gate.mjs \
            --full "../out/${{ matrix.asset }}-audit-full.json" \
            --prod "${RUNNER_TEMP}/audit-prod.json" \
            --exceptions ../fork/bashy-build/audit-exceptions
      - name: apply no-tracking + OTel-local config
        run: |
          set -euo pipefail
          set -a; . fork/bashy-build/no-tracking.env; . fork/bashy-build/otel.env; set +a
          {
            echo "DO_NOT_TRACK=$DO_NOT_TRACK"
            echo "OPENCLAW_NO_AUTO_UPDATE=$OPENCLAW_NO_AUTO_UPDATE"
            echo "OPENCLAW_TELEMETRY_ENDPOINT=$OPENCLAW_TELEMETRY_ENDPOINT"
            echo "OPENCLAW_EXTENSIONS=$OPENCLAW_EXTENSIONS"
            echo "OPENCLAW_DISABLE_BONJOUR=$OPENCLAW_DISABLE_BONJOUR"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT"
            echo "OTEL_EXPORTER_OTLP_PROTOCOL=$OTEL_EXPORTER_OTLP_PROTOCOL"
            echo "OTEL_SERVICE_NAME=$OTEL_SERVICE_NAME"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gateway-config"
          cp fork/bashy-build/openclaw-bashy.json "$RUNNER_TEMP/gateway-config/openclaw.json"
          echo "OPENCLAW_CONFIG_PATH=$RUNNER_TEMP/gateway-config/openclaw.json" >> "$GITHUB_ENV"
      - name: build gateway dist
        working-directory: src
        # Native replay of the upstream Dockerfile `build` stage. Upstream
        # runs `pnpm build:docker` + `pnpm ui:build`; `build:docker` exits 1
        # outside Docker, while plain `pnpm build` passed in fork CI — so the
        # native replay builds with `pnpm build && pnpm ui:build`.
        run: pnpm build && pnpm ui:build
      - name: install production dependencies in a separate copy
        run: |
          set -euo pipefail
          # Native replay of the upstream Dockerfile `production-deps` stage:
          # a SEPARATE copy holding only the install inputs, then
          # `pnpm install --frozen-lockfile --prod`. Kept apart from src/
          # so dev dependencies from the build install above can never leak
          # into the shipped node_modules.
          # Input set = the Dockerfile `dependency-inputs` stage: the root
          # manifests, the workspace member manifests pnpm needs to resolve
          # (packages/*, extensions/*, plus ui/ — a literal workspace member
          # whose package.json upstream copies explicitly), patches, and the
          # root node-*.mjs helpers. examples/ ships no manifests upstream
          # (the Dockerfile does not copy it either). Plain cp (not cp -n):
          # a missing input must fail here, not produce a half-resolved
          # install. The workspace file keeps upstream's nodeLinker: isolated.
          rm -rf prod
          mkdir -p prod/ui prod/packages prod/patches prod/extensions
          cp src/package.json src/pnpm-lock.yaml src/pnpm-workspace.yaml src/.npmrc prod/
          cp src/node-*.mjs prod/
          cp src/ui/package.json prod/ui/
          cp -a src/packages/. prod/packages/
          cp -a src/patches/. prod/patches/
          cp -a src/extensions/. prod/extensions/
          cd prod
          # --ignore-scripts: lifecycle scripts are supply-chain surface
          # (same rule as the build install above). Native legs build for
          # their own OS/arch, so no --config.supportedArchitectures
          # override: pnpm resolves for the runner it runs on, which is the
          # platform whose tree this leg ships.
          pnpm install --frozen-lockfile --prod --ignore-scripts
          test -d node_modules || { echo "node_modules missing after pnpm install --prod" >&2; exit 1; }
      - name: assemble the runtime tree (upstream Docker runtime, natively)
        run: |
          set -euo pipefail
          # Native replay of the upstream Dockerfile `runtime-assets` stage +
          # final-stage COPY list (see Dockerfile at the pinned tag): dist
          # from the build above, node_modules from the separate prod
          # install, everything else from src/.
          RUNTIME="runtime/package"
          rm -rf runtime
          mkdir -p "$RUNTIME"
          # pnpm's isolated layout is a .pnpm store of real dirs + symlinks:
          # keep them as links (plain cp -a, NEVER --dereference —
          # dereferencing explodes the tree and broke the linux-arm64 repro).
          cp -a prod/node_modules "$RUNTIME/node_modules"
          cp -a src/dist "$RUNTIME/dist"
          cp src/package.json src/pnpm-lock.yaml src/pnpm-workspace.yaml "$RUNTIME/"
          cp -a src/patches "$RUNTIME/patches"
          cp src/node-version.mjs src/node-sqlite.mjs src/node-runtime-update.mjs \
            src/node-runtime-recovery.mjs src/node-runtime-env.mjs \
            src/cli-root-options.mjs src/gateway-run-argv.mjs src/gateway-shutdown-budget.mjs \
            src/node-host-launcher.mjs src/node-compile-cache.mjs \
            src/docker-entrypoint.mjs src/openclaw.mjs "$RUNTIME/"
          cp -a src/extensions "$RUNTIME/extensions"
          cp -a src/skills src/docs src/qa "$RUNTIME/"
          # Upstream's `node scripts/prune-docker-plugin-dist.mjs`, the way
          # the Dockerfile runs it (OPENCLAW_EXTENSIONS + bundled-plugin-dir
          # env, repo root as cwd — the script resolves its root from the
          # cwd). Its lib imports are script-relative, so the script tree is
          # staged here only for this step and replaced by the shipped
          # bootstrap set below. Selection matches the OCI build arg and the
          # shipped gateway config (diagnostics-otel -> local collector).
          cp -a src/scripts "$RUNTIME/scripts"
          cd "$RUNTIME"
          OPENCLAW_EXTENSIONS="diagnostics-otel" OPENCLAW_BUNDLED_PLUGIN_DIR="extensions" \
            node scripts/prune-docker-plugin-dist.mjs
          # Shipped scripts/ = exactly what upstream ships (Dockerfile
          # final-stage COPY lines): package.json `files` scripts/* via
          # copy-bootstrap-scripts.mjs, plus guard-inventory-utils.mjs.
          node scripts/docker/copy-bootstrap-scripts.mjs ./.runtime-bootstrap
          rm -rf ./scripts
          mv ./.runtime-bootstrap/scripts ./scripts
          rm -rf ./.runtime-bootstrap
          mkdir -p scripts/lib
          cp ../../src/scripts/lib/guard-inventory-utils.mjs scripts/lib/
          cd ../..
          # Dockerfile `runtime-assets` RUN tail, adapted: drop build
          # metadata from dist, materialize the @openclaw/ai workspace link
          # into a real dir (packages/ sources do not ship, so the link
          # would dangle — upstream does the same copy-over), and remove the
          # self-install links of the build.
          find "$RUNTIME/dist" -type f \
            \( -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' -o -name '*.map' \) -delete
          if [ -L "$RUNTIME/node_modules/@openclaw/ai" ]; then
            ai_target="$(readlink -f "$RUNTIME/node_modules/@openclaw/ai")"
            ai_tmp="$(mktemp -d)"
            cp -a "$ai_target" "$ai_tmp/ai"
            rm "$RUNTIME/node_modules/@openclaw/ai"
            mv "$ai_tmp/ai" "$RUNTIME/node_modules/@openclaw/ai"
            rmdir "$ai_tmp"
          fi
          rm -rf "$RUNTIME/node_modules/openclaw" \
            "$RUNTIME/node_modules/.bin/openclaw" \
            "$RUNTIME"/node_modules/.pnpm/openclaw@*/node_modules/openclaw
          # Keep only the platform packages the selected plugins require
          # (Dockerfile lines: required-platform-packages + the
          # claude-agent-sdk-linux-* prune). Selection is computed with
          # upstream's own script against the pinned source.
          node src/scripts/lib/docker-plugin-selection.mjs src/extensions \
            "diagnostics-otel" --required-platform-packages \
            > "$RUNNER_TEMP/openclaw-required-platform-packages"
          if ! grep -q '^@anthropic-ai/claude-agent-sdk-' \
              "$RUNNER_TEMP/openclaw-required-platform-packages"; then
            if [ -d "$RUNTIME/node_modules/@anthropic-ai" ]; then
              find "$RUNTIME/node_modules/@anthropic-ai" -maxdepth 1 -type d \
                -name 'claude-agent-sdk-linux-*' -exec rm -rf {} +
            fi
          fi
          # Fail-closed assembly check: the tree must start the gateway
          # (openclaw.mjs + dist + node_modules) with no further install.
          test -f "$RUNTIME/openclaw.mjs" || { echo "missing $RUNTIME/openclaw.mjs" >&2; exit 1; }
          test -d "$RUNTIME/dist" || { echo "missing $RUNTIME/dist" >&2; exit 1; }
          test -d "$RUNTIME/node_modules" || { echo "missing $RUNTIME/node_modules" >&2; exit 1; }
          test -f "$RUNTIME/package.json" || { echo "missing $RUNTIME/package.json" >&2; exit 1; }
          test -f "$RUNTIME/pnpm-lock.yaml" || { echo "missing $RUNTIME/pnpm-lock.yaml" >&2; exit 1; }
      - name: tar the runtime tree (per-platform signed artifact)
        run: |
          set -euo pipefail
          # One tarball per matrix leg: native modules make the prod install
          # platform-specific, so each leg ships its own tree (free GitHub
          # runners only). Symlinks stay symlinks (no --dereference — see
          # the assembly step). Portable tar: macOS ships bsdtar (no GNU
          # --sort/--mtime flags), so no cross-platform bit-reproducibility
          # is attempted here — patch_bundled.py repacks deterministically
          # (gzip mtime=0) after the security patch.
          TARBALL="out/${{ matrix.asset }}-${GITHUB_REF_NAME}.tgz"
          tar -czf "$TARBALL" -C runtime package
          ls -la "$TARBALL"
          tar -tzf "$TARBALL" | head -n 20
      - name: SBOM of the runtime tree (CycloneDX)
        # Pinned anchore/sbom-action (same pin as before); it scans the
        # assembled per-platform runtime tree, so the SBOM describes what
        # ships. patch_bundled.py then updates it in place for the security
        # patch (regenerating would reproduce the stale pre-patch tree,
        # which no longer exists as a scan target once the tarball is the
        # artifact — only the tarball is patched, not the on-disk tree).
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./runtime/package
          format: cyclonedx-json
          output-file: out/${{ matrix.asset }}-sbom.cyclonedx.json
      - name: security patch — replace bundled http-cache-semantics <4.3.0 (GHSA-ch52-4w7c-c8xp)
        run: |
          set -euo pipefail
          # npm 12.x bundles its own http-cache-semantics 4.2.0 and bundled
          # deps ignore overrides, so no workspace override can move the copy
          # shipped inside the pnpm tree (in practice
          # package/node_modules/.pnpm/npm@12.1.0/node_modules/npm/node_modules/http-cache-semantics).
          # Patch it here, after the tarball and before signing: verify the
          # registry dist.integrity (sha512) before use, repack
          # deterministically, and fix the already-published SBOM in place
          # (it must already have run — see below).
          TARBALL="out/${{ matrix.asset }}-${GITHUB_REF_NAME}.tgz"
          SBOM="out/${{ matrix.asset }}-sbom.cyclonedx.json"
          test -f "$TARBALL" || { echo "missing $TARBALL" >&2; exit 1; }
          test -f "$SBOM" || { echo "missing $SBOM (SBOM step must run before this patch)" >&2; exit 1; }
          # Pinned in the repo, never taken from the registry at build time
          # (the registry must not be its own trust anchor). Integrity matches
          # the upstream pnpm lockfile's resolution for http-cache-semantics@4.3.0.
          REPLACEMENT_URL="https://registry.npmjs.org/http-cache-semantics/-/http-cache-semantics-4.3.0.tgz"
          REPLACEMENT_INTEGRITY="sha512-M5t5LlJpS1UHMjvwRQVdFHvPISGeLAxNcrWuJkeGh0KxsqCHZ1O3NXZU/8x7cD0BDcGW8kapxMKTvwlqrNkHkA=="
          curl -sSL --fail "$REPLACEMENT_URL" -o "${RUNNER_TEMP}/http-cache-semantics-4.3.0.tgz"
          # Python tarfile handles the GNU LongLink/PAX entries in the tarball,
          # and its node_modules/<pkg> match also covers pnpm's .pnpm layout.
          python3 fork/bashy-build/scripts/patch_bundled.py \
            --tarball "$TARBALL" \
            --replacement "${RUNNER_TEMP}/http-cache-semantics-4.3.0.tgz" \
            --integrity "$REPLACEMENT_INTEGRITY" \
            --sbom "$SBOM"
          # The SBOM is patched in place (not regenerated) on purpose: only the
          # tarball is patched, so the on-disk runtime tree still holds the
          # pre-patch copy and regenerating would reproduce the stale 4.2.0
          # entry. The SBOM must describe the SHIPPED tarball — hence the
          # in-place fix, in this order.
      - name: security gate — no http-cache-semantics <4.3.0 in the shipped tarball
        run: |
          python3 fork/bashy-build/scripts/patch_bundled.py --verify-only \
            --tarball "out/${{ matrix.asset }}-${GITHUB_REF_NAME}.tgz"
      - name: build gateway OCI image (pinned upstream Dockerfile)
        # Linux only: macOS runners have no Docker daemon, and the signed
        # per-platform artifacts are the runtime-tree tarballs above. The
        # image still builds on both Linux legs (one digest per leg).
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker build \
            --file src/Dockerfile \
            --build-arg OPENCLAW_EXTENSIONS="diagnostics-otel" \
            --tag "openclaw-gateway:${GITHUB_REF_NAME}" \
            src
          docker inspect "openclaw-gateway:${GITHUB_REF_NAME}" \
            --format='{{.Id}}' > "out/${{ matrix.asset }}-image.digest"
          cat "out/${{ matrix.asset }}-image.digest"
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "runtime/package"

      - name: upload unsigned build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
