      # The kind's audit (builds/_shared/kinds/go/audit.yml), widened to the
      # TWO packages this release ships: tailscaled and the tailscale CLI.
      # Same setup fragment as the build job, so the audited tree and
      # toolchain are the shipped ones.
@@INCLUDE setup@@
      - name: pinned audit tools (built with their OWN pinned toolchain)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # See builds/README.md §The audit tools have their own toolchain.
          GOTOOLCHAIN=go@@GO_AUDIT_TOOLCHAIN@@ go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          GOTOOLCHAIN=go@@GO_AUDIT_TOOLCHAIN@@ go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$GO_SBOM_VERSION"
          echo "audit tools built with: go@@GO_AUDIT_TOOLCHAIN@@ (govulncheck $GOVULNCHECK_VERSION, cyclonedx-gomod $GO_SBOM_VERSION)"
          echo "analysis toolchain:     $(go version)"
      - name: govulncheck (source mode, the SHIPPED packages and tags)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          report=../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          echo "govulncheck scope: $GO_PACKAGE $TAILSCALE_CLI_PACKAGE -tags $GO_AUDIT_TAGS"
          CGO_ENABLED=0 govulncheck -format json -tags "$GO_AUDIT_TAGS" \
            "$GO_PACKAGE" "$TAILSCALE_CLI_PACKAGE" >"$report" || true
          [[ -s $report ]] || { echo "govulncheck produced no report"; exit 1; }
          # A finding whose first trace frame names a function is REACHABLE
          # from called code; module-only findings are informational.
          jq -rs '[.[] | select(has("finding")) | .finding
                   | select(.trace[0].function != null) | .osv]
                  | unique | .[]' "$report" | sed '/^$/d' | sort -u >"$RUNNER_TEMP/found"
          grep -Ev '^[[:space:]]*(#|$)' ../fork/bashy-build/vuln-ignore |
            awk '{print $1}' | sort -u >"$RUNNER_TEMP/waived" || true
          if comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | grep -q .; then
            echo "govulncheck: unwaived vulnerabilities reachable from called code:"
            comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | sed 's/^/  /'
            exit 1
          fi
          echo "govulncheck: no unwaived reachable vulnerability ($(wc -l <"$RUNNER_TEMP/found") reachable, all waived or none)"
      - name: SBOM (CycloneDX, the bashy build configuration)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          sbom=../out/$TOOL-$UPSTREAM_TAG.cdx.json
          # tailscaled's module graph; the CLI lives in the same module.
          CGO_ENABLED=0 GOFLAGS="-tags=$GO_AUDIT_TAGS" \
            cyclonedx-gomod app -json -licenses -main "$GO_PACKAGE" -output "$sbom" .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" >/dev/null
