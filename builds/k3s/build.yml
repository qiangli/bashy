      # k3s's own build (upstream scripts/build at the pinned tag), minus every
      # network fetch scripts/download makes: no k3s-root userland tarball, no
      # runc clone, no Helm charts from k3s.io. What is built here comes from
      # src/ and the modules its go.sum pins, nothing else.
      - name: embed the image-free manifests (upstream scripts/build cp)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          # Upstream copies all of manifests/ into pkg/deploy/embed/. Only the
          # declared, image-free ones are copied here; the rest would deploy
          # upstream container images, which bashy does not run.
          for m in $K3S_MANIFESTS; do
            if grep -q 'image:' "manifests/$m"; then
              echo "manifests/$m references a container image; it may not be embedded"; exit 1
            fi
            cp -v "manifests/$m" pkg/deploy/embed/
          done
      - name: cgo-free overlay (two reviewed upstream files, tree untouched)
        working-directory: src
        run: |
          set -euo pipefail
          ../fork/bashy-build/cgo-free-overlay.sh . "$RUNNER_TEMP/cgo-free"
          echo "K3S_OVERLAY=$RUNNER_TEMP/cgo-free/overlay.json" >>"$GITHUB_ENV"
      - name: go build k3s + containerd-shim-runc-v2 (static, -trimpath, reproducible ldflags)
        working-directory: src
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          cgo=
          for pair in $GO_CGO; do
            [[ ${pair%%=*} == "$ASSET" ]] || continue
            cgo=${pair#*=}
          done
          [[ $cgo == 0 ]] || { echo "PIN GO_CGO must be 0 for $ASSET (bashy links no cgo sqlite; runc is the one cgo build)"; exit 1; }
          [[ $(go env GOOS) == linux ]] || { echo "k3s is built on linux runners only"; exit 1; }
          arch=$(go env GOARCH)
          [[ $ASSET == "k3s-linux-$arch" ]] || { echo "MATRIX asset $ASSET does not match runner arch $arch"; exit 1; }
          # Upstream version.sh reads these from go.mod (get-module-version /
          # get-module-path); -mod=readonly keeps the read from rewriting it.
          modver() { go list -mod=readonly -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' "$1"; }
          modpath() { go list -mod=readonly -m -f '{{if .Replace}}{{.Replace.Path}}{{else}}{{.Path}}{{end}}' "$1"; }
          ldflags="$GO_LDFLAGS"
          ldflags+=" -X github.com/containerd/containerd/v2/version.Version=$(modver github.com/containerd/containerd/v2)"
          ldflags+=" -X github.com/containerd/containerd/v2/version.Package=$(modpath github.com/containerd/containerd/v2)"
          ldflags+=" -X sigs.k8s.io/cri-tools/pkg/version.Version=$(modver sigs.k8s.io/cri-tools)"
          mkdir -p ../out
          # No cgo: no C toolchain, no libc, static by construction.
          env CGO_ENABLED=0 \
            go build -mod=readonly -trimpath -buildvcs=false -overlay "$K3S_OVERLAY" -tags "$GO_BUILD_TAGS" \
            -ldflags "-s -w -buildid= $ldflags" \
            -o "../out/$ASSET" "$GO_PACKAGE"
          # The shim, as containerd's own Makefile ships it: CGO_ENABLED=0.
          env CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false \
            -ldflags "-s -w -buildid= -X github.com/containerd/containerd/v2/version.Version=$(modver github.com/containerd/containerd/v2)" \
            -o "../out/containerd-shim-runc-v2-linux-$arch" "$SHIM_PACKAGE"
          # The go.mod/go.sum the release builds from must be the pinned ones.
          [[ -z $(git status --porcelain -- go.mod go.sum) ]] || { echo "the build rewrote go.mod/go.sum"; git diff -- go.mod go.sum; exit 1; }
          # Pure-Go sqlite only, never mattn/go-sqlite3: the cgo driver must
          # not be in the shipped binary at all.
          if go version -m "../out/$ASSET" | grep -E 'CGO_ENABLED=1|mattn/go-sqlite3'; then
            echo "../out/$ASSET links cgo or mattn/go-sqlite3"; exit 1
          fi
          # Static means no ELF interpreter: the binaries must run FROM scratch.
          for b in "../out/$ASSET" "../out/containerd-shim-runc-v2-linux-$arch"; do
            if readelf -l "$b" | grep -q 'Requesting program interpreter'; then
              echo "$b is dynamically linked"; readelf -l "$b" | grep -A1 INTERP; exit 1
            fi
          done
          # Smoke the artifacts: a binary that cannot report its own version is
          # not a release candidate, and it must report the pinned release.
          "../out/$ASSET" "$GO_VERSION_ARG" | tee "$RUNNER_TEMP/k3s-version"
          grep -qF "$UPSTREAM_TAG" "$RUNNER_TEMP/k3s-version" || { echo "k3s does not report $UPSTREAM_TAG"; exit 1; }
          "../out/containerd-shim-runc-v2-linux-$arch" -v
