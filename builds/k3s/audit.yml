      # The kind's audit (builds/_shared/kinds/go/audit.yml), widened to the
      # TWO packages this release ships: the k3s multicall binary and the
      # containerd shim. Same setup fragment as the build job, so the audited
      # tree and toolchain are the shipped ones.
@@INCLUDE setup@@
      - name: pinned audit tools (built with their OWN pinned toolchain)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # See builds/README.md §The audit tools have their own toolchain.
          GOTOOLCHAIN=go@@GO_AUDIT_TOOLCHAIN@@ go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          GOTOOLCHAIN=go@@GO_AUDIT_TOOLCHAIN@@ go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$GO_SBOM_VERSION"
          echo "audit tools built with: go@@GO_AUDIT_TOOLCHAIN@@ (govulncheck $GOVULNCHECK_VERSION, cyclonedx-gomod $GO_SBOM_VERSION)"
          echo "analysis toolchain:     $(go version)"
      - name: the build's vendor/ and overlay, applied to the audited tree
        working-directory: src
        run: |
          set -euo pipefail
          # govulncheck type-checks from disk and ignores `go build -overlay`,
          # so the audit job (which ships nothing) generates the same vendor/
          # and writes the SAME files the build overlays into its own checkout
          # (an empty backing = the build deletes that file).
          go mod vendor
          ov=$RUNNER_TEMP/k3s-overlay
          ../fork/bashy-build/k3s-overlay.sh . "$ov"
          while IFS=$'\t' read -r target backing; do
            if [[ -z $backing ]]; then rm -v "$target"; else cp -v "$backing" "$target"; fi
          done <"$ov/apply.tsv"
      - name: govulncheck (source mode, the SHIPPED packages and tags)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          report=../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          # Both shipped packages, CGO_ENABLED=0, each from where the build
          # takes it: k3s from vendor/ with its tags, the shim (not a k3s
          # import, so not vendored) from the module cache. The shim's run
          # keeps the k3s tags, a superset of the none it is built with. Both
          # JSON streams go to the one report; jq -s reads them together.
          echo "govulncheck scope: $GO_PACKAGE (-mod=vendor) + $SHIM_PACKAGE (-mod=readonly), -tags $GO_AUDIT_TAGS"
          {
            CGO_ENABLED=0 GOFLAGS=-mod=vendor govulncheck -format json -tags "$GO_AUDIT_TAGS" "$GO_PACKAGE" || true
            CGO_ENABLED=0 GOFLAGS=-mod=readonly govulncheck -format json -tags "$GO_AUDIT_TAGS" "$SHIM_PACKAGE" || true
          } >"$report"
          # Both runs must have analyzed something: a load error leaves no SBOM message.
          [[ $(jq -s '[.[] | select(has("SBOM"))] | length' "$report") == 2 ]] ||
            { echo "govulncheck did not analyze both packages"; exit 1; }
          [[ -s $report ]] || { echo "govulncheck produced no report"; exit 1; }
          # A finding whose first trace frame names a function is REACHABLE
          # from called code; module-only findings are informational.
          jq -rs '[.[] | select(has("finding")) | .finding
                   | select(.trace[0].function != null) | .osv]
                  | unique | .[]' "$report" | sed '/^$/d' | sort -u >"$RUNNER_TEMP/found"
          grep -Ev '^[[:space:]]*(#|$)' ../fork/bashy-build/vuln-ignore |
            awk '{print $1}' | sort -u >"$RUNNER_TEMP/waived" || true
          if comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | grep -q .; then
            echo "govulncheck: unwaived vulnerabilities reachable from called code:"
            comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | sed 's/^/  /'
            exit 1
          fi
          echo "govulncheck: no unwaived reachable vulnerability ($(wc -l <"$RUNNER_TEMP/found") reachable, all waived or none)"
      - name: SBOM (CycloneDX, the bashy build configuration)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          sbom=../out/$TOOL-$UPSTREAM_TAG.cdx.json
          # The k3s main package's module graph, from vendor/ as built (so the
          # compiled-out modules are absent); the shim's module
          # (github.com/k3s-io/containerd/v2) is a component of it.
          CGO_ENABLED=0 GOFLAGS="-tags=$GO_AUDIT_TAGS -mod=vendor" \
            cyclonedx-gomod app -json -licenses -main "$GO_PACKAGE" -output "$sbom" .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" >/dev/null
