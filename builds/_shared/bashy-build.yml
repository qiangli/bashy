#@@IFEQ SOURCE_ADMISSION prima-first-party@@
# bashy verified build of @@TOOL@@ (first-party MIT source, pinned).
#@@ELSE@@
# bashy verified build of @@TOOL@@ (official upstream release, pinned).
#@@END@@
#
# GENERATED by bashy builds/render.sh from builds/@@TOOL@@/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/@@FORK_REPO@@ from
# bashy's builds/@@TOOL@@/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-@@UPSTREAM_TAG@@-1) at that branch.
# Upstream tags this release @@UPSTREAM_TAG_FORM@@, so the trigger is
# @@BASHY_TAG_GLOB@@ and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/@@FORK_REPO@@/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "@@BASHY_TAG_GLOB@@"

permissions: {}

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == '@@FORK_REPO@@'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='@@UPSTREAM_TAG_REGEX@@'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not @@UPSTREAM_TAG_FORM@@)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
#@@IFEQ SOURCE_ADMISSION official-release@@
          # The upstream release must exist and be neither draft nor pre-release.
          # UPSTREAM_API_BASE is https://api.github.com for a GitHub upstream and
          # the forge's own REST root otherwise; gitea answers the identical
          # /repos/SLUG/releases/tags/TAG shape, with the same .draft/.prerelease.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "@@UPSTREAM_API_BASE@@/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
#@@ELSE@@
          # Operator S436/#2029: first-party MIT source, not an upstream mirror.
          [[ $UPSTREAM_SLUG == qiangli/prima.cpp ]]
#@@END@@
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
@@MATRIX@@
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
#@@IFEQ UPSTREAM_FORGE github@@
#@@IFEQ SOURCE_ADMISSION prima-first-party@@
      - name: checkout reviewed first-party source tag
#@@ELSE@@
      - name: checkout official upstream release tag
#@@END@@
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: @@UPSTREAM_SLUG@@
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
#@@ELSE@@
      - name: clone official upstream release tag (@@UPSTREAM_REPO@@)
        env:
          UPSTREAM_TAG_REF: ${{ needs.pin.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # Upstream is not on GitHub, so there is no actions/checkout for it:
          # clone the official tag straight from UPSTREAM_REPO (no credentials
          # are configured for it, so this is an anonymous read). The pin gate
          # in the next step is the SAME one every tool runs — HEAD and the tag
          # must both be UPSTREAM_COMMIT over a pristine tree — so a second
          # forge buys no weaker provenance than actions/checkout does.
          git -c advice.detachedHead=false clone --depth 1 --single-branch \
            --branch "$UPSTREAM_TAG_REF" "$UPSTREAM_REPO" src
          echo "cloned $UPSTREAM_REPO at $UPSTREAM_TAG_REF -> $(git -C src rev-parse HEAD)"
#@@END@@
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends @@APT_PACKAGES@@
@@INCLUDE setup@@
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
@@INCLUDE build@@
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "@@EGRESS_TARGET@@"
@@INCLUDE egress-evidence@@

      - name: upload unsigned build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3
#@@IF audit@@

  audit:
    name: audit + SBOM
#@@IFEQ KIND cmake@@
    needs: [pin, build]
#@@ELSE@@
    needs: pin
#@@END@@
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
#@@IFEQ UPSTREAM_FORGE github@@
#@@IFEQ SOURCE_ADMISSION prima-first-party@@
      - name: checkout reviewed first-party source tag
#@@ELSE@@
      - name: checkout official upstream release tag
#@@END@@
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: @@UPSTREAM_SLUG@@
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
#@@ELSE@@
      - name: clone official upstream release tag (@@UPSTREAM_REPO@@)
        env:
          UPSTREAM_TAG_REF: ${{ needs.pin.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # Upstream is not on GitHub, so there is no actions/checkout for it:
          # clone the official tag straight from UPSTREAM_REPO (no credentials
          # are configured for it, so this is an anonymous read). The pin gate
          # in the next step is the SAME one every tool runs — HEAD and the tag
          # must both be UPSTREAM_COMMIT over a pristine tree — so a second
          # forge buys no weaker provenance than actions/checkout does.
          git -c advice.detachedHead=false clone --depth 1 --single-branch \
            --branch "$UPSTREAM_TAG_REF" "$UPSTREAM_REPO" src
          echo "cloned $UPSTREAM_REPO at $UPSTREAM_TAG_REF -> $(git -C src rev-parse HEAD)"
#@@END@@
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
@@INCLUDE audit@@
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3
#@@END@@

  release:
    name: sign, attest, publish
#@@IF audit@@
    needs: [pin, build, audit]
#@@ELSE@@
    needs: [pin, build]
#@@END@@
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == @@COSIGN_VERSION@@ ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: @@COSIGN_VERSION@@
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
#@@IFEQ SOURCE_ADMISSION prima-first-party@@
            echo "bashy verified build of first-party $TOOL $UPSTREAM_TAG"
#@@ELSE@@
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
#@@END@@
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
