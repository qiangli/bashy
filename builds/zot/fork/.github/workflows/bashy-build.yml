# bashy verified build of zot (official upstream release, pinned).
#
# GENERATED by bashy builds/render.sh from builds/zot/tool.env and the
# shared skeleton builds/_shared/bashy-build.yml — edit those, not this file.
# Installed on the `bashy-build` branch of github.com/qiangli/zot from
# bashy's builds/zot/fork/. Triggered ONLY by pushing a tag
# bashy-<upstream tag>-N (e.g. bashy-v2.1.22-1) at that branch.
# Upstream tags this release vX.Y.Z, so the trigger is
# bashy-v* and the pin job holds the tag to exactly that shape.
#
# Pipeline (fail-closed): pin (provenance) -> build matrix (tool gates, build,
# no-egress gate) + audit/SBOM -> release (cosign keyless sign-blob --bundle
# per asset, self-verify against the exact identity, actions/attest, GitHub
# release). Nothing is signed unless every gate passed.
#
# binmgr identity of a release cut from tag T:
#   https://github.com/qiangli/zot/.github/workflows/bashy-build.yml@refs/tags/T
#   issuer https://token.actions.githubusercontent.com
#
# Every action is pinned by commit sha (tag in the trailing comment).
name: bashy-build

on:
  push:
    tags:
      - "bashy-v*"

permissions: {}

# Windows' default is PowerShell; the native build and gate scripts need Git Bash.
# (TOOL ollama keeps its own block above; this one serves tools that declare
# WINDOWS_SHELL=bash instead. A tool matching both would render duplicate keys,
# so declare at most one of the two.)
defaults:
  run:
    shell: bash

concurrency:
  group: bashy-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Build-time: keep cargo/rustup from phoning anything but the registries.
  CARGO_NET_RETRY: "3"

jobs:
  pin:
    name: verify pin
    if: github.repository == 'qiangli/zot'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      upstream_tag: ${{ steps.pin.outputs.upstream_tag }}
      upstream_commit: ${{ steps.pin.outputs.upstream_commit }}
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: read PIN and refuse non-release tags
        id: pin
        env:
          BASHY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declared release-tag form (tool.env UPSTREAM_TAG_FORM). The
          # regex comes from builds/render.sh, the ONE place that maps a form
          # to its shape, so this job and verify-pin.sh cannot drift apart.
          upstream_tag_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ $UPSTREAM_TAG =~ $upstream_tag_re ]] || { echo "refusing non-release upstream tag $UPSTREAM_TAG (not vX.Y.Z)"; exit 1; }
          # bashy-<the pinned upstream tag>-N, whatever shape that tag has.
          [[ $BASHY_TAG =~ ^bashy-(.+)-[1-9][0-9]*$ && ${BASH_REMATCH[1]} == "$UPSTREAM_TAG" ]] ||
            { echo "tag $BASHY_TAG must be bashy-$UPSTREAM_TAG-N"; exit 1; }
          # The upstream release must exist and be neither draft nor pre-release.
          # UPSTREAM_API_BASE is https://api.github.com for a GitHub upstream and
          # the forge's own REST root otherwise; gitea answers the identical
          # /repos/SLUG/releases/tags/TAG shape, with the same .draft/.prerelease.
          rel=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$UPSTREAM_SLUG/releases/tags/$UPSTREAM_TAG")
          [[ $(jq -r '.prerelease' <<<"$rel") == false && $(jq -r '.draft' <<<"$rel") == false ]] ||
            { echo "upstream $UPSTREAM_TAG is a draft or pre-release"; exit 1; }
          echo "upstream_tag=$UPSTREAM_TAG" >>"$GITHUB_OUTPUT"
          echo "upstream_commit=$UPSTREAM_COMMIT" >>"$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.asset }}
    needs: pin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: zot-linux-amd64
            runner: ubuntu-24.04
          - asset: zot-linux-arm64
            runner: ubuntu-24.04-arm
          - asset: zot-darwin-arm64
            runner: macos-15
          - asset: zot-darwin-amd64
            runner: macos-15-intel
          - asset: zot-windows-amd64.exe
            runner: windows-2025
    steps:
      # Windows runners check out with core.autocrlf=true by default, which
      # rewrites LF to CRLF in the working tree. The prepare/audit gates hash
      # exact source bytes (e.g. src/LICENSE), so the conversion breaks the
      # pin on Windows while linux/darwin stay green. Disable it globally
      # BEFORE either checkout below, so both the fork scripts and the pinned
      # source land byte-identical on every OS. The hash checks themselves are
      # unchanged. No-op on non-Windows runners.
      - name: disable line-ending conversion (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-zot/zot
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      - name: host build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends strace util-linux iproute2 curl
      - name: pinned Go toolchain (from the upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: false
          cache: false
      - name: pin the exact toolchain (PIN GO_TOOLCHAIN == upstream go.mod)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declaration must name what the upstream release builds with:
          # go.mod's `toolchain` line when it has one, else its `go` line. A
          # pin bump that forgets GO_TOOLCHAIN fails here instead of silently
          # building on whatever the runner image happens to ship.
          want=$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          if [[ -z $want ]]; then
            want=$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          fi
          [[ -n $want ]] || { echo "src/go.mod declares no go/toolchain version"; exit 1; }
          [[ $want == "$GO_TOOLCHAIN" ]] ||
            { echo "PIN GO_TOOLCHAIN $GO_TOOLCHAIN != upstream go.mod $want"; exit 1; }
          # governum: a Go MAJOR.MINOR[.PATCH] as ONE comparable integer, so a
          # minor move orders correctly against a patch move (go1.26.9 is newer
          # than go1.25.11, which string order gets backwards). Both callers
          # below regex-validate their argument first, so it cannot fail here.
          governum() {
            [[ ${1#go} =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]] || return 1
            printf '%d%03d%03d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[4]:-0}"
          }
          # GO_TOOLCHAIN_SECURITY_OVERRIDE: the ONE sanctioned reason to build
          # on something other than the tag's own toolchain — the tag names a
          # release that predates a Go stdlib security fix, and no upstream tag
          # carrying a fixed toolchain exists yet. It is shipped in PIN, so the
          # release asset records exactly what built the binary; the review
          # decision is justified in the comment above the key in tool.env.
          # Reachable vulnerabilities are never waived (see bashy-build/vuln-ignore).
          #
          # Exactly two shapes are allowed:
          #
          #   in-minor patch bump — the ordinary case. A strictly later patch
          #   of the tag's own minor, so the language version never moves.
          #
          #   EOL-minor security override — the tag's minor is no longer
          #   supported (1.26 1.27, written down once in
          #   builds/render.sh: Go fixes only its two newest minors, so go1.27
          #   shipping retired 1.25). An unsupported minor gets NO security
          #   fixes at all, so there is no later patch to move to and staying
          #   put cannot be made safe — kopia v0.23.1 builds with go1.25.11.
          #   The move is then to the OLDEST supported minor's latest patch:
          #   the smallest language-version jump that gets fixes again.
          #
          # Refused either way: a downgrade or a no-op, and a minor jump while
          # the tag's own minor IS still supported — there a later patch
          # exists, and the patch bump is the whole of what review sanctioned.
          effective=$GO_TOOLCHAIN
          if [[ -n ${GO_TOOLCHAIN_SECURITY_OVERRIDE:-} ]]; then
            [[ $GO_TOOLCHAIN =~ ^([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]] ||
              { echo "PIN GO_TOOLCHAIN $GO_TOOLCHAIN is not MAJOR.MINOR[.PATCH]"; exit 1; }
            tag_minor=${BASH_REMATCH[1]}
            [[ $GO_TOOLCHAIN_SECURITY_OVERRIDE =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]] ||
              { echo "PIN GO_TOOLCHAIN_SECURITY_OVERRIDE $GO_TOOLCHAIN_SECURITY_OVERRIDE is not MAJOR.MINOR.PATCH"; exit 1; }
            override_minor=${BASH_REMATCH[1]}
            (($(governum "$GO_TOOLCHAIN_SECURITY_OVERRIDE") > $(governum "$GO_TOOLCHAIN"))) ||
              { echo "security override $GO_TOOLCHAIN_SECURITY_OVERRIDE is not later than the tag's go$GO_TOOLCHAIN"; exit 1; }
            label="security override"
            if [[ $override_minor != "$tag_minor" ]]; then
              # Supported minors, OLDEST FIRST (builds/render.sh).
              supported='1.26 1.27'
              for minor in $supported; do
                if [[ $minor == "$tag_minor" ]]; then
                  echo "go$tag_minor is still a supported minor: the override must be a later patch of go$tag_minor, not a jump to go$override_minor"
                  exit 1
                fi
              done
              [[ $override_minor == "${supported%% *}" ]] ||
                { echo "EOL-minor override $GO_TOOLCHAIN_SECURITY_OVERRIDE must move to the OLDEST supported minor go${supported%% *}, not go$override_minor"; exit 1; }
              label="EOL-minor security override"
            fi
            effective=$GO_TOOLCHAIN_SECURITY_OVERRIDE
            echo "recorded $label: building with go$effective, not the tag's go$GO_TOOLCHAIN"
          fi
          # GOTOOLCHAIN makes every `go` command use exactly that release, no
          # matter what setup-go resolved, so the build is toolchain-exact. It
          # is also how the step below, and the audit job's own steps, learn
          # the effective version without recomputing it.
          echo "GOTOOLCHAIN=go$effective" >>"$GITHUB_ENV"
          GOTOOLCHAIN="go$effective" go version
      - name: GO_SECURITY_OVERRIDES (reviewed module bumps, gated go.mod diff)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The MODULE half of a recorded security override; the toolchain half
          # is GO_TOOLCHAIN_SECURITY_OVERRIDE in the step above. The same gap
          # exists one level down: an upstream tag can require a DEPENDENCY
          # that predates a security fix, with no later upstream tag carrying
          # the bump. Reachable vulnerabilities are never waived (vuln-ignore
          # is only for unreachable ones), and editing the pinned sources is
          # not an option, so the declaration may name the exact modules to
          # raise and nothing else:
          #
          #   GO_SECURITY_OVERRIDES="golang.org/x/net@v0.60.0 ..."
          #
          # Empty or absent is a no-op, which is what every tool that needs no
          # override gets. It is shipped in PIN (and so in the <tool>-pin.txt
          # release asset), this step logs it, and the declaration's
          # RELEASE_GATES names it in the release notes. Each entry retires
          # itself the moment an upstream tag carries the fix.
          #
          # What makes this safe is the gate below, not `go get` itself:
          # `go get` may change ONLY the require lines of EXACTLY the declared
          # modules, plus the go/toolchain directives within the bounds the
          # effective toolchain already sets (see the directive gate below).
          # Any other go.mod edit fails the build — a new or removed require,
          # a replace/exclude/retract edit, or an undeclared module moved as a
          # transitive effect (if one is genuinely needed, declare it too, so
          # it is reviewed). go.sum is deliberately NOT gated: `go get` has to
          # add the new hashes. There is no `go mod tidy` — tidy rewrites the
          # whole graph, which this gate could not tell apart from a
          # supply-chain substitution.
          #
          # This step runs in both the build and the audit job, after the same
          # verify-pin.sh, so the SAME overridden tree is what govulncheck
          # judges and what the shipped binary is compiled from.
          if [[ -z ${GO_SECURITY_OVERRIDES:-} ]]; then
            echo "GO_SECURITY_OVERRIDES: none declared (no-op)"
            exit 0
          fi
          # The gated view of go.mod: everything except go.sum. `go mod edit
          # -json` is used rather than a textual diff so a reformat, a comment
          # or a moved require block cannot hide a real change.
          gated() {
            go mod edit -json "$1" | jq -r '
              "module\t" + (.Module.Path // ""),
              "go\t" + (.Go // ""),
              "toolchain\t" + (.Toolchain // ""),
              (.Require // [] | sort_by(.Path) | .[] |
                 "require\t" + .Path + "\t" + .Version + "\t" + ((.Indirect // false) | tostring)),
              (.Exclude // [] | .[] | "exclude\t" + .Path + "\t" + .Version),
              (.Replace // [] | .[] |
                 "replace\t" + .Old.Path + "\t" + (.Old.Version // "") + "\t" + .New.Path + "\t" + (.New.Version // "")),
              (.Retract // [] | .[] | "retract\t" + (.Low // "") + "\t" + (.High // ""))'
          }
          gated src/go.mod >"$RUNNER_TEMP/gomod.before"
          : >"$RUNNER_TEMP/gomod.allowed"
          for spec in $GO_SECURITY_OVERRIDES; do
            [[ $spec == *@v* ]] || { echo "GO_SECURITY_OVERRIDES entry $spec is not module@vVERSION"; exit 1; }
            echo "${spec%@*}" >>"$RUNNER_TEMP/gomod.allowed"
            echo "security override: go get $spec"
            (cd src && go get "$spec")
          done
          sort -u -o "$RUNNER_TEMP/gomod.allowed" "$RUNNER_TEMP/gomod.allowed"
          gated src/go.mod >"$RUNNER_TEMP/gomod.after"
          # --- the go/toolchain directive gate (BEGIN) -------------------------
          # kinds/go/toolchain-gate-test.sh extracts everything between this
          # marker and the matching END one and drives it against synthetic
          # go.mod views, so keep both markers on their own lines.
          # A dependency that carries a security fix can itself require a newer
          # LANGUAGE version: golang.org/x/net v0.60.0 and golang.org/x/crypto
          # v0.56.0 both declare `go 1.26.0`, so taking either fix into a module
          # whose own `go` line is older forces `go get` to raise that line. The
          # fix is unreachable otherwise, so the directive may rise — but never
          # past the toolchain this build actually runs, which the step above
          # already gated. That cap is what keeps the allowance honest: under an
          # in-minor patch override it confines the language version to the tag's
          # own minor, and under an EOL-minor override it permits exactly the move
          # that override already sanctioned, and nothing beyond it. A directive
          # that drops, or one above the effective toolchain, stays refused.
          #
          # The `toolchain` line may only be dropped or lowered: GOTOOLCHAIN in
          # the environment is what actually selects the release, so a lower or
          # absent line changes nothing, while a higher one would be a build on
          # something other than the gated toolchain.
          [[ ${GOTOOLCHAIN:-} == go* ]] ||
            { echo "GOTOOLCHAIN is unset: the toolchain step must run before this one"; exit 1; }
          effective=${GOTOOLCHAIN#go}
          governum() { # a Go version (bare or go-prefixed) as one comparable integer
            [[ ${1#go} =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]] || return 1
            printf '%d%03d%03d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[4]:-0}"
          }
          # Unlike the step above, these compare values read out of go.mod, so a
          # version this gate cannot parse must make the comparison FALSE rather
          # than abort mid-expression: both wrappers fail closed into "refused".
          govlt() { local a b; a=$(governum "$1") && b=$(governum "$2") && ((a < b)); }
          govle() { local a b; a=$(governum "$1") && b=$(governum "$2") && ((a <= b)); }
          directive() { awk -F'\t' -v key="$1" '$1 == key {print $2}' "$2"; }
          go_before=$(directive go "$RUNNER_TEMP/gomod.before")
          go_after=$(directive go "$RUNNER_TEMP/gomod.after")
          tc_before=$(directive toolchain "$RUNNER_TEMP/gomod.before")
          tc_after=$(directive toolchain "$RUNNER_TEMP/gomod.after")
          directives_ok=1
          if [[ $go_after != "$go_before" ]]; then
            if govlt "$go_before" "$go_after" && govle "$go_after" "$effective"; then
              echo "go directive raised: ${go_before:-(none)} -> ${go_after:-(none)} (at or below the effective go$effective)"
            else
              echo "refused go directive change: ${go_before:-(none)} -> ${go_after:-(none)} (must rise, and not past the effective go$effective)"
              directives_ok=0
            fi
          fi
          if [[ $tc_after != "$tc_before" ]]; then
            if [[ -z $tc_after ]] || govle "$tc_after" "$effective"; then
              echo "toolchain directive changed: ${tc_before:-(none)} -> ${tc_after:-(none)} (GOTOOLCHAIN=go$effective still selects the release)"
            else
              echo "refused toolchain directive change: ${tc_before:-(none)} -> ${tc_after:-(none)} (above the effective go$effective)"
              directives_ok=0
            fi
          fi
          # --- the go/toolchain directive gate (END) ---------------------------
          # `diff` exits 1 when the files differ, which is the expected case
          # here, so its status is absorbed rather than tripping pipefail.
          { diff "$RUNNER_TEMP/gomod.before" "$RUNNER_TEMP/gomod.after" || true; } |
            grep -E '^[<>] ' >"$RUNNER_TEMP/gomod.diff" || true
          if [[ ! -s $RUNNER_TEMP/gomod.diff ]]; then
            # Not a failure: an upstream bump has caught up with the override,
            # which is exactly when it should be retired from tool.env.
            echo "GO_SECURITY_OVERRIDES: already satisfied by the pinned go.mod — retire the override"
            exit 0
          fi
          # Every line that differs, in either direction, must be a require
          # line of a declared module, or a go/toolchain directive the gate
          # above accepted.
          refused=0
          while IFS=$'\t' read -r field path _; do
            [[ -n $field ]] || continue
            skip=0
            case $field in
            require) if grep -qxF "$path" "$RUNNER_TEMP/gomod.allowed"; then skip=1; fi ;;
            go | toolchain) skip=$directives_ok ;;
            esac
            if ((skip)); then continue; fi
            echo "  refused go.mod change: $field ${path:-(empty)}"
            refused=1
          done < <(sed 's/^[<>] //' "$RUNNER_TEMP/gomod.diff")
          ((refused == 0)) ||
            { echo "GO_SECURITY_OVERRIDES: go.mod changed outside the require lines of $GO_SECURITY_OVERRIDES"; exit 1; }
          echo "GO_SECURITY_OVERRIDES: applied; go.mod changed only in the declared require lines:"
          sed 's/^/  /' "$RUNNER_TEMP/gomod.diff"
      - name: pre-build gates (PRE_BUILD_GATES)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          for gate in $PRE_BUILD_GATES; do "fork/bashy-build/$gate" src; done
      - name: go build (upstream CGO/tags, -trimpath, reproducible ldflags)
        working-directory: src
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          # GO_CGO declares, per matrix asset, what the UPSTREAM release does
          # (several projects enable cgo on linux and disable it elsewhere).
          cgo=
          for pair in $GO_CGO; do
            [[ ${pair%%=*} == "$ASSET" ]] || continue
            cgo=${pair#*=}
          done
          case $cgo in
          0 | 1) ;;
          *) echo "PIN GO_CGO has no 0/1 entry for $ASSET"; exit 1 ;;
          esac
          tags=()
          [[ -z ${GO_BUILD_TAGS:-} ]] || tags=(-tags "$GO_BUILD_TAGS")
          flags=()
          if [[ -n ${GO_BUILD_FLAGS:-} ]]; then read -r -a flags <<<"$GO_BUILD_FLAGS"; fi
          envs=(CGO_ENABLED="$cgo")
          if [[ -n ${GO_BUILD_ENV:-} ]]; then
            read -r -a build_env <<<"$GO_BUILD_ENV"
            envs+=("${build_env[@]}")
          fi
          # Native Windows assets must keep .exe through every release step.
          if [[ $(go env GOOS) == windows && $ASSET != *.exe ]]; then
            echo "Windows MATRIX asset must end in .exe: $ASSET"; exit 1
          fi
          mkdir -p ../out
          # -trimpath and -buildid= drop the build path and the action id, and
          # GO_LDFLAGS stamps only PIN-derived values (no build date, no `git
          # describe`), so re-running the same bashy tag rebuilds the same bytes.
          env "${envs[@]}" go build -trimpath \
            ${tags[@]+"${tags[@]}"} ${flags[@]+"${flags[@]}"} \
            -ldflags "-s -w -buildid= $GO_LDFLAGS" \
            -o "../out/$ASSET" "$GO_PACKAGE"
          # Smoke the artifact: a binary that cannot report its own version is
          # not a release candidate.
          "../out/$ASSET" "$GO_VERSION_ARG"
      - name: no-egress gate (before signing)
        run: fork/bashy-build/no-egress-test.sh "out/${{ matrix.asset }}"

      - name: upload unsigned build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  audit:
    name: audit + SBOM
    needs: pin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: checkout official upstream release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: project-zot/zot
          ref: refs/tags/${{ needs.pin.outputs.upstream_tag }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: src
      - name: verify HEAD == pinned commit
        run: fork/bashy-build/verify-pin.sh src "$GITHUB_REF_NAME"
      # The audit job judges the SAME tree the build job compiles, so it
      # reuses the build job's setup verbatim rather than keeping a second
      # copy: the pinned toolchain, the recorded toolchain override and the
      # reviewed module overrides are ONE fragment, and cannot drift apart.
      - name: pinned Go toolchain (from the upstream go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          check-latest: false
          cache: false
      - name: pin the exact toolchain (PIN GO_TOOLCHAIN == upstream go.mod)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The declaration must name what the upstream release builds with:
          # go.mod's `toolchain` line when it has one, else its `go` line. A
          # pin bump that forgets GO_TOOLCHAIN fails here instead of silently
          # building on whatever the runner image happens to ship.
          want=$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          if [[ -z $want ]]; then
            want=$(sed -n 's/^go \([0-9][0-9.]*\)[[:space:]]*$/\1/p' src/go.mod | head -n1)
          fi
          [[ -n $want ]] || { echo "src/go.mod declares no go/toolchain version"; exit 1; }
          [[ $want == "$GO_TOOLCHAIN" ]] ||
            { echo "PIN GO_TOOLCHAIN $GO_TOOLCHAIN != upstream go.mod $want"; exit 1; }
          # governum: a Go MAJOR.MINOR[.PATCH] as ONE comparable integer, so a
          # minor move orders correctly against a patch move (go1.26.9 is newer
          # than go1.25.11, which string order gets backwards). Both callers
          # below regex-validate their argument first, so it cannot fail here.
          governum() {
            [[ ${1#go} =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]] || return 1
            printf '%d%03d%03d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[4]:-0}"
          }
          # GO_TOOLCHAIN_SECURITY_OVERRIDE: the ONE sanctioned reason to build
          # on something other than the tag's own toolchain — the tag names a
          # release that predates a Go stdlib security fix, and no upstream tag
          # carrying a fixed toolchain exists yet. It is shipped in PIN, so the
          # release asset records exactly what built the binary; the review
          # decision is justified in the comment above the key in tool.env.
          # Reachable vulnerabilities are never waived (see bashy-build/vuln-ignore).
          #
          # Exactly two shapes are allowed:
          #
          #   in-minor patch bump — the ordinary case. A strictly later patch
          #   of the tag's own minor, so the language version never moves.
          #
          #   EOL-minor security override — the tag's minor is no longer
          #   supported (1.26 1.27, written down once in
          #   builds/render.sh: Go fixes only its two newest minors, so go1.27
          #   shipping retired 1.25). An unsupported minor gets NO security
          #   fixes at all, so there is no later patch to move to and staying
          #   put cannot be made safe — kopia v0.23.1 builds with go1.25.11.
          #   The move is then to the OLDEST supported minor's latest patch:
          #   the smallest language-version jump that gets fixes again.
          #
          # Refused either way: a downgrade or a no-op, and a minor jump while
          # the tag's own minor IS still supported — there a later patch
          # exists, and the patch bump is the whole of what review sanctioned.
          effective=$GO_TOOLCHAIN
          if [[ -n ${GO_TOOLCHAIN_SECURITY_OVERRIDE:-} ]]; then
            [[ $GO_TOOLCHAIN =~ ^([0-9]+\.[0-9]+)(\.[0-9]+)?$ ]] ||
              { echo "PIN GO_TOOLCHAIN $GO_TOOLCHAIN is not MAJOR.MINOR[.PATCH]"; exit 1; }
            tag_minor=${BASH_REMATCH[1]}
            [[ $GO_TOOLCHAIN_SECURITY_OVERRIDE =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]] ||
              { echo "PIN GO_TOOLCHAIN_SECURITY_OVERRIDE $GO_TOOLCHAIN_SECURITY_OVERRIDE is not MAJOR.MINOR.PATCH"; exit 1; }
            override_minor=${BASH_REMATCH[1]}
            (($(governum "$GO_TOOLCHAIN_SECURITY_OVERRIDE") > $(governum "$GO_TOOLCHAIN"))) ||
              { echo "security override $GO_TOOLCHAIN_SECURITY_OVERRIDE is not later than the tag's go$GO_TOOLCHAIN"; exit 1; }
            label="security override"
            if [[ $override_minor != "$tag_minor" ]]; then
              # Supported minors, OLDEST FIRST (builds/render.sh).
              supported='1.26 1.27'
              for minor in $supported; do
                if [[ $minor == "$tag_minor" ]]; then
                  echo "go$tag_minor is still a supported minor: the override must be a later patch of go$tag_minor, not a jump to go$override_minor"
                  exit 1
                fi
              done
              [[ $override_minor == "${supported%% *}" ]] ||
                { echo "EOL-minor override $GO_TOOLCHAIN_SECURITY_OVERRIDE must move to the OLDEST supported minor go${supported%% *}, not go$override_minor"; exit 1; }
              label="EOL-minor security override"
            fi
            effective=$GO_TOOLCHAIN_SECURITY_OVERRIDE
            echo "recorded $label: building with go$effective, not the tag's go$GO_TOOLCHAIN"
          fi
          # GOTOOLCHAIN makes every `go` command use exactly that release, no
          # matter what setup-go resolved, so the build is toolchain-exact. It
          # is also how the step below, and the audit job's own steps, learn
          # the effective version without recomputing it.
          echo "GOTOOLCHAIN=go$effective" >>"$GITHUB_ENV"
          GOTOOLCHAIN="go$effective" go version
      - name: GO_SECURITY_OVERRIDES (reviewed module bumps, gated go.mod diff)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The MODULE half of a recorded security override; the toolchain half
          # is GO_TOOLCHAIN_SECURITY_OVERRIDE in the step above. The same gap
          # exists one level down: an upstream tag can require a DEPENDENCY
          # that predates a security fix, with no later upstream tag carrying
          # the bump. Reachable vulnerabilities are never waived (vuln-ignore
          # is only for unreachable ones), and editing the pinned sources is
          # not an option, so the declaration may name the exact modules to
          # raise and nothing else:
          #
          #   GO_SECURITY_OVERRIDES="golang.org/x/net@v0.60.0 ..."
          #
          # Empty or absent is a no-op, which is what every tool that needs no
          # override gets. It is shipped in PIN (and so in the <tool>-pin.txt
          # release asset), this step logs it, and the declaration's
          # RELEASE_GATES names it in the release notes. Each entry retires
          # itself the moment an upstream tag carries the fix.
          #
          # What makes this safe is the gate below, not `go get` itself:
          # `go get` may change ONLY the require lines of EXACTLY the declared
          # modules, plus the go/toolchain directives within the bounds the
          # effective toolchain already sets (see the directive gate below).
          # Any other go.mod edit fails the build — a new or removed require,
          # a replace/exclude/retract edit, or an undeclared module moved as a
          # transitive effect (if one is genuinely needed, declare it too, so
          # it is reviewed). go.sum is deliberately NOT gated: `go get` has to
          # add the new hashes. There is no `go mod tidy` — tidy rewrites the
          # whole graph, which this gate could not tell apart from a
          # supply-chain substitution.
          #
          # This step runs in both the build and the audit job, after the same
          # verify-pin.sh, so the SAME overridden tree is what govulncheck
          # judges and what the shipped binary is compiled from.
          if [[ -z ${GO_SECURITY_OVERRIDES:-} ]]; then
            echo "GO_SECURITY_OVERRIDES: none declared (no-op)"
            exit 0
          fi
          # The gated view of go.mod: everything except go.sum. `go mod edit
          # -json` is used rather than a textual diff so a reformat, a comment
          # or a moved require block cannot hide a real change.
          gated() {
            go mod edit -json "$1" | jq -r '
              "module\t" + (.Module.Path // ""),
              "go\t" + (.Go // ""),
              "toolchain\t" + (.Toolchain // ""),
              (.Require // [] | sort_by(.Path) | .[] |
                 "require\t" + .Path + "\t" + .Version + "\t" + ((.Indirect // false) | tostring)),
              (.Exclude // [] | .[] | "exclude\t" + .Path + "\t" + .Version),
              (.Replace // [] | .[] |
                 "replace\t" + .Old.Path + "\t" + (.Old.Version // "") + "\t" + .New.Path + "\t" + (.New.Version // "")),
              (.Retract // [] | .[] | "retract\t" + (.Low // "") + "\t" + (.High // ""))'
          }
          gated src/go.mod >"$RUNNER_TEMP/gomod.before"
          : >"$RUNNER_TEMP/gomod.allowed"
          for spec in $GO_SECURITY_OVERRIDES; do
            [[ $spec == *@v* ]] || { echo "GO_SECURITY_OVERRIDES entry $spec is not module@vVERSION"; exit 1; }
            echo "${spec%@*}" >>"$RUNNER_TEMP/gomod.allowed"
            echo "security override: go get $spec"
            (cd src && go get "$spec")
          done
          sort -u -o "$RUNNER_TEMP/gomod.allowed" "$RUNNER_TEMP/gomod.allowed"
          gated src/go.mod >"$RUNNER_TEMP/gomod.after"
          # --- the go/toolchain directive gate (BEGIN) -------------------------
          # kinds/go/toolchain-gate-test.sh extracts everything between this
          # marker and the matching END one and drives it against synthetic
          # go.mod views, so keep both markers on their own lines.
          # A dependency that carries a security fix can itself require a newer
          # LANGUAGE version: golang.org/x/net v0.60.0 and golang.org/x/crypto
          # v0.56.0 both declare `go 1.26.0`, so taking either fix into a module
          # whose own `go` line is older forces `go get` to raise that line. The
          # fix is unreachable otherwise, so the directive may rise — but never
          # past the toolchain this build actually runs, which the step above
          # already gated. That cap is what keeps the allowance honest: under an
          # in-minor patch override it confines the language version to the tag's
          # own minor, and under an EOL-minor override it permits exactly the move
          # that override already sanctioned, and nothing beyond it. A directive
          # that drops, or one above the effective toolchain, stays refused.
          #
          # The `toolchain` line may only be dropped or lowered: GOTOOLCHAIN in
          # the environment is what actually selects the release, so a lower or
          # absent line changes nothing, while a higher one would be a build on
          # something other than the gated toolchain.
          [[ ${GOTOOLCHAIN:-} == go* ]] ||
            { echo "GOTOOLCHAIN is unset: the toolchain step must run before this one"; exit 1; }
          effective=${GOTOOLCHAIN#go}
          governum() { # a Go version (bare or go-prefixed) as one comparable integer
            [[ ${1#go} =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]] || return 1
            printf '%d%03d%03d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[4]:-0}"
          }
          # Unlike the step above, these compare values read out of go.mod, so a
          # version this gate cannot parse must make the comparison FALSE rather
          # than abort mid-expression: both wrappers fail closed into "refused".
          govlt() { local a b; a=$(governum "$1") && b=$(governum "$2") && ((a < b)); }
          govle() { local a b; a=$(governum "$1") && b=$(governum "$2") && ((a <= b)); }
          directive() { awk -F'\t' -v key="$1" '$1 == key {print $2}' "$2"; }
          go_before=$(directive go "$RUNNER_TEMP/gomod.before")
          go_after=$(directive go "$RUNNER_TEMP/gomod.after")
          tc_before=$(directive toolchain "$RUNNER_TEMP/gomod.before")
          tc_after=$(directive toolchain "$RUNNER_TEMP/gomod.after")
          directives_ok=1
          if [[ $go_after != "$go_before" ]]; then
            if govlt "$go_before" "$go_after" && govle "$go_after" "$effective"; then
              echo "go directive raised: ${go_before:-(none)} -> ${go_after:-(none)} (at or below the effective go$effective)"
            else
              echo "refused go directive change: ${go_before:-(none)} -> ${go_after:-(none)} (must rise, and not past the effective go$effective)"
              directives_ok=0
            fi
          fi
          if [[ $tc_after != "$tc_before" ]]; then
            if [[ -z $tc_after ]] || govle "$tc_after" "$effective"; then
              echo "toolchain directive changed: ${tc_before:-(none)} -> ${tc_after:-(none)} (GOTOOLCHAIN=go$effective still selects the release)"
            else
              echo "refused toolchain directive change: ${tc_before:-(none)} -> ${tc_after:-(none)} (above the effective go$effective)"
              directives_ok=0
            fi
          fi
          # --- the go/toolchain directive gate (END) ---------------------------
          # `diff` exits 1 when the files differ, which is the expected case
          # here, so its status is absorbed rather than tripping pipefail.
          { diff "$RUNNER_TEMP/gomod.before" "$RUNNER_TEMP/gomod.after" || true; } |
            grep -E '^[<>] ' >"$RUNNER_TEMP/gomod.diff" || true
          if [[ ! -s $RUNNER_TEMP/gomod.diff ]]; then
            # Not a failure: an upstream bump has caught up with the override,
            # which is exactly when it should be retired from tool.env.
            echo "GO_SECURITY_OVERRIDES: already satisfied by the pinned go.mod — retire the override"
            exit 0
          fi
          # Every line that differs, in either direction, must be a require
          # line of a declared module, or a go/toolchain directive the gate
          # above accepted.
          refused=0
          while IFS=$'\t' read -r field path _; do
            [[ -n $field ]] || continue
            skip=0
            case $field in
            require) if grep -qxF "$path" "$RUNNER_TEMP/gomod.allowed"; then skip=1; fi ;;
            go | toolchain) skip=$directives_ok ;;
            esac
            if ((skip)); then continue; fi
            echo "  refused go.mod change: $field ${path:-(empty)}"
            refused=1
          done < <(sed 's/^[<>] //' "$RUNNER_TEMP/gomod.diff")
          ((refused == 0)) ||
            { echo "GO_SECURITY_OVERRIDES: go.mod changed outside the require lines of $GO_SECURITY_OVERRIDES"; exit 1; }
          echo "GO_SECURITY_OVERRIDES: applied; go.mod changed only in the declared require lines:"
          sed 's/^/  /' "$RUNNER_TEMP/gomod.diff"
      - name: pinned audit tools (built with their OWN pinned toolchain)
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          # The audit TOOLS are built with GO_AUDIT_TOOLCHAIN (declared once,
          # in builds/render.sh), which is INDEPENDENT of the toolchain that
          # builds the artifact. govulncheck is a Go module with a `go` line of
          # its own — v1.9.0 declares `go 1.26.0` — so `go install` under an
          # older pinned toolchain fails outright, before any analysis happens:
          # kopia v0.23.1 builds with go1.25.11, and that is exactly how
          # qiangli/kopia run 38326642419 died. Tying the two together would
          # hold every tool's audit hostage to its upstream's toolchain age.
          #
          # Keeping them independent gives the audit nothing it should not
          # have: `go install pkg@version` resolves in module-agnostic mode and
          # never reads src/go.mod, so GO_AUDIT_TOOLCHAIN cannot reach the
          # module being judged.
          GOTOOLCHAIN=go1.27.2 go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          GOTOOLCHAIN=go1.27.2 go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@$GO_SBOM_VERSION"
          # The ANALYSIS still runs at the module's own effective toolchain:
          # govulncheck shells out to `go`, and GOTOOLCHAIN in the environment
          # (exported by the toolchain step above) pins that to the release the
          # artifact is built with — so the stdlib govulncheck judges and the
          # language version it type-checks are the artifact's, not the audit
          # tool's.
          echo "audit tools built with: go1.27.2 (govulncheck $GOVULNCHECK_VERSION, cyclonedx-gomod $GO_SBOM_VERSION)"
          echo "analysis toolchain:     $(go version)"
      - name: govulncheck (source mode, the SHIPPED build configuration)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          report=../out/$TOOL-$UPSTREAM_TAG.govulncheck.json
          # Scope: the package the release actually builds (GO_PACKAGE), with
          # the tags it is built with (GO_AUDIT_TAGS) and the same GO_BUILD_ENV.
          # "Reachable" then means reachable IN THE ARTIFACT, which is the only
          # question a release gate can honestly answer.
          #
          # `./...` cannot answer it: it makes every package in the repository
          # a root, including test helpers and the extension packages a reduced
          # tag set deliberately keeps out of the binary. Build tags do not
          # save it — zot's pkg/extensions/search/cve/trivy carries no build
          # constraint at all, so `./...` calls trivy's unfixed GO-2026-4919
          # reachable in a binary that links none of it, and the only ways out
          # would be a waiver (never, for a reachable finding) or refusing to
          # ship a tool that is not actually vulnerable.
          tags=()
          [[ -z ${GO_AUDIT_TAGS:-} ]] || tags=(-tags "$GO_AUDIT_TAGS")
          envs=()
          if [[ -n ${GO_BUILD_ENV:-} ]]; then read -r -a envs <<<"$GO_BUILD_ENV"; fi
          echo "govulncheck scope: $GO_PACKAGE${GO_AUDIT_TAGS:+ -tags $GO_AUDIT_TAGS}"
          # govulncheck exits 3 when it finds anything, so the status is
          # deferred: the waiver gate below renders the verdict.
          env ${envs[@]+"${envs[@]}"} govulncheck -format json \
            ${tags[@]+"${tags[@]}"} "$GO_PACKAGE" >"$report" || true
          [[ -s $report ]] || { echo "govulncheck produced no report"; exit 1; }
          # A finding whose first trace frame names a function is REACHABLE
          # from called code; module-only findings are informational.
          jq -rs '[.[] | select(has("finding")) | .finding
                   | select(.trace[0].function != null) | .osv]
                  | unique | .[]' "$report" | sed '/^$/d' | sort -u >"$RUNNER_TEMP/found"
          # bashy-build/vuln-ignore: one OSV id per line, each with a
          # justification comment; empty means nothing is waived.
          grep -Ev '^[[:space:]]*(#|$)' ../fork/bashy-build/vuln-ignore |
            awk '{print $1}' | sort -u >"$RUNNER_TEMP/waived" || true
          if comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | grep -q .; then
            echo "govulncheck: unwaived vulnerabilities reachable from called code:"
            comm -23 "$RUNNER_TEMP/found" "$RUNNER_TEMP/waived" | sed 's/^/  /'
            exit 1
          fi
          echo "govulncheck: no unwaived reachable vulnerability ($(wc -l <"$RUNNER_TEMP/found") reachable, all waived or none)"
      - name: SBOM (CycloneDX, the bashy build configuration)
        working-directory: src
        run: |
          set -euo pipefail
          . ../fork/bashy-build/PIN
          mkdir -p ../out
          sbom=../out/$TOOL-$UPSTREAM_TAG.cdx.json
          # cyclonedx-gomod reads the build constraints from the environment,
          # taking the build tags through GOFLAGS. Tags change Go's module
          # selection, so without them the SBOM of a reduced build would list
          # dependencies the shipped binary does not contain.
          envs=()
          if [[ -n ${GO_BUILD_ENV:-} ]]; then read -r -a envs <<<"$GO_BUILD_ENV"; fi
          [[ -z ${GO_AUDIT_TAGS:-} ]] || envs+=("GOFLAGS=-tags=$GO_AUDIT_TAGS")
          env ${envs[@]+"${envs[@]}"} cyclonedx-gomod app -json -licenses -main "$GO_PACKAGE" -output "$sbom" .
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' "$sbom" >/dev/null
      - name: upload audit outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign, attest, publish
    needs: [pin, build, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the fork's GitHub release
      id-token: write # keyless Sigstore (Fulcio) + attestations
      attestations: write
    env:
      EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bashy-build.yml@${{ github.ref }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: checkout bashy-build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: fork
      - name: download gated assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: assemble release payload
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          [[ $COSIGN_VERSION == v3.1.3 ]] || { echo "PIN COSIGN_VERSION $COSIGN_VERSION != workflow cosign-release"; exit 1; }
          for pair in $RELEASE_EXTRA; do cp "fork/bashy-build/${pair%%=*}" "dist/${pair#*=}"; done
          for a in $RELEASE_EXECUTABLES; do chmod +x "dist/$a"; done
          for a in $RELEASE_ASSETS; do
            [[ -f dist/$a ]] || { echo "missing $a"; exit 1; }
          done
          # release assets are files; evidence directories are not published.
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          (cd dist && sha256sum -- * >SHA256SUMS && cat SHA256SUMS)
      - name: install cosign (pinned; must equal PIN COSIGN_VERSION)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign keyless sign-blob --bundle (per asset) and self-verify
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            [[ $f == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$EXPECTED_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$f"
          done
      - name: build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: publish GitHub release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ needs.pin.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          . fork/bashy-build/PIN
          {
            echo "bashy verified build of the official $TOOL $UPSTREAM_TAG release"
            echo "(upstream $UPSTREAM_SLUG commit $UPSTREAM_COMMIT)."
            echo
            echo "Signed keylessly with Sigstore. Verify any asset with:"
            echo
            echo "    cosign verify-blob --bundle ASSET.sigstore.json \\"
            echo "      --certificate-identity $EXPECTED_IDENTITY \\"
            echo "      --certificate-oidc-issuer $OIDC_ISSUER ASSET"
            echo
            echo "$RELEASE_NOTE"
            echo "Gates passed before signing: $RELEASE_GATES"
          } >notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME ($TOOL $UPSTREAM_TAG, bashy-signed)" --notes-file notes.md \
            dist/*
