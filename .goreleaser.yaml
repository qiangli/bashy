# goreleaser config for bashy — Bash 5.3 drop-in.
# Linux one-file artifacts are pure Go. Native macOS jobs build the Darwin
# artifacts with cgo, then add them to this draft before it is published.
# Siblings are go.mod pins. The release job runs ./scripts/resolve-pinned-siblings.sh
# first, which links ../outpost to the pinned outpost module for the outpost build.
version: 2

before:
  hooks:
    - ./scripts/stage-outpost-release-license.sh
    - go mod download
    # Release builds are fail-closed: no JS toolchain or no real dist/index.html
    # means GoReleaser stops before it can produce a success-shaped release.
    - ./scripts/build-meet-spa.sh required

builds:
  - id: bashy
    tool: ./scripts/go-product.sh
    main: ./cmd/bashy
    binary: bashy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    hooks:
      post:
        - cmd: ./scripts/verify-bashy-signal-artifact.sh "{{ .Path }}"
          output: true
        # Runs for every target. The script checks every artifact's recorded Go
        # tags and serves the native Linux artifact before publication.
        - cmd: ./scripts/verify-meet-spa-release.sh "{{ .Path }}" "{{ .Target }}"
          output: true
        - cmd: ./scripts/generate-release-sbom.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" dist/sbom
          output: true
    ldflags:
      - -w -X 'github.com/qiangli/bashy/internal/cli.bashVersion=5.3.0(1)-bashy-{{ .Tag }}' -X 'github.com/qiangli/bashsharp/transpile.ShellRuntimeCommit={{ .Env.SHELL_RUNTIME_COMMIT }}' -X 'github.com/qiangli/bashsharp/transpile.ShellRuntimeCommitTime={{ .Env.SHELL_RUNTIME_COMMIT_TIME }}'
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  # The offline image artifact (`bashy self image`): the static, purego-free
  # bashy_scratch profile, linux only, shipped as a raw binary so the image
  # build fetches one file. Same version stamp as bashy.
  - id: bashy-scratch
    tool: ./scripts/go-product.sh
    main: ./cmd/bashy
    binary: bashy-scratch-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - bashy_scratch
    hooks:
      post:
        - cmd: ./scripts/verify-bashy-signal-artifact.sh "{{ .Path }}"
          output: true
    ldflags:
      - -w -X 'github.com/qiangli/bashy/internal/cli.bashVersion=5.3.0(1)-bashy-{{ .Tag }}' -X 'github.com/qiangli/bashsharp/transpile.ShellRuntimeCommit={{ .Env.SHELL_RUNTIME_COMMIT }}' -X 'github.com/qiangli/bashsharp/transpile.ShellRuntimeCommitTime={{ .Env.SHELL_RUNTIME_COMMIT_TIME }}'
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: bash
    tool: ./scripts/go-product.sh
    main: ./cmd/bash
    binary: bash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X 'github.com/qiangli/bashy/internal/cli.bashVersion=5.3.0(1)-bashy-{{ .Tag }}'
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  - id: sh
    tool: ./scripts/go-product.sh
    main: ./cmd/sh
    binary: sh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X 'github.com/qiangli/bashy/internal/cli.bashVersion=5.3.0(1)-bashy-{{ .Tag }}'
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: outpost
    dir: ../outpost
    main: ./cmd/outpost
    binary: outpost
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    tags: [fb_archives]
    ldflags:
      - -s -w -X 'github.com/qiangli/outpost/internal/agent.releaseTag={{ .Tag }}' -X 'github.com/qiangli/outpost/internal/agent.ldCommit={{ .Env.OUTPOST_COMMIT }}' -X 'github.com/qiangli/outpost/internal/agent.ldDirty=false'
    goos: [linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: outpost
    ids: [outpost]
    formats: [binary]
    name_template: 'outpost-v{{ trimsuffix .Version "-dev" }}-{{ .Os }}-{{ .Arch }}'
  - id: bashy-scratch
    ids: [bashy-scratch]
    formats: [binary]
    name_template: "bashy-scratch-{{ .Os }}-{{ .Arch }}"
  - id: bashy
    ids: [bashy, outpost, bash, sh]
    name_template: "bashy-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - src: .release-assets/LICENSE.outpost
        dst: LICENSE.outpost
  - id: bash
    # Preserve the strict sh + GNU Bash-compatible archive family.
    ids: [bash, sh]
    name_template: "bash-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

# The distro packages are another view of the same four Linux builds used by
# the release archive. nFPM is part of the binmgr-managed GoReleaser toolchain;
# no distro-specific rebuild is allowed here.
nfpms:
  - id: bashy-linux-packages
    package_name: bashy
    ids: [bashy, bash, sh, outpost]
    vendor: dhnt
    homepage: https://github.com/qiangli/bashy
    maintainer: Qiang Li
    description: Bashy userland, shell entry points, and outpost host agent
    license: "BSD-3-Clause AND MIT"
    # Never /usr/bin: bash and sh would collide with the distribution's own
    # shells. All four members live together (sibling resolution) and only
    # bashy and outpost are linked onto PATH; bash/sh stay opt-in.
    bindir: /usr/lib/bashy/bin
    formats:
      - deb
      - rpm
      - apk
    # The linux bashy links libc dynamically (purego's fakecgo), so on
    # Alpine/musl it needs the glibc loader shim.
    overrides:
      apk:
        dependencies:
          - gcompat
    scripts:
      postinstall: ./scripts/linux-package-postinstall.sh
    contents:
      - src: /usr/lib/bashy/bin/bashy
        dst: /usr/bin/bashy
        type: symlink
      - src: /usr/lib/bashy/bin/outpost
        dst: /usr/bin/outpost
        type: symlink
      - src: LICENSE
        dst: /usr/share/licenses/bashy/LICENSE
      - src: .release-assets/LICENSE.outpost
        dst: /usr/share/licenses/bashy/LICENSE.outpost

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: qiangli
    name: bashy
  # The draft is owned by exactly one Actions run. Cleanup requires this marker
  # before it may delete a failed draft, so another actor's release is safe.
  header: |
    <!-- bashy-release-run: {{ .Env.BASHY_RELEASE_RUN_ID }} -->
  # A `-dev` semver tag is the QA candidate — mark it a PRE-RELEASE so promote.yml
  # (which refuses to byte-promote a non-prerelease) accepts it, and so users don't
  # mistake the untested candidate for the promoted release. `auto` flags any tag
  # carrying a semver prerelease component (-dev / -rc / -beta).
  prerelease: auto
  draft: true

changelog:
  use: github
  sort: asc
