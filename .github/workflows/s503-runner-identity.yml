name: S503 runner identity preflight

on:
  push:
    branches: [s503-contract-integration]
    paths:
      - .github/workflows/s503-runner-identity.yml
      - docs/sprint-503/S503.8-runner-identity.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-identity:
    name: ${{ matrix.label }} identity
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            expected_os: Linux
            expected_arch: amd64
          - label: ubuntu-24.04-arm
            expected_os: Linux
            expected_arch: arm64
          - label: macos-15-intel
            expected_os: macOS
            expected_arch: amd64
          - label: macos-15
            expected_os: macOS
            expected_arch: arm64
          - label: windows-2025
            expected_os: Windows
            expected_arch: amd64
          - label: windows-11-arm
            expected_os: Windows
            expected_arch: arm64

    steps:
      - name: Record runner identity and toolchain
        id: identity
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.label }}
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          ACTUAL_OS="$(node -p 'process.platform === "win32" ? "Windows" : process.platform === "darwin" ? "macOS" : "Linux"')"
          PROCESS_ARCH="$(node -p 'process.arch')"
          if [[ "$ACTUAL_OS" == Windows ]]; then
            # Query the OS, since an x64 process can run under ARM64 emulation.
            RAW_ARCH="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()' | tr -d '\r')"
          else
            RAW_ARCH="$(uname -m)"
          fi
          case "$RAW_ARCH" in
            x86_64|X64) ACTUAL_ARCH=amd64 ;;
            aarch64|arm64|Arm64) ACTUAL_ARCH=arm64 ;;
            *) ACTUAL_ARCH="$RAW_ARCH" ;;
          esac
          TRANSLATED=0
          if [[ "$ACTUAL_OS" == macOS ]]; then
            TRANSLATED="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          fi
          NODE_VERSION="$(node --version)"
          GO_VERSION=missing
          GO_HOST_ARCH=missing
          if command -v go >/dev/null 2>&1; then
            GO_VERSION="$(go version)"
            GO_HOST_ARCH="$(go env GOHOSTARCH)"
          fi
          BASH_VERSION="$(bash --version | head -n 1)"
          export ACTUAL_OS ACTUAL_ARCH RAW_ARCH PROCESS_ARCH TRANSLATED NODE_VERSION GO_VERSION GO_HOST_ARCH BASH_VERSION

          node <<'NODE'
          const fs = require('fs');
          const evidence = {
            schema: 's503-runner-identity-v1',
            runner_label: process.env.RUNNER_LABEL,
            expected_os: process.env.EXPECTED_OS,
            expected_arch: process.env.EXPECTED_ARCH,
            actual_os: process.env.ACTUAL_OS,
            actual_arch: process.env.ACTUAL_ARCH,
            os_arch_raw: process.env.RAW_ARCH,
            process_arch: process.env.PROCESS_ARCH,
            translated: process.env.TRANSLATED,
            node: process.env.NODE_VERSION,
            go: process.env.GO_VERSION,
            go_host_arch: process.env.GO_HOST_ARCH,
            bash: process.env.BASH_VERSION,
            commit_sha: process.env.COMMIT_SHA,
          };
          fs.writeFileSync('evidence/runner-identity.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

          cat evidence/runner-identity.json
          if [[ "$ACTUAL_OS" != "$EXPECTED_OS" ]]; then
            echo "OS mismatch: expected $EXPECTED_OS, got $ACTUAL_OS" >&2
            exit 1
          fi
          if [[ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Architecture mismatch: expected $EXPECTED_ARCH, got $ACTUAL_ARCH" >&2
            exit 1
          fi
          if [[ "$TRANSLATED" == 1 ]]; then
            echo "Translated process cannot establish native execution" >&2
            exit 1
          fi
          if [[ "$GO_HOST_ARCH" != missing && "$GO_HOST_ARCH" != "$EXPECTED_ARCH" ]]; then
            echo "Go toolchain is not native: $GO_HOST_ARCH on $EXPECTED_ARCH" >&2
            exit 1
          fi

      - name: Upload identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s503-runner-identity-${{ matrix.label }}
          path: evidence/runner-identity.json
          if-no-files-found: error
          retention-days: 14

  launcher:
    name: ${{ matrix.label }} launcher
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: ubuntu-24.04, os: Linux, arch: amd64, python_arch: x64, python_version: '3.12.15'}
          - {label: ubuntu-24.04-arm, os: Linux, arch: arm64, python_arch: arm64, python_version: '3.12.15'}
          - {label: macos-15-intel, os: Darwin, arch: amd64, python_arch: x64, python_version: '3.12.10'}
          - {label: macos-15, os: Darwin, arch: arm64, python_arch: arm64, python_version: '3.12.10'}
          - {label: windows-2025, os: Windows, arch: amd64, python_arch: x64, python_version: '3.12.10'}
          - {label: windows-11-arm, os: Windows, arch: arm64, python_arch: arm64, python_version: '3.12.10'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Build native Bashy on runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s503-launcher"
          suffix=''
          if [[ '${{ matrix.os }}' == Windows ]]; then suffix='.exe'; fi
          ./scripts/go-product.sh build -trimpath -o "$RUNNER_TEMP/s503-launcher/bashy$suffix" ./cmd/bashy
      - name: Check exact external Python and pre-exec rejection
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          TARGET_LABEL: ${{ matrix.label }}
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys, tempfile

          def require(ok, why):
              if not ok:
                  raise SystemExit(why)

          arch = {'x86_64': 'amd64', 'AMD64': 'amd64', 'X64': 'amd64',
                  'aarch64': 'arm64', 'arm64': 'arm64', 'ARM64': 'arm64'}
          actual_arch = arch.get(platform.machine(), platform.machine())
          actual_os = platform.system()
          require(actual_os == os.environ['EXPECTED_OS'] and
                  actual_arch == os.environ['EXPECTED_ARCH'], 'non-native runner')
          target = actual_os.lower().replace('darwin', 'darwin') + '/' + actual_arch
          policy = json.loads(pathlib.Path('examples/transcribe/dependencies/external-python-runtime.json').read_text())
          python_sha = hashlib.sha256(pathlib.Path(sys.executable).read_bytes()).hexdigest()
          require(python_sha == policy['targets'][target]['python_sha256'],
                  'selected CI Python differs from reviewed policy')
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 's503-launcher'
          bashy = root / ('bashy.exe' if actual_os == 'Windows' else 'bashy')
          request = root / 'invalid ; $(literal).json'
          request.write_text('{}', encoding='utf-8')
          launcher = pathlib.Path('examples/transcribe/launch_python.sh').resolve()
          env = dict(os.environ, BASHY_TRANSCRIBE_PYTHON=sys.executable,
                     BASHY_HINTS='off')
          env.pop('BASHY_TRANSCRIBE_PYTHON_SOURCE_PREFIX', None)
          success = subprocess.run([str(bashy), str(launcher), str(request)],
                                   env=env, capture_output=True, text=True, timeout=60)
          require(success.returncode == 1 and success.stdout.strip(),
                  'verified interpreter did not reach adapter: returncode=' +
                  str(success.returncode) + ' stderr=' + success.stderr[:1200] +
                  ' stdout=' + success.stdout[:1200])
          result = json.loads(success.stdout)
          require(result['error']['code'] == 'invalid_request' and
                  'expected a bashy-transcribe-stage-v1' in result['error']['message'],
                  'adapter did not receive literal request')
          changed = root / ('changed-python.exe' if actual_os == 'Windows' else 'changed-python')
          changed.write_bytes(pathlib.Path(sys.executable).read_bytes() + b'changed')
          env['BASHY_TRANSCRIBE_PYTHON'] = str(changed)
          rejected = subprocess.run([str(bashy), str(launcher), str(request)],
                                    env=env, capture_output=True, text=True, timeout=60)
          require(rejected.returncode != 0 and 'SHA-256 differs' in rejected.stderr and
                  not rejected.stdout, 'changed interpreter was not rejected before exec')
          report = {'schema': 's503-python-launcher-native-v1',
                    'target': target, 'runner_label': os.environ['TARGET_LABEL'],
                    'candidate_commit': os.environ['CANDIDATE_COMMIT'],
                    'python_sha256': python_sha, 'policy_sha256': hashlib.sha256(
                        pathlib.Path('examples/transcribe/dependencies/external-python-runtime.json').read_bytes()).hexdigest(),
                    'verified_interpreter_reached_adapter': True,
                    'changed_interpreter_rejected_before_exec': True,
                    'scope': 'external CI Python and local pre-exec byte guard; no product install or license admission'}
          (root / 'result.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s503-python-launcher-${{ matrix.label }}
          path: ${{ runner.temp }}/s503-launcher/result.json
          if-no-files-found: ignore
