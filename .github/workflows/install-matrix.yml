name: install-matrix

# Sprint 212 S212.1: the launch bar of 2026-07-25, mechanized. On each OS
# runner, install bashy the way a user does — download the release archive,
# NO Go toolchain involved — and run the Bash# quickstart through its own
# gate, examples/quickstart/check.sh: the judge demo (six invocations, six
# exit codes 0 3 3 1 1 6) plus decorators/kwargs/enums/readonly, each diffed
# against its pinned transcript. Windows is the must-have segment.
#
# Green only against a release that carries the Sprint 203 contract natives
# and the --bashsharp spelling (after v0.22.0) — run it with `tag` set to
# that release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to install (default: latest non-prerelease)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: bashy-linux-amd64.tar.gz
          - os: macos-latest
            asset: bashy-darwin-arm64.tar.gz
          - os: windows-latest
            asset: bashy-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.event.inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "installing $tag / ${{ matrix.asset }}"

      - name: Download the release archive (no Go toolchain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bashy-install"
          gh release download "${{ steps.rel.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.asset }}" --dir "$RUNNER_TEMP/bashy-install"
          cd "$RUNNER_TEMP/bashy-install"
          case "${{ matrix.asset }}" in
            *.zip) unzip -q "${{ matrix.asset }}" ;;
            *) tar -xzf "${{ matrix.asset }}" ;;
          esac
          ls -la

      - name: bashy --version
        run: |
          bin="$RUNNER_TEMP/bashy-install/bashy"
          [ -x "$bin" ] || bin="$RUNNER_TEMP/bashy-install/bashy.exe"
          echo "BASHY_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Quickstart gate — judge (six exit codes) + decorators, kwargs, enums, readonly
        run: ./examples/quickstart/check.sh "$BASHY_BIN"
