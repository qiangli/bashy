name: prima source admission (blocked, no build)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'builds/prima.cpp/**'
      - '.github/workflows/prima-source-admission.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: bashy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qiangli/prima.cpp
          ref: f4ea9845dc91a18793921492e50ef23ec799e93e
          persist-credentials: false
          path: prima
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanomsg/nng
          ref: v1.9.0
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false
          path: nng
      - name: Offline negative tests
        run: python3 -B bashy/builds/prima.cpp/check_test.py
      - name: Inspect pinned source and license bytes without executing upstream code
        run: python3 -B bashy/builds/prima.cpp/check.py --source prima --nng nng > prima-source-review.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prima-blocked-source-review
          path: prima-source-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Record release hold
        run: |
          echo 'Source inspection only. Build, audit, SBOM, egress proof and signatures remain blocked; this is not a release gate pass.' >> "$GITHUB_STEP_SUMMARY"
          if python3 -B bashy/builds/prima.cpp/check.py --require-release; then
            echo 'Unexpected release admission: this workflow must never authorize a build.' >&2
            exit 1
          fi
