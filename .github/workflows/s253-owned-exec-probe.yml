name: S253 owned exec focused probe
on:
  push:
    branches: [s253-owned-handoff]

jobs:
  owned-exec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap pinned sibling modules
        shell: bash
        run: ./scripts/bootstrap-siblings.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - name: Focused large argv and environment transport
        shell: bash
        timeout-minutes: 10
        env:
          BASHY_OWNED_DEBUG: "1"
        run: go test -v -count=1 -timeout 8m -run '^TestOwnedExecLargeArgAndEnv$' ./internal/cli
