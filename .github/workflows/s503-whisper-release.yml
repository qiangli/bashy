name: S503 signed Whisper release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed tag at the source commit
        required: true
        type: string
      publish:
        description: Publish only after all admission gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-build:
    uses: ./.github/workflows/s503-native-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  stage:
    needs: native-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLISH: ${{ inputs.publish }}
      SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/s503-whisper-release.yml@${{ github.ref }}
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tagged source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^whisper-cpp-v1\.9\.5-bashy\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - uses: actions/download-artifact@v4
        with:
          pattern: s503-native-build-*
          path: artifacts
      - name: Verify six native build attestations
        shell: bash
        run: |
          set -euo pipefail
          for label in ubuntu-24.04 ubuntu-24.04-arm macos-15-intel macos-15 windows-2025 windows-11-arm; do
            binary=whisper-cli
            if [[ "$label" == windows-* ]]; then binary+=.exe; fi
            gh attestation verify "artifacts/s503-native-build-$label/$binary" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/s503-native-build.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Stage exact six-target release inventory
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--require-admitted); fi
          python3 examples/transcribe/dependencies/prepare_whisper_release.py \
            --artifacts artifacts \
            --notices examples/transcribe/dependencies/WHISPER-NOTICES.txt \
            --output dist --source-commit "$GITHUB_SHA" "${args[@]}"
          (cd dist && sha256sum -c SHA256SUMS --status)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and verify release bytes and digest manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in WHISPER-NOTICES.txt whisper-release-manifest.json whisper-build-evidence.tar.gz whisper-cli-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$SIGNING_IDENTITY" \
              --certificate-oidc-issuer "$SIGNING_ISSUER" "$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: s503-whisper-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish == true
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/s503-whisper-release.yml@${{ github.ref }}
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s503-whisper-release-candidate
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Reverify signed release inventory
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS --status
          for asset in WHISPER-NOTICES.txt whisper-release-manifest.json whisper-build-evidence.tar.gz whisper-cli-* SHA256SUMS; do
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "$SIGNING_IDENTITY" \
              --certificate-oidc-issuer "$SIGNING_ISSUER" "$asset"
          done
      - name: Publish reviewed signed release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Whisper release tag already has a release" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Bashy whisper.cpp 1.9.5 $RELEASE_TAG" \
            --notes "Six native CPU builds, signed binaries and digest manifest, and reviewed notices."
