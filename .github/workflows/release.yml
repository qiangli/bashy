name: release
on:
  push:
    tags:
      # Build + publish a PRE-RELEASE only for -dev tags. A bare vX.Y.Z tag is a
      # PROMOTION of already-tested bytes (see .github/workflows/promote.yml) and
      # must NOT rebuild from source — prod ships exactly what QA tested, byte for
      # byte. GoReleaser marks a -dev semver tag as a prerelease automatically.
      - 'v*-dev'

permissions:
  contents: write

jobs:
  darwin:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: native Bashy ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap pinned siblings
        shell: bash
        env:
          BASHY_BOOTSTRAP_SUBMODULES: "1"
        run: ./scripts/bootstrap-siblings.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Build, audit and probe native one-file Bashy
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/build-meet-spa.sh required
          ./scripts/build-native-darwin-release.sh "$TAG" "$ARCH" "$RUNNER_TEMP/native"
      - name: Sign native Bashy archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/native/bashy-darwin-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bashy-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/native/bashy-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3
  goreleaser:
    outputs:
      seed_summary: ${{ steps.seed-bands.outputs.summary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Bashy resolves four direct dependencies as flat siblings. Clone each
      # next door at its exact SHA from .sibling-pins.
      - name: Bootstrap sibling deps (all pinned flat replaces)
        shell: bash
        env:
          # DKS source tasks intentionally skip heavyweight optional sibling
          # submodules. A release builds the complete module graph, including
          # coreutils' pinned Ollama replacement, so it must opt in.
          BASHY_BOOTSTRAP_SUBMODULES: "1"
        run: ./scripts/bootstrap-siblings.sh
      - name: Check seed bands for this release
        id: seed-bands
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          summary=$(./scripts/check-seed-bands.sh "$TAG" --yoke ../yoke)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Export shell runtime pin
        shell: bash
        run: |
          shell_runtime_commit=$(sed -n 's/^sh=//p' .sibling-pins)
          shell_runtime_commit_time=$(git -C ../sh show -s --format=%cI "$shell_runtime_commit")
          test -n "$shell_runtime_commit"
          test -n "$shell_runtime_commit_time"
          echo "SHELL_RUNTIME_COMMIT=$shell_runtime_commit" >> "$GITHUB_ENV"
          echo "SHELL_RUNTIME_COMMIT_TIME=$shell_runtime_commit_time" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # package.json pins the same version. GoReleaser's required SPA hook runs
      # the locked install/build and fails the release if this toolchain or its
      # output is absent.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: verify complete draft and publish candidate
    needs: [darwin, goreleaser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bashy-darwin-*
          path: native
          merge-multiple: true
      - name: Verify native provenance and prepare complete signed manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SEED_SUMMARY: ${{ needs.goreleaser.outputs.seed_summary }}
        run: ./scripts/publish-complete-dev-release.sh prepare
      - name: Sign complete artifact manifest
        uses: actions/attest@v4
        with:
          subject-path: release-dist/checksums.txt
      - name: Attach audited assets and publish candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SEED_SUMMARY: ${{ needs.goreleaser.outputs.seed_summary }}
        run: ./scripts/publish-complete-dev-release.sh publish
  cleanup:
    name: remove incomplete draft from this run
    if: ${{ always() && (needs.darwin.result != 'success' || needs.goreleaser.result != 'success' || needs.publish.result != 'success') }}
    needs: [darwin, goreleaser, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete only this run's incomplete draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: ./scripts/cleanup-incomplete-dev-release.sh
