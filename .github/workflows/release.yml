name: release
on:
  # Build locally first. The manager uploads the reviewed local dist as a draft,
  # then dispatches this publish-only workflow on that exact -dev tag.
  workflow_dispatch:
    inputs:
      evidence_commit:
        description: Reviewed immutable refs/notes/bashy-local-gates commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    outputs:
      draft_id: ${{ steps.draft.outputs.id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen local security evidence and draft bytes
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          LOCAL_GATE_EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
          LOCAL_GATE_EVIDENCE_OUT: ${{ runner.temp }}/local-security-evidence.json
        run: |
          set -euo pipefail
          test "$REF_TYPE" = tag
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?-dev$ ]]
          ./scripts/verify-local-release-gate.sh
          gh release view "$TAG" --json databaseId,isDraft,isPrerelease,targetCommitish,body > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" "$COMMIT" <<'PY'
          import json, sys
          draft = json.load(open(sys.argv[1]))
          if not draft['isDraft'] or not draft['isPrerelease'] or draft['targetCommitish'] != sys.argv[2]:
              raise SystemExit('draft is not the exact reviewed candidate')
          open('candidate-notes.md', 'w').write(draft['body'])
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + str(draft['databaseId']) + '\n')
          PY
          mkdir release-dist
          gh release download "$TAG" -D release-dist
          ./scripts/verify-release-asset-set.sh release-dist
          python3 scripts/local-release-evidence.py verify "$RUNNER_TEMP/local-security-evidence.json" --commit "$COMMIT" --dist release-dist | tee "$RUNNER_TEMP/receipt.txt"
          # An operator vulnerability override is published in the run summary.
          if grep -q 'OVERRIDE' "$RUNNER_TEMP/receipt.txt"; then
            { echo '## Vulnerability gate: operator override'; echo; sed 's/^/    /' "$RUNNER_TEMP/receipt.txt"; } >> "$GITHUB_STEP_SUMMARY"
            grep -q 'Vulnerability override' candidate-notes.md || { echo 'draft notes must disclose the vulnerability override' >&2; exit 1; }
          fi
          python3 scripts/release-signing-status.py read-note candidate-notes.md darwin
          python3 scripts/release-signing-status.py read-note candidate-notes.md windows
          cp "$RUNNER_TEMP/local-security-evidence.json" local-security-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-local-release
          path: |
            release-dist/
            candidate-notes.md
            local-security-evidence.json
          if-no-files-found: error
          retention-days: 3

  # Verify the already-built/signed bytes on their native OS. These jobs do not
  # compile, link, fetch source dependencies, or alter the reviewed assets.
  signature-qa:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-local-release
      - name: Verify declared native signing status
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          signed=$(python3 scripts/release-signing-status.py read-note candidate-notes.md "$PLATFORM")
          ./scripts/verify-signatures.sh release-dist "$PLATFORM" "$signed"

  provenance:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-local-release
      - uses: actions/attest@v4
        with:
          subject-path: |
            release-dist/checksums.txt
            release-dist/bashy-darwin-arm64.tar.gz

  publish:
    name: publish the reviewed local candidate without rebuilding
    needs: [preflight, signature-qa, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-local-release
      - name: Verify provenance and publish the existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DRAFT_ID: ${{ needs.preflight.outputs.draft_id }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-asset-set.sh release-dist
          ./scripts/verify-release-provenance.sh release-dist/checksums.txt
          ./scripts/verify-release-provenance.sh release-dist/bashy-darwin-arm64.tar.gz
          # One server-side digest listing replaces downloading every draft
          # asset again immediately before publication.
          gh api "repos/$REPO/releases/$DRAFT_ID/assets?per_page=100" > "$RUNNER_TEMP/remote-assets.json"
          python3 scripts/verify-release-remote-assets.py "$RUNNER_TEMP/remote-assets.json" release-dist
          # The draft's bytes were uploaded once by the local release manager.
          # This workflow changes only visibility, never tags or artifact bytes.
          gh release edit "$TAG" --draft=false --prerelease
      - name: register development product release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: "true"
          DIST: release-dist
          URL: ${{ secrets.CLOUDBOX_RELEASE_WEBHOOK_URL }}
          SECRET: ${{ secrets.CLOUDBOX_RELEASE_WEBHOOK_SECRET }}
        run: ./scripts/register-product-release.sh
