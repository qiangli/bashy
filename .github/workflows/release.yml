name: release
on:
  push:
    tags:
      # Build + publish a PRE-RELEASE only for -dev tags. A bare vX.Y.Z tag is a
      # PROMOTION of already-tested bytes (see .github/workflows/promote.yml) and
      # must NOT rebuild from source — prod ships exactly what QA tested, byte for
      # byte. GoReleaser marks a -dev semver tag as a prerelease automatically.
      - 'v*-dev'

permissions:
  contents: write

# One tag can have only one producer. Pending retries wait rather than
# canceling a build that may already have created its draft.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require unused release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release-tag-vacant.sh
  # Release check: pinned govulncheck over bashy, outpost and yoke at the pinned
  # sibling versions. It is report-only until the known third-party findings
  # are cleared; docs/release-runbook.md documents the one-line blocking switch.
  govulncheck:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - name: Resolve pinned siblings (go.mod)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-pinned-siblings.sh
      - name: govulncheck (source mode; report-only)
        # Blocking switch: set this one value to false.
        continue-on-error: true
        shell: bash
        env:
          GOVULNCHECK_OUT: ${{ runner.temp }}/govulncheck
        run: make govulncheck | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck
          path: ${{ runner.temp }}/govulncheck/*.json
          if-no-files-found: ignore
          retention-days: 7
  # Release check: license gate over bashy, outpost and yoke at the pinned
  # sibling versions. It is report-only until the 11 known MPL-2.0 findings
  # are cleared; docs/release-runbook.md documents the one-line blocking switch.
  license-gate:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - name: Resolve pinned siblings (go.mod)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-pinned-siblings.sh
      - name: Shipped dependency license gate (report-only)
        # Blocking switch: remove --report-only and restore license-gate to release needs.
        shell: bash
        env:
          LICENSE_GATE_OUT: ${{ runner.temp }}/license-gate
        run: ./scripts/verify-license-gate.sh --report-only | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-gate
          path: ${{ runner.temp }}/license-gate/*
          if-no-files-found: ignore
          retention-days: 7
  darwin:
    needs: [preflight, govulncheck]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: native Bashy ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - name: Resolve pinned siblings (go.mod)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-pinned-siblings.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Fetch signed Ollama runner
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Verifies the Sigstore bundle + yoke pin before any build; a
          # missing or unverified runner fails the job here, never ships.
          ./scripts/fetch-signed-runner.sh darwin "$ARCH"
      - name: Prefetch native build modules
        shell: bash
        run: |
          # Match the product build's module mode and tags while network is
          # available. The build itself must work from this cache alone.
          GOWORK=off GOFLAGS=-mod=mod go mod download all
          GOWORK=off GOFLAGS=-mod=mod CGO_ENABLED=0 go list -deps -tags embed_runner,bashy_runtime_snapshot ./cmd/bashy >/dev/null
      - name: Build, audit and probe native one-file Bashy
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The binary embeds the SPA artifact committed at the pinned yoke;
          # fail closed if that artifact is stale or the toolchain is missing.
          ./scripts/build-meet-spa.sh check
          ./scripts/build-native-darwin-release.sh "$TAG" "$ARCH" "$RUNNER_TEMP/native"
      - name: Sign native Bashy archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/native/bashy-darwin-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bashy-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/native/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-bashy-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/darwin-sbom/*
          if-no-files-found: ignore
          retention-days: 7
  goreleaser:
    needs: [preflight, govulncheck]
    outputs:
      seed_summary: ${{ steps.seed-bands.outputs.summary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - name: Resolve pinned siblings (go.mod)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-pinned-siblings.sh
      - name: Check seed bands for this release
        id: seed-bands
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          summary=$(./scripts/check-seed-bands.sh "$TAG" --yoke ../yoke)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # package.json pins the same version. GoReleaser's required SPA hook runs
      # the locked install/build and fails the release if this toolchain or its
      # output is absent.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Prefetch signed Ollama runners
        shell: bash
        run: |
          # Early fail-closed gate for every GoReleaser target: pins, network
          # and verifier must work before the long build starts. Each target
          # re-fetches its own runner in the build pre-hook below, because the
          # embed slot holds one platform at a time.
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64; do
            ./scripts/fetch-signed-runner.sh "${target%/*}" "${target#*/}"
          done
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          # --parallelism 1: the bashy build embeds one platform's verified
          # runner per target via a pre-hook that rewrites a shared slot;
          # parallel target builds would embed each other's runner.
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASHY_RELEASE_RUN_ID: ${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: bashy-release-sboms
          path: dist/sbom/*
          if-no-files-found: ignore
          retention-days: 7
      - name: List and verify Linux package contents
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
          ./scripts/verify-linux-packages.sh dist
      - name: Start the packaged bashy on Alpine
        shell: bash
        run: |
          docker run --rm -v "$PWD/dist:/pkg:ro" alpine:3 sh -euc '
            apk add --allow-untrusted /pkg/bashy_*_linux_amd64.apk
            /usr/lib/bashy/bin/bashy --version
            /usr/lib/bashy/bin/bashy -c "echo apk-ok"
            /usr/lib/bashy/bin/outpost --version'
  # The otel stack orchestrator blob, built HERE — not in engine-blobs.yml.
  # engine-blobs.yml listens on `release: published`, but that event never
  # fires for our releases: the draft is created by the GoReleaser step below
  # and published by publish-complete-dev-release.sh, both authenticated with
  # GITHUB_TOKEN, and GitHub does not start workflow runs for events created
  # with GITHUB_TOKEN. So every release since the trigger was introduced
  # shipped without otel-<goos>-<goarch>.gz and `bashy otel serve` failed on a
  # fresh host with "binmgr: otel: no prebuilt blob".
  #
  # This job runs after the draft exists (needs goreleaser) and before publish
  # finalizes it, so the blobs land in the candidate, its checksums.txt and
  # the asset-set QA below. One ubuntu runner cross-compiles every platform
  # (pure Go, CGO_ENABLED=0) — decoupled from the macOS build matrix, so a
  # slow or failed native/podman build cannot block or be blocked by it.
  # scripts/publish-otel-blob.sh stays the single implementation; the otel job
  # in engine-blobs.yml remains as the manual-backfill path (workflow_dispatch).
  otel:
    needs: [goreleaser]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone the pinned yoke
        shell: bash
        run: |
          # The pinned yoke source (embed scripts write into its tree): the
          # commit bashy's go.mod requires.
          rev=$(sed -n 's|^[[:space:]]*github.com/qiangli/yoke v[^ ]*-\([0-9a-f]\{12\}\)$|\1|p' go.mod)
          test -n "$rev"
          git clone --quiet --filter=blob:none https://github.com/qiangli/yoke.git ../yoke
          git -C ../yoke checkout --quiet "$rev"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
      - name: Build + publish otel blobs to this candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/publish-otel-blob.sh "$TAG"
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: verify complete draft and publish candidate
    needs: [darwin, goreleaser, otel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bashy-darwin-*
          # Not native/: that directory is tracked source (siglaunch).
          path: release-native
          merge-multiple: true
      - name: Verify native provenance and prepare complete signed manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SEED_SUMMARY: ${{ needs.goreleaser.outputs.seed_summary }}
        run: ./scripts/publish-complete-dev-release.sh prepare
      - name: Sign complete artifact manifest
        uses: actions/attest@v4
        with:
          subject-path: release-dist/checksums.txt
      - name: Attach audited assets and publish candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SEED_SUMMARY: ${{ needs.goreleaser.outputs.seed_summary }}
        run: ./scripts/publish-complete-dev-release.sh publish
      - name: register development product release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: "true"
          DIST: published-dist
          URL: ${{ secrets.CLOUDBOX_RELEASE_WEBHOOK_URL }}
          SECRET: ${{ secrets.CLOUDBOX_RELEASE_WEBHOOK_SECRET }}
        run: ./scripts/register-product-release.sh
  cleanup:
    name: remove incomplete draft from this run
    if: ${{ always() && needs.preflight.result == 'success' && (needs.darwin.result != 'success' || needs.goreleaser.result != 'success' || needs.publish.result != 'success') }}
    needs: [preflight, darwin, goreleaser, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete only this run's incomplete draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: ./scripts/cleanup-incomplete-dev-release.sh
