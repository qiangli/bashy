name: test
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is a real target (classgo staging runs on it). It builds the
        # lean cmd/bash + cmd/bashy and test-runs internal/agentos; internal/cli's
        # readline/forced-tty tests are deferred there (they hang without a PTY).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Bashy resolves four direct dependencies as flat siblings. Clone each
      # next door at its exact SHA from .sibling-pins.
      - name: Bootstrap sibling deps (all pinned flat replaces)
        shell: bash
        run: ./scripts/bootstrap-siblings.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      # The DEFAULT lean cmd/bashy (shell + coreutils userland + git + dag +
      # bashy go) is pure-Go and cross-compiles everywhere. The heavy host layers
      # — engines (bashy podman/ollama, -tags bashy_engines, cgo+btrfs/MLX, unix)
      # and obs (bashy otel, -tags bashy_obs) — are opt-in and built separately.
      # Formatting is platform-independent, so this runs on ONE leg — three
      # would be waste, and the windows leg would additionally have to reason
      # about line endings.
      #
      # It REPORTS and never rewrites, deliberately. gofmt changes doc-comment
      # TEXT as well as whitespace (a pair of ASCII single-quotes becomes a
      # curly closing quote), which has already silently corrupted the comment
      # in tools/bash53suite/main.go that quotes a trap listing's empty-string
      # argument. An auto-fixing gate would land that class of change
      # unreviewed, disguised as formatting.
      - name: gofmt check (reports; never rewrites)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/fmtcheck.sh
      - name: Make build failures stop before launcher and install
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/test-build-fail-closed.sh
      - name: Build + vet + test (shell core + lean agentos)
        shell: bash
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build ./cmd/bash ./cmd/bashy
            go vet  ./cmd/bash ./cmd/bashy ./internal/agentos
            # internal/cli's readline / forced-interactive tests hang without a PTY
            go test -v -timeout 5m ./internal/agentos
          else
            go build ./cmd/bash ./cmd/bashy ./internal/...
            go vet  ./cmd/bash ./cmd/bashy ./internal/...
            go test ./internal/cli ./internal/agentos
          fi
      # E2E: build the real bashy binary on THIS OS and confirm every command
      # `bashy commands` advertises actually dispatches (no "No such command" /
      # "not in this build" / "No such file"). Runs on macOS AND Windows — the
      # cross-platform half of the command-support guarantee.
      - name: E2E command dispatch (all listed verbs run on this OS)
        shell: bash
        timeout-minutes: 10
        run: go test -v -timeout 8m -tags e2e -run TestE2EAllListedCommandsDispatch ./internal/agentos
      - name: Cross-build lean cmd/bashy for every release platform (CGO_ENABLED=0)
        shell: bash
        run: |
          for osarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${osarch%/*}; arch=${osarch#*/}
            echo "cmd/bashy $os/$arch (lean)..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cmd/bashy
          done
      - name: DKS release evidence script tests
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/test-dks-release-evidence.sh

  # The GNU bash-5.3 conformance gate (the former bash53-gate job) moved to
  # conformance.yml on 2026-09-17: it runs on tags and by hand, not on push.

  # The tracked meet SPA artifact (yoke/pkg/meet/artifact) can silently go
  # stale: a source change with no SPA rebuild ships yesterday's bundle. This
  # native-Linux job builds a fresh SPA and REQUIRES it to match the committed
  # artifact byte-for-byte, without repairing it. Node/pnpm are provisioned the
  # same way the release job does (matching pkg/meet/web's pinned packageManager),
  # so a missing toolchain fails the gate closed rather than skipping it.
  meet-spa-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap sibling deps (all pinned flat replaces)
        shell: bash
        run: ./scripts/bootstrap-siblings.sh
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # pkg/meet/web's package.json pins the same pnpm; build-meet-spa.sh resolves
      # it through corepack from that directory's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      # Hermetic regression first (no build), then the live real-SPA freshness
      # gate — the same order make test uses, before anything could promote the
      # artifact.
      - name: meet SPA freshness regression (fixtures)
        shell: bash
        run: make test-meet-spa-fresh-regression
      - name: meet SPA freshness gate (real build, non-mutating)
        shell: bash
        timeout-minutes: 10
        run: make test-meet-spa-fresh
