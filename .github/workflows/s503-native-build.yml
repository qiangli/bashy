name: S503 native whisper.cpp source build

# This is a build and dependency evidence gate. It does not download a model or
# run media inference. The branch push trigger permits first execution before
# this new workflow exists on the default branch.
on:
  push:
    branches: [s503-contract-integration]
    paths:
      - .github/workflows/s503-native-build.yml
      - examples/transcribe/dependencies/build_whisper.py
      - examples/transcribe/dependencies/build_whisper_notices.py
      - examples/transcribe/dependencies/notices/**
      - .gitattributes
      - examples/transcribe/dependencies/prepare_llvm_mingw.py
      - examples/transcribe/dependencies/build-whisper.sh
      - examples/transcribe/dependencies/build-whisper.ps1
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.label }} pinned source build
    runs-on: ${{ matrix.label }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            expected_os: Linux
            expected_arch: amd64
            python_arch: x64
          - label: ubuntu-24.04-arm
            expected_os: Linux
            expected_arch: arm64
            python_arch: arm64
          - label: macos-15-intel
            expected_os: macOS
            expected_arch: amd64
            python_arch: x64
          - label: macos-15
            expected_os: macOS
            expected_arch: arm64
            python_arch: arm64
          - label: windows-2025
            expected_os: Windows
            expected_arch: amd64
            python_arch: x64
          - label: windows-11-arm
            expected_os: Windows
            expected_arch: arm64
            python_arch: arm64
    env:
      EXPECTED_OS: ${{ matrix.expected_os }}
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
      RUNNER_LABEL: ${{ matrix.label }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}

      - name: Record and verify native runner identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          actual_os = {'Linux': 'Linux', 'Darwin': 'macOS', 'Windows': 'Windows'}.get(platform.system(), platform.system())
          process_arch = platform.machine()
          if actual_os == 'Windows':
              raw_arch = subprocess.check_output(
                  ['pwsh', '-NoProfile', '-Command',
                   '[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()'],
                  text=True).strip()
          else:
              raw_arch = platform.uname().machine
          arch = {'x86_64': 'amd64', 'AMD64': 'amd64', 'X64': 'amd64',
                  'aarch64': 'arm64', 'arm64': 'arm64', 'ARM64': 'arm64',
                  'Arm64': 'arm64'}
          actual_arch = arch.get(raw_arch, raw_arch)
          python_arch = arch.get(process_arch, process_arch)
          translated = '0'
          if actual_os == 'macOS':
              result = subprocess.run(['sysctl', '-n', 'sysctl.proc_translated'],
                                      capture_output=True, text=True)
              if result.returncode == 0:
                  translated = result.stdout.strip()
          evidence = {
              'schema': 's503-runner-identity-v1',
              'runner_label': os.environ['RUNNER_LABEL'],
              'expected_os': os.environ['EXPECTED_OS'],
              'expected_arch': os.environ['EXPECTED_ARCH'],
              'actual_os': actual_os,
              'actual_arch': actual_arch,
              'os_arch_raw': raw_arch,
              'process_arch': process_arch,
              'python_arch': python_arch,
              'translated': translated,
              'python': sys.version.split()[0],
              'commit_sha': os.environ['COMMIT_SHA'],
          }
          Path('evidence/runner-identity.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          if (actual_os != evidence['expected_os'] or
                  actual_arch != evidence['expected_arch'] or
                  python_arch != evidence['expected_arch'] or
                  translated == '1'):
              raise SystemExit('runner or Python process is not the expected native target')
          PY

      - name: Build pinned whisper.cpp and record dependency audit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_OS" == Windows ]]; then
            # Hosted LLVM targets MSVC and leaves VC runtime DLL imports.
            # Prepare the exact native llvm-mingw release for this runner.
            export CMAKE_GENERATOR=Ninja
            ninja --version
            python examples/transcribe/dependencies/prepare_llvm_mingw.py \
              --destination "$RUNNER_TEMP/s503-llvm-mingw" \
              --report-file evidence/toolchain-report.json
            WHISPER_WINDOWS_MINGW_ROOT="$(python -c 'import json; print(json.load(open("evidence/toolchain-report.json"))["toolchain_root"])')"
            export WHISPER_WINDOWS_MINGW_ROOT
          fi
          cmake --version
          python examples/transcribe/dependencies/build_whisper.py \
            --work-dir "$RUNNER_TEMP/s503-whisper-build" \
            --report-file evidence/build-report.json \
            --link-map-file evidence/whisper-cli.link.map \
            --parallel 4

      - name: Verify artifact SHA-256 against the build report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import struct
          from pathlib import Path

          report = json.loads(Path('evidence/build-report.json').read_text())
          expected_platform = {'Linux': 'linux', 'macOS': 'darwin', 'Windows': 'windows'}[os.environ['EXPECTED_OS']]
          assert report['platform'] == f"{expected_platform}/{os.environ['EXPECTED_ARCH']}"
          assert report['runner_label'] == os.environ['RUNNER_LABEL']
          assert report['whisper_version'] == '1.9.5'
          assert report['source_archive_sha256'] == 'ff1a9053feb509ff9d7729703355541ae9690073a6b1c40eb692c962e0dc1720'
          assert report['status'] == 'built_and_cached'
          assert report['product_admitted'] is False
          assert report['cpu_only'] and report['portable_cpu'] and report['openmp_disabled'] and report['gpl_free']
          assert '-DGGML_NATIVE=OFF' in report['build_flags']
          if os.environ['EXPECTED_OS'] == 'Windows':
              toolchain = json.loads(Path('evidence/toolchain-report.json').read_text())
              pins = {
                  'amd64': ('x86_64', 187504083, 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'),
                  'arm64': ('aarch64', 181877750, '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba'),
              }
              token, size, sha = pins[os.environ['EXPECTED_ARCH']]
              assert toolchain['platform'] == report['platform']
              assert toolchain['version'] == '20260616'
              assert toolchain['archive_bytes'] == size and toolchain['archive_sha256'] == sha
              assert toolchain['compiler_host_pe_machine'] == {'amd64': '0x8664', 'arm64': '0xaa64'}[os.environ['EXPECTED_ARCH']]
              assert toolchain['compiler_default_target'].startswith(token + '-')
              assert Path(report['compiler_path']).resolve() == Path(toolchain['toolchain_root'], 'bin', 'clang.exe').resolve()
              assert Path(report['cxx_compiler_path']).resolve() == Path(toolchain['toolchain_root'], 'bin', 'clang++.exe').resolve()
              assert Path(toolchain['toolchain_root']).name == f'llvm-mingw-20260616-ucrt-{token}'
              assert not any(name.lower().startswith(('msvcp', 'vcruntime', 'concrt', 'libgcc', 'libstdc++', 'libwinpthread', 'libc++', 'libunwind')) for name in report['imported_libraries'])
          source = Path(report['cached_executable_path'])
          artifact = Path('evidence') / source.name
          shutil.copy2(source, artifact)
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert digest == report['executable_sha256']
          assert artifact.stat().st_size == report['executable_bytes']
          if os.environ['EXPECTED_OS'] == 'Windows':
              link_map = Path('evidence/whisper-cli.link.map')
              inventory = report['link_map_inventory']
              assert inventory['schema'] == 's503-windows-link-map-v1'
              assert Path(report['link_map_path']).resolve() == link_map.resolve()
              assert inventory['binary_name'] == artifact.name
              assert inventory['binary_sha256'] == digest
              assert link_map.is_file() and link_map.stat().st_size == inventory['map_bytes']
              assert hashlib.sha256(link_map.read_bytes()).hexdigest() == inventory['map_sha256']
              assert inventory['archive_members']
              assert all(row['archive'] and row['member'] and row['notice_candidate']
                         for row in inventory['archive_members'])
              Path('evidence/whisper-link-inventory.json').write_text(
                  json.dumps(inventory, indent=2) + '\n')
              with artifact.open('rb') as binary:
                  assert binary.read(2) == b'MZ'
                  binary.seek(0x3c)
                  offset = struct.unpack('<I', binary.read(4))[0]
                  binary.seek(offset)
                  assert binary.read(4) == b'PE\0\0'
                  machine = struct.unpack('<H', binary.read(2))[0]
              assert machine == {'amd64': 0x8664, 'arm64': 0xaa64}[os.environ['EXPECTED_ARCH']]
          elif os.environ['EXPECTED_OS'] == 'Linux':
              link_map = Path('evidence/whisper-cli.link.map')
              inventory = report['link_map_inventory']
              assert inventory['schema'] == 's503-linux-link-map-v1'
              assert Path(report['link_map_path']).resolve() == link_map.resolve()
              assert inventory['binary_name'] == artifact.name
              assert inventory['binary_sha256'] == digest
              assert link_map.is_file() and 0 < link_map.stat().st_size <= 32 << 20
              assert link_map.stat().st_size == inventory['map_bytes']
              assert hashlib.sha256(link_map.read_bytes()).hexdigest() == inventory['map_sha256']
              assert inventory['archive_members']
              assert all(row['archive'] and row['member'] and row['notice_candidate']
                         for row in inventory['archive_members'])
              assert all(row in inventory['archive_members'] for row in inventory['runtime_archive_members'])
              assert not any(name.startswith(('libstdc++', 'libgcc_s'))
                             for name in report['imported_libraries'])
              Path('evidence/whisper-link-inventory.json').write_text(
                  json.dumps(inventory, indent=2) + '\n')
          Path('evidence/binary-sha256.txt').write_text(f'{digest}  {artifact.name}\n')
          print(Path('evidence/binary-sha256.txt').read_text(), end='')
          PY

      - name: Attest native binary provenance
        uses: actions/attest@v4
        with:
          subject-path: evidence/whisper-cli${{ matrix.expected_os == 'Windows' && '.exe' || '' }}

      - name: Package pinned source notices and review gates
        shell: bash
        run: |
          set -euo pipefail
          binary=evidence/whisper-cli
          options=()
          if [[ "$EXPECTED_OS" == Windows ]]; then
            binary+=.exe
            options=(--toolchain-report evidence/toolchain-report.json
                     --inventory evidence/whisper-link-inventory.json
                     --link-map evidence/whisper-cli.link.map)
          fi
          # macOS runners use Bash 3.2, where an empty array under nounset
          # raises an error even after options=(). Limit the relaxation to this call.
          set +u
          python examples/transcribe/dependencies/build_whisper_notices.py \
            --build-report evidence/build-report.json \
            --binary "$binary" \
            --source-archive "$RUNNER_TEMP/s503-whisper-build/whisper.cpp-1.9.5.tar.gz" \
            --output-dir evidence/whisper-notices \
            "${options[@]}"
          set -u

      - name: Upload build evidence and binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s503-native-build-${{ matrix.label }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
