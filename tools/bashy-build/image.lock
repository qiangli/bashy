# The official build image's identity. Every build and test runs in this
# image (tools/bashy-build/run.sh). Change it only with tools/bashy-build/
# build.sh, committing the values it prints.
#
# Rolling: the previous release builds the next one (built_with_digest). If it
# cannot, only the bugs that block that build are fixed, in the new version,
# never in the old release. The new version then rebuilds itself; that
# self-built image is the real one and is what the lock names for its gates.
# The chain starts at the released v1.0.0-rc.35 binary (build.sh seed);
# earlier releases are not rebuilt.
