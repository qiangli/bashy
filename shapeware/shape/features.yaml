# shape feature list (shapeware v0.1). IDs are stable across versions.
# effort is relative size in Fibonacci points (1, 2, 3, 5, 8, 13 = split it).
- id: wish-candidate
  effort: 5
  status: verified
  intent: Import a hand-edited workspace as a ready candidate while the baseline stays active.
  acceptance:
    - S-18 binds the imported candidate ID and revision.
    - S-20 shows the workspace edit, S-23 confirms the baseline is still active, and S-33 confirms the candidate revision differs from it.
- id: verify-candidate
  effort: 3
  status: verified
  intent: Run the trusted verifier on the imported static app candidate.
  acceptance:
    - S-21 reports the candidate revision as verified with a passing verdict.
- id: preview-candidate
  effort: 3
  status: verified
  intent: Return a candidate-specific web preview URL.
  acceptance:
    - S-22 identifies the verified candidate in the URL and payload.
- id: approve-activate
  effort: 3
  status: verified
  critical: true
  intent: Approve and activate the verified candidate for the selected principal.
  acceptance:
    - S-24 reports approval and a passing verdict for the candidate revision.
    - S-25 confirms that revision is active and the candidate is no longer pending.
- id: inspect-status
  effort: 2
  status: verified
  intent: Inspect the active revision and pending candidates, one candidate, and its patch.
  acceptance:
    - S-17 establishes the baseline and S-23 shows the verified pending candidate.
    - S-19 shows the same candidate and S-20 shows its greeting change.
- id: history-versions
  effort: 2
  status: verified
  intent: List the selected principal's versions of the fixture app.
  acceptance:
    - S-26 lists the activated revision and its version name for shape-tester.
- id: undo-restore
  effort: 3
  status: verified
  intent: Undo to the previous revision and restore a named version.
  acceptance:
    - S-27 and S-28 confirm undo returns to the baseline and persists it as active.
    - S-29 and S-30 restore the approved version by name and confirm it stays active.
- id: member-scope
  effort: 3
  status: verified
  critical: true
  intent: Set a shape grant for a circle as the local owner and read it back.
  acceptance:
    - S-31 sets the shape grant for fixture-circle and S-32 reads it back.
    - S-09 rejects an unknown scope name and S-10 accepts edit through scope-name validation.
- id: site-mcp-shaping
  effort: 5
  status: tbd
  intent: Assert the site MCP shaping tools, scoped member access and queuing of unscoped wishes for the owner.
- id: group-shaping
  effort: 8
  status: tbd
  intent: Two members shape one app through the mounted site MCP with owner approval, stale-base refusal and pull/push replay refusal, using a real shaping agent (KI-1).
- id: restore-data-asserted
  effort: 3
  status: tbd
  intent: Assert that app data written before a change is intact after approve and after restore of a named version (KI-2).
- id: mcp-restore-named
  effort: 2
  status: tbd
  intent: A site MCP tool that restores a named version, matching the CLI restore verb (KI-3).
